<html lang="bn">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F9;--surface:#fff;--ink:#1B2340;--muted:#5B6485;--line:#DCE1EE;--accent:#2F5BEA;--accent-ink:#fff;--ok:#1E8E5A;--okbg:#E3F4EC;--bad:#C93C3C;--badbg:#FBE7E7;--warn:#B76E00;--warnbg:#FFF4E0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--surface:#1e1e1e;--ink:#ededed;--muted:#9e9e9e;--line:#3a3a3a;--accent:#d4d4d4;--accent-ink:#121212;--ok:#6fcf97;--okbg:#1d2a24;--bad:#ff8a8a;--badbg:#2a1d1d;--warn:#F5B841;--warnbg:#332612}}
:root[data-theme="dark"]{--bg:#121212;--surface:#1e1e1e;--ink:#ededed;--muted:#9e9e9e;--line:#3a3a3a;--accent:#d4d4d4;--accent-ink:#121212;--ok:#6fcf97;--okbg:#1d2a24;--bad:#ff8a8a;--badbg:#2a1d1d;--warn:#F5B841;--warnbg:#332612}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Inter","Noto Sans Bengali","Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;font-variant-ligatures:common-ligatures;text-rendering:optimizeLegibility;-webkit-text-size-adjust:100%;line-height:1.55;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:16px 16px 24px;max-width:600px;width:100%;margin:0 auto}
h1{font-size:22px;margin:4px 0 12px;font-weight:700}
h2{font-size:17px;margin:18px 0 8px;font-weight:700}
h3{font-size:16px;margin:14px 0 8px;font-weight:600;color:var(--muted)}
.meta{color:var(--muted);font-size:15px;margin-bottom:12px}
.panel,.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;transition:border-color .25s,box-shadow .25s}
.card.flash{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,91,234,.2)}
.row{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.row label{flex:1;font-size:15px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
@media (max-width:520px){.opt-edit-grid{grid-template-columns:1fr}}
.dup-warn{background:var(--warnbg);border:1.5px solid var(--warn);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}
.dup-item{border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.weak-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.weak-row:first-of-type{border-top:0;padding-top:2px}
.opt-edit-row{display:flex;align-items:center;gap:6px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:4px 8px;margin-bottom:6px;min-width:0}
.opt-edit-row.active{border-color:var(--ok);background:var(--okbg)}
.opt-edit-row input[type=radio]{width:20px;height:20px;accent-color:var(--ok);cursor:pointer;flex:none}
.opt-edit-row input[type=text]{border:0;background:none;padding:6px 4px;margin:0;flex:1;min-width:0;width:100%}
.opt-edit-row input[type=text]:focus{outline:none}
.mt-badge{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:#fff;background:var(--bad);padding:3px 10px;border-radius:999px}
select,input[type=number],input[type=datetime-local]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;min-width:130px}
input[type=number]{width:90px;min-width:0}
.sub{display:flex;gap:10px;align-items:center;font-weight:600;padding:6px 0}
.top{display:flex;gap:10px;align-items:center;padding:6px 0 6px 6px;border-top:1px solid var(--line)}
.top span{flex:1}.top small{color:var(--muted)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.btn{width:100%;font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 14px;margin-top:6px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{width:auto;padding:7px 12px;font-size:14px;border-radius:10px;margin:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.notif-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.notif-cnt{background:var(--bad);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;border-radius:999px;padding:0 5px;text-align:center}
.tags{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.tags span{background:var(--bg);border-radius:999px;padding:2px 10px}
.star{margin-left:auto;border:0;background:none;font-size:26px;color:var(--accent);line-height:1;padding:0 4px;cursor:pointer}
.q{font-size:19px;font-weight:400;line-height:1.5;margin:0 0 12px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;min-height:48px;cursor:pointer}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:600}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--badbg);border-color:var(--bad)}.opt.bad b{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{opacity:1}.opt i{margin-left:auto;font-style:normal}
.exp{background:var(--bg);border-radius:10px;padding:8px 12px;font-size:15px;margin-top:6px;white-space:pre-wrap;line-height:1.6}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--accent)}
.total{font-size:34px;font-weight:700;margin:2px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
.chip{font:inherit;font-size:14px;font-weight:600;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:.15s}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.live-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ok);background:var(--okbg);padding:2px 9px;border-radius:999px;vertical-align:middle}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.off-badge{display:inline-block;font-size:12px;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:999px;vertical-align:middle}
.diff-box{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:14px;margin-top:6px;border-left:3px solid var(--muted)}
.edit-box{background:var(--bg);border-radius:10px;padding:10px;margin-top:8px;border-left:3px solid var(--ok)}
.sugg-wrap{position:relative}
.sugg-list{display:none;position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--surface);border:1.5px solid var(--accent);border-radius:10px;min-width:160px;max-height:210px;overflow-y:auto;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.sugg-list.open{display:block}
.sugg-item{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.sugg-item:last-child{border-bottom:0}
.sugg-item:hover,.sugg-item:focus{background:var(--bg)}
.sugg-item small{color:var(--muted);font-size:13px;white-space:nowrap}
.timer-pill{font-size:15px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);white-space:nowrap}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);font-size:15px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:14px}
td:first-child,th:first-child{text-align:left;padding-left:10px}
nav{display:flex;gap:4px;padding:5px 6px calc(5px + env(safe-area-inset-bottom,0px));overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line);background:var(--surface)}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;min-width:64px;font:inherit;font-size:14px;font-weight:500;color:var(--muted);background:none;border:0;border-radius:10px;padding:9px 10px;white-space:nowrap;cursor:pointer;transition:.15s}
nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.opt i{font-style:normal;font-size:13px;color:var(--muted);white-space:nowrap}
input[type=email],input[type=password]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;margin-bottom:4px}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
button,input,select,textarea{font-family:inherit;font-variant-ligatures:common-ligatures}
.q,.opt span,.exp{overflow-wrap:anywhere;word-break:normal}
.opts-4{grid-template-columns:repeat(4,1fr)}.opts-2{grid-template-columns:1fr 1fr}.opts-1{grid-template-columns:1fr}
@media (max-width:520px){.opts-4{grid-template-columns:1fr 1fr}.opts-2{grid-template-columns:1fr}}
.opts-grid{gap:0 10px}
.opt.skipok{background:#fff3b0;border-color:#e0b000;color:#222}
.opt.skipok b{background:#e0b000;border-color:#e0b000;color:#222}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== ১. কনফিগারেশন, গ্লোবাল স্টেট ও ইউটিলিটি ===== */
var FIREBASE_CONFIG={
  apiKey: "AIzaSyBOHxjgB36M-sOZwNHtiij3LMa804A908o",
  authDomain: "corui-academy.firebaseapp.com",
  projectId: "corui-academy",
  storageBucket: "corui-academy.firebasestorage.app",
  messagingSenderId: "683649317136",
  appId: "1:683649317136:web:13d30d9a77ad109ad44d95"
};
var NEG=0.25,SEC_PER_Q=30,PAGE_SIZE=10,ADMIN=false,ADMIN_EMAIL="thesohelranas@gmail.com";
var Q=[],RAW={},BY={},insts=[],MT_LIST=[],TOPIC_LIST=[];
var UID=null,DB=null,booted=false;
var saveTimer=null,draftTimer=null,hbTimer=null,retryT=null,exTimer=null;
var usrUnsub=null,reqUnsub=null,mtUnsub=null;
var STATE_OK=false,saveFailing=false,finishingCount=0,pendingTx=[],APPLIED=[];
var DEFAULT_CFG={topics:{},pool:"new",inst:"",mcq:"",n:10,order:"rand",showTopic:false,reveal:"instant",timer:true};
var S={seen:{},wrong:{},fav:{},st:{},hist:[],exams:[],lang:"en",theme:"auto",cfg:null};
var V_AUTH={mode:"login",msg:"",ok:false};
var app=document.getElementById("app");

function freshAtt(){return {items:[],lastDoc:null,hasMore:false,loading:false,loaded:false,err:""};}
function freshUserAtt(){return {uid:"",items:[],lastDoc:null,hasMore:false,loading:false,loaded:false,err:""};}
function freshMtAtt(){return {items:[],loading:false,loaded:false,err:"",showN:PAGE_SIZE};}
function freshV(){
  return {
    tab:"home",screen:null,cfg:Object.assign({},DEFAULT_CFG,{topics:{}}),
    ex:null,list:null,title:"",filter:"all",lsel:{},draft:{},rev:{},
    homeQ:"",homeShowAns:{},admAllQ:"",edit:null,adm:null,admReqs:false,
    admMT:false,admMTCreate:false,admMTView:null,admPickKey:null,admPickQ:"",admPickId:"",
    admHist:false,admLog:false,admTopics:false,mtFolderOpen:false,
    editReqs:[],pendingCnt:0,myReqs:null,myReqsLoading:false,myReqsErr:"",
    authEmail:"",mtForm:{custom:{},picked:{},exUsed:true,selTopics:{},subjOrder:[],customAuto:{},status:"active"},
    att:freshAtt(),mtAtt:freshMtAtt(),uatt:freshUserAtt(),mtAttended:{},
    usrSel:null,usrExam:null,usrFilter:"wrong",usrTopic:"",usrQ:"",usrList:null,
    reqId:null,imp:null,impF:"all",
    ulog:{items:[],lastDoc:null,hasMore:false,loading:false,err:"",q:"",type:"all"}
  };
}
var V=freshV();

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function hs(s){var n=5381;for(var j=0;j<s.length;j++)n=((n<<5)+n+s.charCodeAt(j))|0;return "q"+(n>>>0).toString(36);}
function normKey(s){return String(s||"").toLowerCase().replace(/\s+/g," ").trim();}
function simKey(s){return String(s||"").toLowerCase().replace(/['"“”‘’`]/g,"").replace(/[_.…\-—]{2,}/g," _ ").replace(/(^|\s)_+(\s|$)/g," _ ").replace(/[?!.,;:()\[\]{}\/\\—\-\u0964]/g," ").replace(/\s+/g," ").trim();}
function fullSimKey(q,o){return simKey(q)+"|"+(o||[]).map(simKey).join("|");}
function setQuestions(arr){Q=arr;BY={};insts=[];Q.forEach(function(x){if(!x.id)x.id=hs((x.q||"")+(x.o||[]).join("|"));BY[x.id]=x;if(x.i&&insts.indexOf(x.i)<0)insts.push(x.i);});}
function bn(n){if((S.lang||"en")==="en")return String(n);return String(n).replace(/\d/g,function(d){return "০১২৩৪৫৬৭৮৯"[d];});}
function optL(){return (S.lang||"en")==="en"?["A","B","C","D"]:["ক","খ","গ","ঘ"];}
function fmt(ms){var d=new Date(ms);return bn(d.toLocaleDateString("en-GB"))+" "+bn(d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}));}
function fmtDay(ms){return bn(new Date(ms).toLocaleDateString("en-GB"));}
function fmtSec(sec){sec=Math.max(0,Math.floor(sec||0));var m=Math.floor(sec/60),s=sec%60;return bn((m<10?"0":"")+m+":"+(s<10?"0":"")+s);}
function toLocalInput(ms){var d=new Date(ms),p=function(n){return (n<10?"0":"")+n;};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function clean(x){var c=JSON.parse(JSON.stringify(x));delete c.id;delete c._finishing;delete c.dirtyCount;delete c.pendingFinish;Object.keys(c).forEach(function(k){if(c[k]===""||c[k]===null||(Array.isArray(c[k])&&!c[k].length))delete c[k];});return c;}
function normalize(d){d=d||{};return {seen:d.seen||{},wrong:d.wrong||{},fav:d.fav||{},st:d.st||{},hist:d.hist||[],exams:d.exams||[],lang:d.lang||"en",theme:d.theme||"auto",cfg:d.cfg||null};}
function applyCfgFromState(){var src=S.cfg||{};V.cfg=Object.assign({},DEFAULT_CFG,src,{topics:Object.assign({},src.topics||{})});}
function applyTheme(){var t=S.theme||"auto";if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme");}
function gv(id){var el=document.getElementById(id);return el?el.value.trim():"";}

/* ===== ২. চলমান পরীক্ষা (localStorage + প্রতি ৫ উত্তরে সার্ভার সিঙ্ক) ===== */
function runKey(uid){return "corui_run_"+uid;}
function readRunLocal(uid){
  if(!uid)return {exams:{}};
  try{var raw=localStorage.getItem(runKey(uid));if(!raw)return {exams:{}};var p=JSON.parse(raw);return (p&&p.exams&&typeof p.exams==="object")?p:{exams:{}};}catch(e){return {exams:{}};}
}
function writeRunLocal(uid,obj){
  if(!uid)return;
  try{if(!Object.keys(obj.exams||{}).length)localStorage.removeItem(runKey(uid));else localStorage.setItem(runKey(uid),JSON.stringify(obj));}catch(e){}
}
function saveRunLocal(ex){
  if(!UID||!ex||!ex.id)return;
  var store=readRunLocal(UID),copy=JSON.parse(JSON.stringify(ex));
  delete copy._finishing;store.exams[ex.id]=copy;writeRunLocal(UID,store);
}
function removeRunLocal(exId){if(!UID||!exId)return;var store=readRunLocal(UID);if(store.exams[exId]){delete store.exams[exId];writeRunLocal(UID,store);}}
function runningExamsOnly(list){
  return (list||[]).filter(function(x){return x&&x.status!=="done";}).map(function(x){
    var c=JSON.parse(JSON.stringify(x));delete c._finishing;delete c.dirtyCount;delete c.pendingFinish;return c;
  });
}
function flushPendingRunningExams(){
  if(!UID||!DB||!STATE_OK)return;
  var changed=false;
  S.exams.forEach(function(x){if(x.status!=="done"&&!x.lock&&(x.dirtyCount||0)>0){x.dirtyCount=0;saveRunLocal(x);changed=true;}});
  if(changed||saveTimer)save(true);
}

/* ===== ৩. Firebase সংরক্ষণ, ট্রানজ্যাকশন, প্রেজেন্স ও সতর্কতা (৬ক) ===== */
function saveBar(msg){
  var el=document.getElementById("savebar");if(!msg){if(el)el.remove();return;}
  if(!el){el=document.createElement("div");el.id="savebar";el.style.cssText="position:fixed;top:0;left:0;right:0;z-index:99;background:#b3261e;color:#fff;padding:8px 12px;text-align:center;font-size:14px";document.body.appendChild(el);}
  el.textContent=msg;
}
function saveFail(on){
  saveFailing=on;
  if(on){saveBar("⚠ সেভ হয়নি। নেট চেক করুন, আবার চেষ্টা চলছে…");clearTimeout(retryT);retryT=setTimeout(retryAll,8000);}
  else if(!pendingTx.length)saveBar("");
}
function hasPendingSaves(){return !!(UID&&(finishingCount>0||pendingTx.length||saveFailing||saveTimer||draftTimer));}
window.addEventListener("beforeunload",function(e){if(hasPendingSaves()){var msg="সেভ বাকি আছে! এখন বন্ধ করলে সর্বশেষ ডেটা হারাতে পারে।";e.preventDefault();e.returnValue=msg;return msg;}});
function save(immediate){
  if(!UID||!DB||!STATE_OK)return;
  var u=UID,d=DB;
  var flush=function(){
    saveTimer=null;S.cfg=Object.assign({},V.cfg);
    var s2=JSON.parse(JSON.stringify(S)),runOnly=runningExamsOnly(s2.exams);
    d.collection("users").doc(u).set({
      state:{fav:s2.fav,exams:runOnly,lang:s2.lang,theme:s2.theme,cfg:s2.cfg},
      updated:Date.now(),lastActive:Date.now(),online:true,email:((firebase.auth().currentUser)||{}).email||""
    },{mergeFields:["state.fav","state.exams","state.lang","state.theme","state.cfg","updated","lastActive","online","email"]})
      .then(function(){saveFail(false);}).catch(function(err){console.warn(err);saveFail(true);});
  };
  clearTimeout(saveTimer);saveTimer=null;
  if(immediate)flush();else saveTimer=setTimeout(flush,400);
}
function retryAll(){
  if(!UID||!DB||!STATE_OK)return;
  save(true);
  var list=pendingTx.slice();pendingTx=[];
  list.forEach(function(p){if(p.kind==="finish")commitFinish(p.ex);else txProgress(p.mut,p.key);});
}
window.addEventListener("online",function(){if(saveFailing||pendingTx.length)retryAll();});
function pingPresence(isOnline){if(!UID||!DB)return;DB.collection("users").doc(UID).set({lastActive:Date.now(),online:!!isOnline,email:((firebase.auth().currentUser)||{}).email||""},{merge:true}).catch(function(){});}
function startPresence(){stopPresence();pingPresence(true);hbTimer=setInterval(function(){if(document.visibilityState==="visible")pingPresence(true);},45000);}
function stopPresence(){if(hbTimer){clearInterval(hbTimer);hbTimer=null;}}
document.addEventListener("visibilitychange",function(){if(UID&&DB){if(document.visibilityState==="hidden")flushPendingRunningExams();pingPresence(document.visibilityState==="visible");}});

/* ===== ৪. প্রোগ্রেস, মাইগ্রেশন (২ক) ও অ্যাটেম্পটস (১গ, ৩ক, ৫ক) ===== */
function computeResultStats(ex){
  var ids=(ex.ids||[]).filter(function(id){return !!BY[id];}),c=0,w=0,exNeg=ex.neg!=null?ex.neg:NEG;
  ids.forEach(function(id){var a=(ex.a||{})[id];if(a===undefined)return;a===BY[id].a?c++:w++;});
  return {n:ids.length,c:c,w:w,sk:ids.length-c-w,sc:c-w*exNeg};
}
function applyFinish(st,ex){
  (ex.ids||[]).forEach(function(id){
    var a=(ex.a||{})[id];if(a===undefined||!BY[id])return;
    st.seen[id]=1;var s3=st.st[id]=st.st[id]||[0,0];
    if(a===BY[id].a){s3[0]++;delete st.wrong[id];}else{s3[1]++;st.wrong[id]=1;}
  });
  var r=ex.r||computeResultStats(ex);
  st.hist.unshift({d:ex.finishedAt||ex.at,t:ex.name,n:r.n,c:r.c,w:r.w,sc:r.sc});st.hist=st.hist.slice(0,30);
}
function computeProgressFromAttempts(attempts){
  var sorted=(attempts||[]).slice().sort(function(a,b){return ((a.finishedAt||a.at||0)-(b.finishedAt||b.at||0));});
  var seen={},wrong={},st={},hist=[];
  sorted.forEach(function(ex){
    (ex.ids||[]).forEach(function(id){
      var a=(ex.a||{})[id];if(a===undefined||!BY[id])return;
      seen[id]=1;var s3=st[id]=st[id]||[0,0];
      if(a===BY[id].a){s3[0]++;delete wrong[id];}else{s3[1]++;wrong[id]=1;}
    });
    var r=ex.r||computeResultStats(ex);
    hist.unshift({d:ex.finishedAt||ex.at||0,t:ex.name,n:r.n,c:r.c,w:r.w,sc:r.sc});
  });
  return {seen:seen,wrong:wrong,st:st,hist:hist.slice(0,30)};
}
function txProgress(mut,key){
  if(!UID||!DB)return Promise.resolve();
  var u=UID,ref=DB.collection("users").doc(u);
  return DB.runTransaction(function(tx){
    return tx.get(ref).then(function(sn){
      if(UID!==u)return null;
      var d=sn.data()||{},srv=normalize(d.state),ap=(d.applied||[]).slice();
      if(key&&ap.indexOf(key)>=0)return srv;
      mut(srv);if(key)ap.push(key);
      tx.set(ref,{state:{seen:srv.seen,wrong:srv.wrong,st:srv.st,hist:srv.hist},applied:ap.slice(-300),updated:Date.now()},{mergeFields:["state.seen","state.wrong","state.st","state.hist","applied","updated"]});
      return srv;
    });
  }).then(function(srv){
    if(!srv||UID!==u)return;
    S.seen=srv.seen;S.wrong=srv.wrong;S.st=srv.st;S.hist=srv.hist;saveFail(false);
    if(V.tab==="home"&&!V.screen)render();
  }).catch(function(err){console.warn(err);pendingTx.push({kind:"tx",mut:mut,key:key});saveFail(true);});
}
function commitFinish(exRaw){
  if(!UID||!DB)return Promise.resolve();
  var exCopy=JSON.parse(JSON.stringify(exRaw));
  delete exCopy._finishing;delete exCopy.dirtyCount;delete exCopy.pendingFinish;
  var u=UID,d=DB,userRef=d.collection("users").doc(u),attRef=userRef.collection("attempts").doc(exCopy.id);
  finishingCount++;
  return d.runTransaction(function(tx){
    return Promise.all([tx.get(userRef),tx.get(attRef)]).then(function(res){
      if(UID!==u)return null;
      var sn=res[0],attSn=res[1],data=sn.data()||{},srv=normalize(data.state),ap=(data.applied||[]).slice(),key="f:"+exCopy.id;
      srv.exams=runningExamsOnly(srv.exams).filter(function(x){return x.id!==exCopy.id;});
      if(attSn.exists||ap.indexOf(key)>=0){
        tx.set(userRef,{state:{exams:srv.exams},updated:Date.now()},{mergeFields:["state.exams","updated"]});
        return {alreadyDone:true,srv:srv,existing:attSn.exists?attSn.data():null};
      }
      applyFinish(srv,exCopy);ap.push(key);
      tx.set(attRef,exCopy);
      tx.set(userRef,{
        state:{seen:srv.seen,wrong:srv.wrong,st:srv.st,hist:srv.hist,exams:srv.exams},
        applied:ap.slice(-300),updated:Date.now(),lastActive:Date.now(),online:true
      },{mergeFields:["state.seen","state.wrong","state.st","state.hist","state.exams","applied","updated","lastActive","online"]});
      return {alreadyDone:false,srv:srv};
    });
  }).then(function(res){
    finishingCount=Math.max(0,finishingCount-1);
    if(!res||UID!==u)return;
    var srv=res.srv;
    S.seen=srv.seen;S.wrong=srv.wrong;S.st=srv.st;S.hist=srv.hist;
    S.exams=runningExamsOnly(S.exams).filter(function(x){return x.id!==exCopy.id;});
    removeRunLocal(exCopy.id);
    if(exCopy.lock)d.collection("users").doc(u).collection("drafts").doc(exCopy.id).delete().catch(function(){});
    if(res.alreadyDone){
      if(res.existing){
        if(V.ex&&V.ex.id===exCopy.id)V.ex=res.existing;
        if(res.existing.mtId)V.mtAttended[res.existing.mtId]=res.existing;
        if(V.att.loaded)V.att.items=[res.existing].concat(V.att.items.filter(function(x){return x.id!==res.existing.id;}));
      }
      saveFail(false);
      alert(S.lang==="bn"?"এই পরীক্ষাটি ইতিমধ্যে অন্য ডিভাইস থেকে জমা দেওয়া হয়েছে!":"This exam was already submitted from another device!");
      render();
      return;
    }
    if(exCopy.mtId){
      var em=((firebase.auth().currentUser)||{}).email||"",r=exCopy.r||computeResultStats(exCopy);
      d.collection("modelTests").doc(exCopy.mtId).collection("scores").doc(u).set({uid:u,email:em,c:r.c,w:r.w,sk:r.sk,sc:r.sc,finishedAt:exCopy.finishedAt}).catch(function(err){console.warn(err);});
    }
    saveFail(false);
  }).catch(function(err){
    finishingCount=Math.max(0,finishingCount-1);console.warn(err);
    var pCopy=JSON.parse(JSON.stringify(exCopy));pCopy.pendingFinish=true;saveRunLocal(pCopy);
    if(!pendingTx.some(function(p){return p.kind==="finish"&&p.ex.id===exCopy.id;}))pendingTx.push({kind:"finish",ex:exCopy});
    saveFail(true);
  });
}
function migrateOldExams(){
  if(!UID||!DB||!STATE_OK)return Promise.resolve();
  var oldDone=S.exams.filter(function(x){return x&&x.status==="done";});
  if(!oldDone.length)return Promise.resolve();
  var u=UID,d=DB,chunks=[];for(var i=0;i<oldDone.length;i+=400)chunks.push(oldDone.slice(i,i+400));
  return chunks.reduce(function(p,chunk){
    return p.then(function(){
      var b=d.batch();
      chunk.forEach(function(ex){
        var c=JSON.parse(JSON.stringify(ex));if(!c.finishedAt)c.finishedAt=c.at||Date.now();c.status="done";
        if(c.mtId)V.mtAttended[c.mtId]=c;
        b.set(d.collection("users").doc(u).collection("attempts").doc(c.id),c,{merge:true});
      });
      return b.commit();
    });
  },Promise.resolve()).then(function(){
    if(UID!==u)return;
    S.exams=runningExamsOnly(S.exams);
    return d.collection("users").doc(u).update({"state.exams":S.exams,updated:Date.now()});
  }).catch(function(err){console.warn("মাইগ্রেশন:",err);});
}
function mergeLocalRunningExams(){
  if(!UID)return;
  var localMap=readRunLocal(UID).exams,del=S._adminDeleted||[],byId={};
  runningExamsOnly(S.exams).forEach(function(x){byId[x.id]=x;});
  Object.keys(localMap).forEach(function(id){
    var loc=localMap[id];if(!loc)return;
    if(del.indexOf(id)>=0){removeRunLocal(id);return;}
    if(loc.pendingFinish){delete byId[id];if(APPLIED.indexOf("f:"+id)>=0){removeRunLocal(id);return;}commitFinish(loc);return;}
    if(loc.status==="done"){removeRunLocal(id);return;}
    var srv=byId[id];if(!srv){byId[id]=loc;return;}
    if(loc.lock){srv.a=Object.assign({},loc.a||{},srv.a||{});if((loc.updatedAt||0)>(srv.updatedAt||0)&&loc.left!=null)srv.left=loc.left;byId[id]=srv;}
    else if((loc.updatedAt||0)>(srv.updatedAt||0))byId[id]=loc;
  });
  S.exams=Object.keys(byId).map(function(k){return byId[k];});
}
function loadMoreAttempts(reset,includeMT){
  if(!UID||!DB||V.att.loading||(!reset&&!V.att.hasMore))return;
  V.att.loading=true;V.att.err="";
  var items=reset?[]:V.att.items.slice(),seen={},cursor=reset?null:V.att.lastDoc,added=0;
  items.forEach(function(x){seen[x.id]=1;});
  function step(){
    var qy=DB.collection("users").doc(UID).collection("attempts").orderBy("finishedAt","desc");
    if(cursor)qy=qy.startAfter(cursor);
    return qy.limit(PAGE_SIZE).get().then(function(snap){
      snap.forEach(function(doc){
        var d=doc.data();
        if(d){
          if(d.mtId)V.mtAttended[d.mtId]=d;
          if(!seen[d.id]&&(includeMT||!d.mtId)){seen[d.id]=1;items.push(d);added++;}
        }
      });
      cursor=snap.docs.length?snap.docs[snap.docs.length-1]:cursor;
      var more=snap.docs.length===PAGE_SIZE;
      if(more&&!includeMT&&added<PAGE_SIZE)return step();
      V.att={items:items,lastDoc:cursor,hasMore:more,loading:false,loaded:true,err:""};
      render();
    });
  }
  step().catch(function(err){V.att.loading=false;V.att.loaded=true;V.att.err=err.message;render();});
}
function loadMTFolderAttempts(){
  if(!UID||!DB||V.mtAtt.loading)return;
  V.mtAtt.loading=true;V.mtAtt.err="";
  DB.collection("users").doc(UID).collection("attempts").where("mtId",">","").get().then(function(snap){
    var items=[],seen={};
    snap.forEach(function(doc){var d=doc.data();if(d&&!seen[d.id]){seen[d.id]=1;items.push(d);V.mtAttended[d.mtId]=d;}});
    Object.keys(V.mtAttended).forEach(function(mtId){var x=V.mtAttended[mtId];if(x&&x.ids&&!seen[x.id]){seen[x.id]=1;items.push(x);}});
    items.sort(function(a,b){return (b.finishedAt||b.at||0)-(a.finishedAt||a.at||0);});
    V.mtAtt={items:items,loading:false,loaded:true,err:"",showN:V.mtAtt.showN||PAGE_SIZE};
    render();
  }).catch(function(err){V.mtAtt.loading=false;V.mtAtt.loaded=true;V.mtAtt.err=err.message;render();});
}
function loadUserAttempts(uid,reset){
  if(!uid||!DB)return;
  if(V.uatt.uid===uid&&V.uatt.loading)return;
  if(V.uatt.uid!==uid){reset=true;V.uatt=freshUserAtt();V.uatt.uid=uid;}
  if(!reset&&!V.uatt.hasMore)return;
  V.uatt.loading=true;V.uatt.err="";
  var qy=DB.collection("users").doc(uid).collection("attempts").orderBy("finishedAt","desc");
  if(!reset&&V.uatt.lastDoc)qy=qy.startAfter(V.uatt.lastDoc);
  qy.limit(PAGE_SIZE).get().then(function(snap){
    if(V.uatt.uid!==uid)return;
    var items=reset?[]:V.uatt.items.slice(),seen={};items.forEach(function(x){seen[x.id]=1;});
    snap.forEach(function(doc){var d=doc.data();if(d&&!seen[d.id]){seen[d.id]=1;items.push(d);}});
    V.uatt={uid:uid,items:items,lastDoc:snap.docs.length?snap.docs[snap.docs.length-1]:(reset?null:V.uatt.lastDoc),hasMore:snap.docs.length===PAGE_SIZE,loading:false,loaded:true,err:""};
    render();
  }).catch(function(err){V.uatt.loading=false;V.uatt.loaded=true;V.uatt.err=err.message;render();});
}
function syncAfterAttemptDelete(uid,ex,isAdminDel){
  var uRef=DB.collection("users").doc(uid);
  var jobs=[uRef.collection("attempts").doc(ex.id).delete().catch(function(){}),uRef.collection("drafts").doc(ex.id).delete().catch(function(){})];
  if(ex.mtId)jobs.push(DB.collection("modelTests").doc(ex.mtId).collection("scores").doc(uid).delete().catch(function(){}));
  return Promise.all(jobs).then(function(){return uRef.collection("attempts").get();}).then(function(snap){
    var all=[];snap.forEach(function(d){var dat=d.data();if(dat&&dat.id!==ex.id)all.push(dat);});
    var prog=computeProgressFromAttempts(all);
    return DB.runTransaction(function(tx){
      return tx.get(uRef).then(function(sn){
        var data=sn.data()||{},srv=normalize(data.state),remRun=runningExamsOnly(srv.exams).filter(function(x){return x.id!==ex.id;});
        var updObj={"state.seen":prog.seen,"state.wrong":prog.wrong,"state.st":prog.st,"state.hist":prog.hist,"state.exams":remRun,updated:Date.now()};
        if(isAdminDel){var ad=(data.adminDeleted||[]).slice();if(ad.indexOf(ex.id)<0)ad.push(ex.id);updObj.adminDeleted=ad.slice(-100);}
        tx.update(uRef,updObj);
        return {prog:prog,exams:remRun};
      });
    });
  });
}

function idb(){return new Promise(function(res,rej){var r=indexedDB.open("corui-quiz",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv");};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function cacheGet(){return idb().then(function(db){return new Promise(function(res){var t=db.transaction("kv").objectStore("kv").get("questions");t.onsuccess=function(){res(t.result||null);};t.onerror=function(){res(null);};});}).catch(function(){return null;});}
function cachePut(v){return idb().then(function(db){return new Promise(function(res){var t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,"questions");t.oncomplete=function(){res();};t.onerror=function(){res();};});}).catch(function(){});}
function maxUpdOf(map){var m=0;Object.keys(map).forEach(function(k){if((map[k].upd||0)>m)m=map[k].upd||0;});return m;}
function syncQuestionCache(){return cachePut({ver:1,map:RAW,maxUpd:maxUpdOf(RAW),at:Date.now()});}
function buildFrom(map){
  var out={};Object.keys(map).forEach(function(id){var data=map[id];if(data&&!data.deleted)out[id]=Object.assign({},data,{id:id});});
  var arr=Object.keys(out).map(function(k){return out[k];});arr.sort(function(a,b){return (a.ord||0)-(b.ord||0);});
  setQuestions(arr);
}
function loadQuestions(){
  return cacheGet().then(function(c){
    var have=(c&&c.ver===1&&c.map)?c:null,map=have?have.map:{},maxUpd=have?(have.maxUpd||0):0;
    var qy=have?DB.collection("questions").where("upd",">",maxUpd):DB.collection("questions");
    return qy.get().then(function(snap){
      snap.forEach(function(d){var data=d.data();map[d.id]=data;if((data.upd||0)>maxUpd)maxUpd=data.upd||0;});
      RAW=map;buildFrom(map);return cachePut({ver:1,map:map,maxUpd:maxUpd,at:Date.now()});
    }).catch(function(err){if(have){RAW=map;buildFrom(map);return;}throw err;});
  });
}

function sortTopics(names,getQs,mode,availFn){

  else if(mode==="weak")cmp=function(x,y){var xa=x.pct===null,ya=y.pct===null;if(xa!==ya)return xa?1:-1;if(!xa&&x.pct!==y.pct)return x.pct-y.pct;return (y.wr-x.wr)||byName(x,y);};

function weightedPick(list,n){
  var groups={};list.forEach(function(x){var k=x.s+"||"+x.t;(groups[k]=groups[k]||[]).push(x);});
  var keys=Object.keys(groups),w={};
  keys.forEach(function(k){var qs=groups[k],size=qs.length,att=0,wr=0,fav=0;qs.forEach(function(x){var s=S.st[x.id];if(s){att+=s[0]+s[1];wr+=s[1];}if(S.fav[x.id])fav++;});w[k]=size*(1+(att?wr/att:0)+0.5*(fav/size));});
  var alloc={},total=function(){return keys.reduce(function(a,k){return a+(alloc[k]||0);},0);},guard=0;
  while(total()<n&&guard++<1000){
    var open=keys.filter(function(k){return (alloc[k]||0)<groups[k].length;});if(!open.length)break;
    var sumW=open.reduce(function(a,k){return a+w[k];},0),need=n-total(),progressed=false;

function usrExamView(){
  var u=(V.usrList||[]).filter(function(x){return x.uid===V.usrSel;})[0],st=u?stOf(u):null;
  var x=(V.uatt.items||[]).filter(function(e){return e.id===V.usrExam;})[0]||(st?st.exams.filter(function(e){return e.id===V.usrExam;})[0]:null);

  var f=V.usrFilter||"wrong",ids=(x.ids||[]).filter(function(id){return !!BY[id];}),exNeg=x.neg!=null?x.neg:NEG;
  var cats={all:ids,right:[],wrong:[],skip:[]},sjL=[],sjM={};
  ids.forEach(function(id){
    var q=BY[id],a=(x.a||{})[id],s0=q.s;
    if(!sjM[s0]){sjM[s0]={c:0,w:0,sk:0,n:0};sjL.push(s0);}

    else if(a===q.a){cats.right.push(id);m0.c++;}

  h+='<div class="chips">'+[["wrong","ভুল"],["right","সঠিক"],["skip","স্কিপ"],["all","সব"]].map(function(l){return '<button class="chip" data-ufilter="'+l[0]+'" aria-pressed="'+(f===l[0])+'">'+l[1]+' ('+bn(cats[l[0]].length)+')</button>';}).join("")+'</div>';
  var shown=cats[f]||[];if(!shown.length)h+='<div class="panel meta">এই ফিল্টারে কোনো প্রশ্ন নেই।</div>';

}

TR_PAIRS.sort(function(a,b){return b[0].length-a[0].length;});
function tr(html){if((S.lang||"en")!=="en")return html;html=html.replace(/(\d)\s*(টি|জন)/g,"$1");for(var i=0;i<TR_PAIRS.length;i++)html=html.split(TR_PAIRS[i][0]).join(TR_PAIRS[i][1]);return html;}
function trDom(root){
  if((S.lang||"en")!=="en"||!root)return;
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),nodes=[];
  while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(function(n){var p=n.parentNode;if(p&&p.closest&&p.closest(".q,.opt span,.exp,[data-notr],.sugg-list,.dup-warn"))return;var t=n.nodeValue;if(!/[\u0980-\u09FF]/.test(t))return;n.nodeValue=tr(t);});

}

  if(t.dataset.act==="mt-new"){navPush(function(){V.admMTCreate=true;V.mtForm={custom:{},picked:{},exUsed:true,selTopics:{},subjOrder:[],customAuto:{},status:"active"};});return;}
  if(t.dataset.act==="mt-edit")return openEditModelTest(t.dataset.mtid);
  if(t.dataset.act==="mt-list"){V.admMTCreate=false;V.admMTView=null;return render();}
  if(t.dataset.act==="mt-details"){navPush(function(){V.admMTView=t.dataset.mtid;});return;}
  if(t.dataset.act==="mt-release-all")return releaseAllMT(t.dataset.mtid);
  if(t.dataset.act==="mt-rel-one")return toggleOneQRelease(t.dataset.mtid,t.dataset.qid,false);
  if(t.dataset.act==="mt-lock-one")return toggleOneQRelease(t.dataset.mtid,t.dataset.qid,true);
  if(t.dataset.act==="mt-del")return deleteModelTest(t.dataset.mtid);
  if(t.dataset.act==="mt-lb")return showMTLeaderboard(t.dataset.mtid);
  if(t.dataset.act==="mt-pick-open"){V.mtFormScroll=app.scrollTop;navPush(function(){V.admPickKey=t.dataset.key;V.admPickQ="";V.admPickId="";V.mtForm.pickInst="";});return;}
  if(t.dataset.act==="mt-subj-up"||t.dataset.act==="mt-subj-down"){
    var ord=mtActiveSubjects(V.mtForm),si=ord.indexOf(t.dataset.subj),sj2=t.dataset.act==="mt-subj-up"?si-1:si+1;
    if(si>=0&&sj2>=0&&sj2<ord.length){var tmpS=ord[si];ord[si]=ord[sj2];ord[sj2]=tmpS;V.mtForm.subjOrder=ord;}
    var ys=app.scrollTop;render();app.scrollTop=ys;return;
  }
  if(t.dataset.act==="mt-pick-all"||t.dataset.act==="mt-pick-none"){
    V.mtForm.picked=V.mtForm.picked||{};var on=t.dataset.act==="mt-pick-all";
    admMTPickFiltered().forEach(function(x){V.mtForm.picked[x.id]=on;});
    var ya=app.scrollTop;render();app.scrollTop=ya;return;
  }
  if(t.dataset.act==="exmore"){V.exMore=!V.exMore;var ym2=app.scrollTop;render();app.scrollTop=ym2;return;}
  if(t.dataset.act==="exunans"){V.exUnans=!V.exUnans;var yu=app.scrollTop;render();app.scrollTop=yu;return;}
  if(t.dataset.act==="expdf"){printExamPdf(V.ex,false);return;}
  if(t.dataset.act==="exsubj"){V.exSubj=t.dataset.subj||"";var ysu=app.scrollTop;render();app.scrollTop=ysu;return;}
  if(t.dataset.act==="revq"){V.rev=V.rev||{};V.rev[t.dataset.qid]=!V.rev[t.dataset.qid];var yr=app.scrollTop;render();app.scrollTop=yr;return;}
  if(t.dataset.act==="mt-pick-done"){
    var pk=V.admPickKey;
    if(pk){
      var pp=pk.split("||"),cntP=Q.filter(function(x){return x.s===pp[0]&&x.t===pp[1]&&V.mtForm.picked&&V.mtForm.picked[x.id];}).length;
      V.mtForm.custom=V.mtForm.custom||{};V.mtForm.customAuto=V.mtForm.customAuto||{};
      if(cntP===0){if(V.mtForm.customAuto[pk]){delete V.mtForm.custom[pk];delete V.mtForm.customAuto[pk];}}
      else if(!V.mtForm.custom[pk]||V.mtForm.customAuto[pk]){V.mtForm.custom[pk]=String(cntP);V.mtForm.customAuto[pk]=true;}
    }
    V.admPickKey=null;render();app.scrollTop=V.mtFormScroll||0;return;
  }
  if(t.dataset.act==="mt-join"){
    var mt=MT_LIST.filter(function(x){return x.id===t.dataset.mtid;})[0];if(!mt)return;
    var runMT=S.exams.filter(function(x){return x.mtId===mt.id&&x.status!=="done";})[0];
    if(runMT){navPush(function(){V.ex=runMT;V.title=runMT.name;V.filter="all";V.screen="exam";});return;}
    if(hasAttendedMT(mt.id)){alert("আপনি ইতিমধ্যে এই মডেল টেস্টে অংশ নিয়েছেন।");return;}
    if(mt.endAt<=Date.now()){alert("মডেল টেস্টের সময় শেষ হয়ে গেছে।");return;}
    t.disabled=true;var exId="ex_"+mt.id;
    Promise.all([
      DB.collection("users").doc(UID).collection("attempts").where("mtId","==",mt.id).limit(1).get(),
      DB.collection("users").doc(UID).get()
    ]).then(function(res){
      t.disabled=false;
      if(!res[0].empty){var att0=res[0].docs[0].data();V.mtAttended[mt.id]=att0;alert("আপনি ইতিমধ্যে এই মডেল টেস্টে অংশ নিয়েছেন।");render();return;}
      var srvSt=normalize((res[1].data()||{}).state);
      var srvRun=srvSt.exams.filter(function(x){return x.id===exId&&x.status!=="done";})[0];
      if(srvRun){
        S.exams=runningExamsOnly(S.exams).filter(function(x){return x.id!==exId;}).concat([srvRun]);
        loadDrafts().then(function(){navPush(function(){V.ex=srvRun;V.title=srvRun.name;V.filter="all";V.screen="exam";});});
        return;
      }
      var validIds=mt.qids.filter(function(id){return !!BY[id];});
      if(!validIds.length){alert("এই মডেল টেস্টে কোনো প্রশ্ন পাওয়া যায়নি।");return;}
      var remWin=Math.max(1,Math.floor((mt.endAt-Date.now())/1000)),joinDur=mt.dur>0?Math.min(mt.dur,remWin):remWin;
      begin(mtOrderIds(validIds,mt.subjOrder),mt.title,{id:exId,dur:joinDur,reveal:"end",showTopic:false,mtId:mt.id,neg:mt.neg!=null?mt.neg:NEG,mode:"subject",lock:!!mt.lockOpt});
    }).catch(function(err){t.disabled=false;alert("চেক করা যায়নি: "+err.message);});
    return;
  }
  if(t.dataset.act==="mt-res"){
    var myEx=(V.mtAttended[t.dataset.mtid]&&V.mtAttended[t.dataset.mtid].ids)?V.mtAttended[t.dataset.mtid]:V.mtAtt.items.filter(function(x){return x.mtId===t.dataset.mtid;})[0];
    if(myEx){navPush(function(){V.ex=myEx;V.title=myEx.name;V.filter="all";V.screen="result";});}
    else showMTLeaderboard(t.dataset.mtid);
    return;
  }
});

app.addEventListener("change",function(e){
  var t=e.target,c=V.cfg;
  if(t.dataset&&t.dataset.radpfx)return;
  if(t.dataset.histq!==undefined){V.histQ=t.value;return render();}
  if(t.id==="ulog-type"){V.ulog.type=t.value;return renderUsageLogList();}
  if(t.dataset.impmap!==undefined){if(V.imp){V.imp.topicMap=V.imp.topicMap||{};V.imp.topicMap[t.dataset.impmap]=t.value;}var ym3=app.scrollTop;render();app.scrollTop=ym3;return;}
  if(t.dataset.impnew!==undefined){V.imp.items[+t.dataset.i].skipNew=(t.value==="skip");var yn=app.scrollTop;render();app.scrollTop=yn;return;}
  if(t.dataset.impsame!==undefined){V.imp.items[+t.dataset.i].choiceSame=t.value;var ys=app.scrollTop;render();app.scrollTop=ys;return;}
  if(t.dataset.impf!==undefined){var ii2=+t.dataset.i,jj2=+t.dataset.j;V.imp.items[ii2].diffs[jj2].choice=t.value;var yi=app.scrollTop;render();app.scrollTop=yi;return;}
  if(t.dataset.lsel!==undefined){V.lockSel=V.lockSel||{};V.lockSel[t.dataset.lsel]=t.checked;return;}
  if(t.dataset.act==="mt-pick-tog"){V.mtForm.picked=V.mtForm.picked||{};V.mtForm.picked[t.dataset.qid]=t.checked;var yp=app.scrollTop;render();app.scrollTop=yp;return;}
  if(t.dataset.mtcust){V.mtForm.custom=V.mtForm.custom||{};V.mtForm.custom[t.dataset.mtcust]=t.value;V.mtForm.customAuto=V.mtForm.customAuto||{};delete V.mtForm.customAuto[t.dataset.mtcust];var yc=app.scrollTop;render();app.scrollTop=yc;return;}
  if(t.id==="mt_lock_opt"){V.mtForm.lockOpt=t.checked;return;}
  if(t.id==="mt_status"){V.mtForm.status=t.value;return;}
  if(t.id==="mt-pick-filter"){V.mtForm.filter=t.value;var yf=app.scrollTop;render();app.scrollTop=yf;return;}
  if(t.id==="mt-pick-inst"){V.mtForm.pickInst=t.value;var yi2=app.scrollTop;render();app.scrollTop=yi2;return;}
  if(t.id&&/^mt_/.test(t.id)){
    var mf=V.mtForm;if(t.id==="mt_ex_used")mf.exUsed=t.checked;else{var mk={mt_title:"title",mt_start:"startAt",mt_end:"endAt",mt_dur:"durMin",mt_neg:"neg",mt_tot:"tot"}[t.id];if(mk)mf[mk]=t.value;}
    var ym=app.scrollTop;render();app.scrollTop=ym;return;
  }
  if(t.dataset.imppfx!==undefined)return;
  if(t.id&&/^(a_|r_|rr_|tl_|mt_|imp|em|pw|exname|lname|home-q|adm-all-q|usr-q|ulog-q)/.test(t.id))return;
  if(t.dataset.usrtopic!==undefined){V.usrTopic=t.value;return render();}
  if(t.dataset.admsort){V.adm.sort=t.value;return render();}
  if(t.dataset.admtext){V.adm.text=t.value;return render();}
  if(t.dataset.grp){var gp=t.dataset.grp.split("||");Q.forEach(function(x){if(x.s===gp[0]&&gname(x)===gp[1])c.topics[x.s+"||"+x.t]=t.checked;});save(false);var y2=app.scrollTop;render();app.scrollTop=y2;return;}
  if(t.dataset.lkind){
    var k=t.dataset.lkind;V.lsel=V.lsel||{};V.lsel[k]=V.lsel[k]||{};var m=V.lsel[k];
    if(t.dataset.ltop)m[t.dataset.ltop]=t.checked;
    else if(t.dataset.lsub)Q.forEach(function(x){if(x.s===t.dataset.lsub&&S[k][x.id])m[x.s+"||"+x.t]=t.checked;});
    else if(t.dataset.lgrp){var gq=t.dataset.lgrp.split("||");Q.forEach(function(x){if(x.s===gq[0]&&gname(x)===gq[1]&&S[k][x.id])m[x.s+"||"+x.t]=t.checked;});}
    var y0=app.scrollTop;render();app.scrollTop=y0;return;
  }
  if(t.dataset.cfg){c[t.dataset.cfg]=t.type==="checkbox"?t.checked:t.value;save(false);}
  else if(t.dataset.top){c.topics[t.dataset.top]=t.checked;save(false);}
  else if(t.dataset.sub){Q.forEach(function(x){if(x.s===t.dataset.sub)c.topics[x.s+"||"+x.t]=t.checked;});save(false);}
  var y=app.scrollTop;render();app.scrollTop=y;
});

app.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="exname"||t.id==="lname")V.draft[t.id]=t.value;
  else if(t.id==="em")V.authEmail=t.value;
  else if(t.id==="home-q"){V.homeQ=t.value;renderHomeSearch();}
  else if(t.id==="adm-all-q"){V.admAllQ=t.value;renderAdmSearch();}
  else if(t.id==="usr-q"){V.usrQ=t.value;renderUserList();}
  else if(t.id==="ulog-q"){V.ulog.q=t.value;renderUsageLogList();}
  else if(t.id==="mt-pick-id"){V.admPickId=t.value;var lst0=document.getElementById("mt-pick-list");if(lst0){lst0.innerHTML=admMTPickListHtml();trDom(lst0);}}
  else if(t.id==="mt-pick-srch"){V.admPickQ=t.value;var lst=document.getElementById("mt-pick-list");if(lst){lst.innerHTML=admMTPickListHtml();trDom(lst);}}
  else if(t.dataset.imppfx!==undefined){
    var sub=t.dataset.imppfx,cleanP=t.value.toUpperCase().replace(/[^A-Z]/g,"");
    if(V.imp){V.imp.customPfx=V.imp.customPfx||{};V.imp.customPfx[sub]=cleanP;}
    if(t.value!==cleanP)t.value=cleanP;
    if(V.imp)V.imp.items.forEach(function(x){if(x.status==="new"&&!x.json.id&&resolvedItemSubj(x)===sub){var el=document.querySelector('[data-impid="'+x.i+'"]');if(el)el.textContent=cleanP?(cleanP+"…"):"অক্ষর দিন";}});
  }
  else if(t.id==="a_s")showSugg("s",t.value);
  else if(t.id==="a_t")showSugg("t",t.value);
  else if(t.id==="a_src")showSugg("i",t.value);
  else if(t.id==="a_q")checkAdminDup();
});

document.getElementById("nav").addEventListener("click",function(e){var t=e.target.closest("button");if(t)goTab(t.dataset.tab);});
boot();
