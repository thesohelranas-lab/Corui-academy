<style>
:root{--bg:#F3F5F9;--surface:#fff;--ink:#1B2340;--muted:#5B6485;--line:#DCE1EE;--accent:#2F5BEA;--accent-ink:#fff;--ok:#1E8E5A;--okbg:#E3F4EC;--bad:#C93C3C;--badbg:#FBE7E7;

:root[data-theme="dark"]{--bg:#10142A;--surface:#1A2040;--ink:#E8ECFA;--muted:#9AA3C7;--line:#2C3560;--accent:#7C9BFF;--accent-ink:#10142A;--ok:#4FD39A;--okbg:#12342A;--bad:#FF8585;--badbg:#3A1C26}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;font-size:17px;line-height:1.55;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:16px 16px 24px;max-width:600px;width:100%;margin:0 auto}
h1{font-size:22px;margin:4px 0 12px;font-weight:700}
h2{font-size:17px;margin:18px 0 8px;font-weight:700}
.meta{color:var(--muted);font-size:15px;margin-bottom:12px}
.panel,.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.row label{flex:1;font-size:15px;color:var(--muted)}
select,input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;min-width:130px}
input[type=number]{width:90px;min-width:0}
.sub{display:flex;gap:10px;align-items:center;font-weight:600;padding:6px 0}
.top{display:flex;gap:10px;align-items:center;padding:6px 0 6px 6px;border-top:1px solid var(--line)}
.top span{flex:1}.top small{color:var(--muted)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.btn{width:100%;font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:13px;margin-top:6px}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45}
.tags{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.tags span{background:var(--bg);border-radius:999px;padding:1px 10px}
.star{margin-left:auto;border:0;background:none;font-size:26px;color:var(--accent);line-height:1;padding:0 4px}
.q{font-size:19px;font-weight:600;line-height:1.5;margin:0 0 12px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;min-height:48px}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:600}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--badbg);border-color:var(--bad)}.opt.bad b{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{opacity:1}.opt i{margin-left:auto;font-style:normal}
.exp{background:var(--bg);border-radius:10px;padding:8px 12px;font-size:15px;margin-top:4px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.total{font-size:34px;font-weight:700;margin:2px 0}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);font-size:15px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:14px}
td:first-child,th:first-child{text-align:left;padding-left:10px}
nav{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;font:inherit;font-weight:500;color:var(--muted);background:none;border:0;padding:12px 0}
nav button[aria-current="page"]{color:var(--accent);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.opt i{font-style:normal;font-size:13px;color:var(--muted);white-space:nowrap}
input[type=email],input[type=password]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;margin-bottom:4px}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
</style>
</head>

function weightedPick(list,n){
  var groups={};
  list.forEach(function(x){var k=x.s+"||"+x.t;(groups[k]=groups[k]||[]).push(x);});
  var keys=Object.keys(groups), w={};
  keys.forEach(function(k){
    var qs=groups[k],size=qs.length,att=0,wr=0,fav=0;
    qs.forEach(function(x){var s=S.st[x.id];if(s){att+=s[0]+s[1];wr+=s[1];} if(S.fav[x.id])fav++;});
    var wrongR=att?wr/att:0, favR=fav/size;
    w[k]=size*(1+wrongR+0.5*favR);
  });
  var alloc={};
  function total(){return keys.reduce(function(a,k){return a+(alloc[k]||0);},0);}
  var guard=0;
  while(total()<n && guard++<1000){
    var open=keys.filter(function(k){return (alloc[k]||0)<groups[k].length;});
    if(!open.length)break;
    var sumW=open.reduce(function(a,k){return a+w[k];},0), need=n-total(), progressed=false;
    open.forEach(function(k){
      var share=Math.max(1,Math.round(need*w[k]/sumW));
      var room=groups[k].length-(alloc[k]||0);
      var g=Math.min(share,room,n-total());
      if(g>0){alloc[k]=(alloc[k]||0)+g;progressed=true;}
    });
    if(!progressed)break;
  }
  var result=[];
  keys.forEach(function(k){result=result.concat(shuffle(groups[k]).slice(0,alloc[k]||0));});
  return shuffle(result);
}

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function clean(x){
  var c=JSON.parse(JSON.stringify(x)); delete c.id;
  Object.keys(c).forEach(function(k){if(c[k]===""||c[k]===null)delete c[k];});

function loadQuestions(){

function logChanges(changes,label){
  return DB.collection("adminRedo").get().then(function(snap){
    var b=DB.batch(); snap.forEach(function(d){b.delete(d.ref);}); return b.commit();
  }).then(function(){
    return DB.collection("adminLog").add({at:Date.now(),label:label,changes:changes});
  });
}
function snapOf(id){return RAW[id]?JSON.parse(JSON.stringify(RAW[id])):null;}
function writeAll(arr,label){
  var bid=Date.now();
  arr.forEach(function(x,i){if(!x.ord)x.ord=i+1;x.ib=bid;});
  var changes=arr.map(function(x){return {id:x.id,before:snapOf(x.id),after:clean(x)};});
  var chunks=[]; for(var i=0;i<changes.length;i+=400)chunks.push(changes.slice(i,i+400));
  var total=chunks.length;
  return chunks.reduce(function(p,chunk,ci){
    return p.then(function(){
      var b=DB.batch();
      chunk.forEach(function(c){b.set(DB.collection("questions").doc(c.id),c.after);});
      return b.commit();
    }).then(function(){
      chunk.forEach(function(c){RAW[c.id]=c.after;});
      return logChanges(chunk,(label||"ইমপোর্ট")+(total>1?" ("+(ci+1)+"/"+total+")":""));
    });
  },Promise.resolve())
  .then(function(){return loadQuestions();})
  .then(function(){alert("সেভ হয়েছে: "+arr.length+"টি প্রশ্ন");render();})
  .catch(function(err){alert("সমস্যা: "+err.message);});
}

  if(!Array.isArray(arr)){alert("JSON একটা তালিকা (array) হতে হবে");return;}
  var byId={}, byKey={};
  Q.forEach(function(x){byId[x.id]=x; byKey[normKey(x.q+x.o.join("|"))]=x.id;});
  var toWrite=[], nNew=0, nUpd=0, nDup=0;
  arr.forEach(function(x){
    if(!x.id)x.id=hs(x.q+(x.o||[]).join("|"));

  });

  if(!confirm(msg))return;
  if(!toWrite.length){alert("লেখার মতো কিছু নেই");return;}
  writeAll(toWrite,"JSON ইমপোর্ট");

function snap(){return {tab:V.tab,screen:V.screen,exid:V.ex?V.ex.id:null,list:V.list||null,title:V.title};}
function push(){
  var prev=V.lastRendered;
  if(prev&&prev.tab===V.tab){V.stk[V.tab]=(V.stk[V.tab]||[]).concat([prev]);}
  history.pushState({g:1},"","#"+V.tab);
}
function onBack(){
  var cur=V.tab, stk=V.stk[cur]||[];
  if(stk.length){
    var prev=stk.pop(); V.stk[cur]=stk;
    history.pushState({g:1},"","#"+cur);
    applyState(prev); return;
  }
  if(cur!=="home"){
    history.pushState({g:1},"","#home");
    var hm=Object.assign({screen:null},V.saved.home||{}); hm.tab="home";
    applyState(hm); return;
  }
  history.back(); // home with nothing left: leave the app
}
function applyState(st){
  st=st||{tab:"home",screen:null};
  V.tab=st.tab||"home"; V.screen=st.screen||null; V.list=st.list||null; V.title=st.title||V.title;
  if(st.exid){var ex=S.exams.filter(function(x){return x.id===st.exid;})[0];V.ex=ex||null;}
  if((V.screen==="exam"||V.screen==="result")&&!V.ex)V.screen=null;
  render(); app.scrollTop=st.scroll||0;
}
function goTab(tab){
  // remember exactly where this tab was: screen, running/result exam, list, drafts (kept in V.draft) and scroll position
  var mem=snap(); mem.scroll=app.scrollTop;
  V.saved[V.tab]=mem;
  var st=Object.assign({screen:null},V.saved[tab]||{});
  st.tab=tab;
  if(tab==="users")V.usrList=null;
  history.pushState({g:1},"","#"+tab);
  applyState(st);
}
window.addEventListener("popstate",onBack);

function latestAnswer(exams,id){
  var list=exams.slice().sort(function(a,b){return (b.at||0)-(a.at||0);});
  for(var i=0;i<list.length;i++){if(list[i].a&&list[i].a[id]!==undefined)return list[i].a[id];}
  return undefined;
}

function usrExamView(){

  h+='<div class="chips">'+labels.map(function(l){return '<button class="chip" data-ufilter="'+l[0]+'" aria-pressed="'+(f===l[0])+'">'+l[1]+' ('+bn(cnt[l[0]])+')</button>';}).join("")+'</div>';

  shown.forEach(function(r){
    var q=r.q;
    h+='<div class="card"><div class="tags"><span>'+esc(q.s)+' – '+esc(tlabel(q.t))+'</span>'+(r.stillWrong?'<span>এখনো ভুল</span>':(r.kind==="wrong"?'<span>সঠিক করেছে</span>':''))+'</div><p class="q" style="font-size:16px;margin-bottom:6px">'+esc(q.q)+'</p>';

      var c=k===q.a?"opt ok":(k===r.a&&r.kind==="wrong"?"opt bad":"opt");
      var tag=k===q.a?'সঠিক':(k===r.a?'ছাত্রের উত্তর':'');
      h+='<div class="'+c+'"><b>'+L[k]+'</b><span>'+esc(o)+'</span><i>'+tag+'</i></div>';

    h+='</div>';
  });
  return h;
}

  }
  if(t.id==="adm-new"){V.edit="new";return render();}
  if(t.id==="adm-cancel"){V.edit=null;return render();}
  if(t.id==="adm-save"){return admSave();}
  if(t.id==="adm-import"){return admImportText();}
  if(t.id==="adm-seed"){if(!confirm("মূল প্রশ্নগুলো ডেটাবেসে লিখবেন?"))return;return writeAll(SEED.slice());}
  if(t.id==="adm-export"){return admExport();}
  if(t.dataset.act==="edit"){V.edit=t.dataset.qid;return render();}
  if(t.dataset.act==="del"){return admDelete(t.dataset.qid);}
  if(t.dataset.act==="resume"||t.dataset.act==="exres"){
    var ex=S.exams.filter(function(x){return x.id===t.dataset.exid;})[0];
    if(!ex)return;
    V.ex=ex; V.title=ex.name; V.filter="all";
    V.screen=(t.dataset.act==="resume"&&ex.status!=="done")?"exam":"result";
    push(); render(); app.scrollTop=0; return;
  }
  if(t.dataset.act==="exdel"){
    if(!confirm("এই পরীক্ষাটি মুছে ফেলবেন?"))return;
    S.exams=S.exams.filter(function(x){return x.id!==t.dataset.exid;});
    if(V.ex&&V.ex.id===t.dataset.exid){V.ex=null;V.screen=null;}
    save(); render(); return;
  }
  if(t.dataset.act==="usr"){V.usrSel=t.dataset.uid;return render();}
  if(t.dataset.act==="usrback"){V.usrSel=null;V.usrExam=null;V.usrTopic="";return render();}
  if(t.dataset.act==="lang"){S.lang=(S.lang==="bn")?"en":"bn";save();return render();}
  if(t.dataset.act==="usrmore"){V.usrMore=!V.usrMore;return render();}
  if(t.dataset.act==="usrtop"){V.usrTopic=t.dataset.key;return render();}
  if(t.dataset.act==="uexam"){V.usrExam=t.dataset.exid;V.usrFilter="wrong";return render();}
  if(t.dataset.act==="ubackexam"){V.usrExam=null;return render();}
  if(t.dataset.ufilter){V.usrFilter=t.dataset.ufilter;return render();}
  if(t.dataset.act==="topic"){V.adm={key:t.dataset.key,sort:"new",text:""};return render();}
  if(t.dataset.act==="back"){V.adm=null;return render();}
  if(t.id==="adm-undo"){return admUndo();}
  if(t.id==="adm-redo"){return admRedo();}
  if(t.id==="logout"){firebase.auth().signOut();return;}
  if(t.dataset.fav){var id=t.dataset.fav;if(S.fav[id])delete S.fav[id];else S.fav[id]=1;save();t.textContent=S.fav[id]?"★":"☆";return;}
  if(t.dataset.k!==undefined)return answer(t.dataset.id,+t.dataset.k);
  if(t.id==="start"){var p=pool(),n=Math.max(1,Math.min(+V.cfg.n||1,p.length));var ids=(V.cfg.order==="rand"?weightedPick(p,n):p.slice(0,n)).map(function(x){return x.id;});var nm=((document.getElementById("exname")||{}).value||"").trim();return begin(ids,nm||("পরীক্ষা – "+new Date().toLocaleDateString("en-GB")));}
  if(t.id==="next"){var ex=V.ex;if(ex.i+1<ex.ids.length){ex.i++;render();}else finish();return;}
  if(t.id==="quit")return finish();
  if(t.id==="redo")return begin(shuffle(V.ex.bad),"ভুলগুলো আবার");
  if(t.dataset.filter){V.filter=t.dataset.filter;return render();}
  if(t.id==="home"){V.screen=null;render();return;}
  if(t.dataset.go){
    var kind=t.dataset.kind,ids2=selIds(kind);
    var nm=((document.getElementById("lname")||{}).value||"").trim();
    if(!ids2.length)return;
    if(t.dataset.go==="exam")return begin(shuffle(ids2),nm||("পরীক্ষা – "+new Date().toLocaleDateString("en-GB")));
    V.title=nm||(kind==="fav"?"পছন্দের প্রশ্ন":"ভুল প্রশ্ন"); V.list=ids2; V.screen="browse"; push(); return render();
  }
  if(t.dataset.tab){goTab(t.dataset.tab);return;}
});
app.addEventListener("change",function(e){
  var t=e.target,c=V.cfg;
  if(t.id&&/^(a_|imp|em|pw|exname|lname)/.test(t.id))return;
  if(t.dataset.usrq!==undefined){V.usrQ=t.value;return render();}
  if(t.dataset.usrtopic!==undefined){V.usrTopic=t.value;return render();}
  if(t.dataset.admsort){V.adm.sort=t.value;return render();}
  if(t.dataset.admtext){V.adm.text=t.value;return render();}
  if(t.dataset.grp){
    var gp=t.dataset.grp.split("||");
    Q.forEach(function(x){if(x.s===gp[0]&&gname(x)===gp[1])c.topics[x.s+"||"+x.t]=t.checked;});
    var y2=app.scrollTop;render();app.scrollTop=y2;return;
  }
  if(t.dataset.lkind){
    var k=t.dataset.lkind;V.lsel=V.lsel||{};V.lsel[k]=V.lsel[k]||{};var m=V.lsel[k];
    if(t.dataset.ltop){m[t.dataset.ltop]=t.checked;}
    else if(t.dataset.lsub){Q.forEach(function(x){if(x.s===t.dataset.lsub&&S[k][x.id])m[x.s+"||"+x.t]=t.checked;});}
    else if(t.dataset.lgrp){var gq=t.dataset.lgrp.split("||");Q.forEach(function(x){if(x.s===gq[0]&&gname(x)===gq[1]&&S[k][x.id])m[x.s+"||"+x.t]=t.checked;});}
    var y0=app.scrollTop;render();app.scrollTop=y0;return;
  }
  if(t.dataset.cfg){c[t.dataset.cfg]=t.type==="checkbox"?t.checked:t.value;}
  else if(t.dataset.top){c.topics[t.dataset.top]=t.checked;}
  else if(t.dataset.sub){Q.forEach(function(x){if(x.s===t.dataset.sub)c.topics[x.s+"||"+x.t]=t.checked;});}
  var y=app.scrollTop;render();app.scrollTop=y;
});
app.addEventListener("input",function(e){var t=e.target;if(t.id==="exname"||t.id==="lname")V.draft[t.id]=t.value;});
document.getElementById("nav").addEventListener("click",function(e){var t=e.target.closest("button");if(t)goTab(t.dataset.tab);});
boot();
</script>
</body>
</html>
