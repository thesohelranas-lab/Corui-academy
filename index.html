<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10142A;--surface:#1A2040;--ink:#E8ECFA;--muted:#9AA3C7;--line:#2C3560;--accent:#7C9BFF;--accent-ink:#10142A;--ok:#4FD39A;--okbg:#12342A;--bad:#FF8585;--badbg:#3A1C26}}
:root[data-theme="dark"]{--bg:#10142A;--surface:#1A2040;--ink:#E8ECFA;--muted:#9AA3C7;--line:#2C3560;--accent:#7C9BFF;--accent-ink:#10142A;--ok:#4FD39A;--okbg:#12342A;--bad:#FF8585;--badbg:#3A1C26}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Inter","Noto Sans Bengali","Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;font-variant-ligatures:common-ligatures;text-rendering:optimizeLegibility;-webkit-text-size-adjust:100%;line-height:1.55;display:flex;flex-direction:column}

<script>
/* ===== Firebase কনফিগারেশন ===== */
var FIREBASE_CONFIG={
  apiKey: "AIzaSyBOHxjgB36M-sOZwNHtiij3LMa804A908o",
  authDomain: "corui-academy.firebaseapp.com",
  projectId: "corui-academy",
  storageBucket: "corui-academy.firebasestorage.app",
  messagingSenderId: "683649317136",
  appId: "1:683649317136:web:13d30d9a77ad109ad44d95"
};

/* ===== প্রশ্নব্যাংক (ডেটাবেস থেকে লোড হবে) ===== */
var NEG=0.25;
var Q=[];
var SEED=[];
var BY={};
var insts=[];

function hs(s){var n=5381;for(var j=0;j<s.length;j++)n=((n<<5)+n+s.charCodeAt(j))|0;return "q"+(n>>>0).toString(36);}
function normKey(s){return String(s||"").toLowerCase().replace(/\s+/g," ").trim();}
function setQuestions(arr){
  Q=arr; BY={}; insts=[];
  Q.forEach(function(x){if(!x.id)x.id=hs((x.q||"")+(x.o||[]).join("|")); BY[x.id]=x; if(x.i&&insts.indexOf(x.i)<0)insts.push(x.i);});
}

/* ===== সংরক্ষণ, লাইভ প্রেজেন্স ও নোটিফিকেশন ===== */
var S={seen:{},wrong:{},fav:{},st:{},hist:[],exams:[],lang:"en",theme:"auto"};
var UID=null,DB=null,booted=false,saveTimer=null,hbTimer=null,usrUnsub=null,reqUnsub=null;
var V_AUTH={mode:"login",msg:""};
function normalize(d){d=d||{};return {seen:d.seen||{},wrong:d.wrong||{},fav:d.fav||{},st:d.st||{},hist:d.hist||[],exams:d.exams||[],lang:d.lang||"en",theme:d.theme||"auto"};}
function applyTheme(){
  var t=S.theme||"auto";
  if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
}
function pingPresence(isOnline){
  if(!UID||!DB)return;
  var em=((firebase.auth().currentUser)||{}).email||"";
  DB.collection("users").doc(UID).set({lastActive:Date.now(),online:!!isOnline,email:em},{merge:true}).catch(function(){});
}
function startPresence(){
  stopPresence();
  pingPresence(true);
  hbTimer=setInterval(function(){if(document.visibilityState==="visible")pingPresence(true);},45000);
}
function stopPresence(){if(hbTimer){clearInterval(hbTimer);hbTimer=null;}}
document.addEventListener("visibilitychange",function(){if(UID&&DB)pingPresence(document.visibilityState==="visible");});
window.addEventListener("pagehide",function(){if(UID&&DB)pingPresence(false);});

function save(){
  if(!UID||!DB)return;
  var u=UID,d=DB,snapshot=JSON.parse(JSON.stringify(S));
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    d.collection("users").doc(u).set({state:snapshot,updated:Date.now(),lastActive:Date.now(),online:true,email:((firebase.auth().currentUser)||{}).email||""},{mergeFields:["state","updated","lastActive","online","email"]}).catch(function(err){console.warn(err);});
  },400);
}
function boot(){
  history.replaceState(snap(),"","#home");
  try{firebase.initializeApp(FIREBASE_CONFIG);}
  catch(err){booted=true;V_AUTH={mode:"login",msg:"Firebase কনফিগারেশন বসানো হয়নি"};render();return;}
  firebase.auth().onAuthStateChanged(function(user){
    stopUsersWatch(); stopPresence(); stopReqsWatch();
    if(!user){UID=null;DB=null;ADMIN=false;S=normalize(null);applyTheme();booted=true;render();return;}
    UID=user.uid;DB=firebase.firestore();ADMIN=(user.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase();booted=false;render();
    DB.collection("users").doc(UID).get()
      .then(function(snapData){var d=snapData.data()||{};S=normalize(d.state);applyTheme();var del=d.adminDeleted||[];if(del.length)S.exams=S.exams.filter(function(x){return del.indexOf(x.id)<0;});})
      .catch(function(err){console.warn(err);})
      .then(function(){startPresence();if(ADMIN)watchPendingReqs();return loadQuestions();})
      .catch(function(err){console.warn(err);})
      .then(function(){booted=true;render();history.replaceState(snap(),"","#"+V.tab);});
  });
}
function authScreen(){
  var m=V_AUTH,isLogin=m.mode==="login";
  return '<div class="panel"><h1>'+(isLogin?'লগইন':'নতুন অ্যাকাউন্ট')+'</h1>'+
    '<div class="row" style="flex-direction:column;align-items:stretch"><label>ইমেইল</label><input id="em" type="email" autocomplete="email"></div>'+
    '<div class="row" style="flex-direction:column;align-items:stretch"><label>পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label><input id="pw" type="password"></div>'+
    (m.msg?'<div class="meta" style="color:var(--bad)">'+m.msg+'</div>':'')+
    '<button class="btn" id="'+(isLogin?'doLogin':'doSignup')+'">'+(isLogin?'লগইন':'অ্যাকাউন্ট খুলুন')+'</button>'+
    '<button class="btn alt" id="'+(isLogin?'toSignup':'toLogin')+'">'+(isLogin?'নতুন অ্যাকাউন্ট খুলুন':'আগে থেকে অ্যাকাউন্ট আছে, লগইন করুন')+'</button></div>';
}

var bn=function(n){if((S.lang||"en")==="en")return String(n);return String(n).replace(/\d/g,function(d){return "০১২৩৪৫৬৭৮৯"[d];});};
function optL(){return (S.lang||"en")==="en"?["A","B","C","D"]:["ক","খ","গ","ঘ"];}
var app=document.getElementById("app");
var V={tab:"home",screen:null,cfg:{topics:{},pool:"new",inst:"",n:10,order:"rand",showTopic:false,reveal:"instant"},ex:null,list:null,title:"",filter:"all",lsel:{},saved:{},draft:{},homeQ:"",homeShowAns:{},admAllQ:"",editReqs:[],pendingCnt:0};

/* ===== ন্যাভিগেশন ও ব্রাউজার হিস্ট্রি ===== */
function snap(){
  return {
    tab:V.tab, screen:V.screen||null, exid:V.ex?V.ex.id:null, list:V.list||null, title:V.title||"", filter:V.filter||"all",
    edit:V.edit||null, admReqs:!!V.admReqs, adm:V.adm?{key:V.adm.key,sort:V.adm.sort,text:V.adm.text}:null, admAllQ:V.admAllQ||"",
    usrSel:V.usrSel||null, usrExam:V.usrExam||null, usrFilter:V.usrFilter||"wrong", usrTopic:V.usrTopic||"", usrMore:!!V.usrMore, usrQ:V.usrQ||"", selfView:!!V.selfView,
    reqId:V.reqId||null, homeQ:V.homeQ||"", scroll:app.scrollTop
  };
}
function applyState(st){
  st=st||{tab:"home",screen:null};
  V.tab=st.tab||"home"; V.screen=st.screen||null; V.list=st.list||null; V.title=st.title||""; V.filter=st.filter||"all";
  V.edit=st.edit||null; V.admReqs=!!st.admReqs; V.adm=st.adm?Object.assign({},st.adm):null; V.admAllQ=st.admAllQ||"";
  V.usrSel=st.usrSel||null; V.usrExam=st.usrExam||null; V.usrFilter=st.usrFilter||"wrong"; V.usrTopic=st.usrTopic||""; V.usrMore=!!st.usrMore; V.usrQ=st.usrQ||""; V.selfView=!!st.selfView;
  V.reqId=st.reqId||null; V.homeQ=st.homeQ||"";
  if(st.exid){var ex=S.exams.filter(function(x){return x.id===st.exid;})[0];V.ex=ex||null;}else V.ex=null;
  if((V.screen==="exam"||V.screen==="result")&&!V.ex)V.screen=null;
  if(V.tab!=="users")stopUsersWatch();
  else if(ADMIN&&!usrUnsub)watchUsers();
  render(); app.scrollTop=st.scroll||0;
}
function navPush(fn){
  history.replaceState(snap(),"","#"+V.tab);
  fn();
  render();
  app.scrollTop=0;
  history.pushState(snap(),"","#"+V.tab);
}
function navReplace(fn){
  fn();
  render();
  app.scrollTop=0;
  history.replaceState(snap(),"","#"+V.tab);
}
function stepBack(){
  history.back();
}
function goTab(tab){
  if(tab===V.tab){
    if(V.screen||V.edit||V.admReqs||V.adm||V.usrSel){
      navPush(function(){
        V.screen=null;V.edit=null;V.admReqs=false;V.adm=null;V.usrSel=null;V.usrExam=null;V.reqId=null;
      });
    }
    return;
  }
  navPush(function(){
    V.tab=tab;
    V.screen=null; V.edit=null; V.admReqs=false; V.adm=null; V.usrSel=null; V.usrExam=null; V.reqId=null;
    if(tab!=="users")stopUsersWatch();
    if(tab==="users"){V.usrList=null;}
    if(tab==="admin"&&ADMIN)loadPendingCount();
  });
}
window.addEventListener("popstate",function(e){
  if(e.state&&e.state.tab){
    applyState(e.state);
  }
});

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function tree(){var T={};Q.forEach(function(x){(T[x.s]=T[x.s]||{});(T[x.s][x.t]=T[x.s][x.t]||[]).push(x);});return T;}
function gname(x){
  if(x.s==="English"){
    if(x.t==="Literature")return "Literature";
    return "Grammar";
  }
  return x.s;
}
function tlabel(t){return t.indexOf("Grammar: ")===0?t.slice(9):t;}
function groupTree(list){
  var T={};
  (list||Q).forEach(function(x){
    var g=gname(x);
    T[x.s]=T[x.s]||{}; T[x.s][g]=T[x.s][g]||{}; (T[x.s][g][x.t]=T[x.s][g][x.t]||[]).push(x);
  });
  return T;
}

function pool(){
  var c=V.cfg;
  return Q.filter(function(x){
    if(!c.topics[x.s+"||"+x.t])return false;
    if(c.inst&&x.i!==c.inst)return false;
    if(c.pool==="new")return !S.seen[x.id];
    if(c.pool==="wrong")return !!S.wrong[x.id];
    return true;
  });
}
function weightedPick(list,n){
  var groups={};
  list.forEach(function(x){var k=x.s+"||"+x.t;(groups[k]=groups[k]||[]).push(x);});
  var keys=Object.keys(groups), w={};
  keys.forEach(function(k){
    var qs=groups[k],size=qs.length,att=0,wr=0,fav=0;
    qs.forEach(function(x){var s=S.st[x.id];if(s){att+=s[0]+s[1];wr+=s[1];} if(S.fav[x.id])fav++;});
    var wrongR=att?wr/att:0, favR=fav/size;
    w[k]=size*(1+wrongR+0.5*favR);
  });
  var alloc={};
  function total(){return keys.reduce(function(a,k){return a+(alloc[k]||0);},0);}
  var guard=0;
  while(total()<n && guard++<1000){
    var open=keys.filter(function(k){return (alloc[k]||0)<groups[k].length;});
    if(!open.length)break;
    var sumW=open.reduce(function(a,k){return a+w[k];},0), need=n-total(), progressed=false;
    open.forEach(function(k){
      var share=Math.max(1,Math.round(need*w[k]/sumW));
      var room=groups[k].length-(alloc[k]||0);
      var g=Math.min(share,room,n-total());
      if(g>0){alloc[k]=(alloc[k]||0)+g;progressed=true;}
    });
    if(!progressed)break;
  }
  var result=[];
  keys.forEach(function(k){result=result.concat(shuffle(groups[k]).slice(0,alloc[k]||0));});
  return shuffle(result);
}
function begin(ids,title){
  var ex={id:"e"+Date.now().toString(36),name:title||"পরীক্ষা",at:Date.now(),ids:ids,a:{},status:"running"};
  S.exams.unshift(ex);
  save();
  navPush(function(){
    V.ex=ex; V.filter="all"; V.title=ex.name; V.screen="exam";
  });
}
function answer(id,k){
  V.ex.a[id]=k;S.seen[id]=1;save();render();
}
function finish(){
  if(V.ex.status==="done"){navReplace(function(){V.screen="result";});return;}
  var ids=V.ex.ids,c=0,w=0;
  ids.forEach(function(id){if(!BY[id])return;var a=V.ex.a[id];if(a===undefined)return;var st=S.st[id]=S.st[id]||[0,0];if(a===BY[id].a){st[0]++;delete S.wrong[id];}else{st[1]++;S.wrong[id]=1;}});
  ids.forEach(function(id){if(!BY[id])return;var a=V.ex.a[id];if(a===undefined)return;a===BY[id].a?c++:w++;});
  V.ex.r={n:ids.length,c:c,w:w,sk:ids.length-c-w,sc:c-w*NEG};
  V.ex.status="done"; V.ex.finishedAt=Date.now();
  S.hist.unshift({d:V.ex.finishedAt,t:V.ex.name,n:ids.length,c:c,w:w,sc:V.ex.r.sc}); S.hist=S.hist.slice(0,30);
  var done=S.exams.filter(function(x){return x.status==="done";});
  if(done.length>20){
    var old=done.sort(function(a,b){return a.finishedAt-b.finishedAt;}).slice(0,done.length-20).map(function(x){return x.id;});

function expl(q){

    '<style>body{font-family:"Inter","Noto Sans Bengali",sans-serif;color:#111;margin:20px;line-height:1.45;font-size:13px}'+
    'h1{font-size:19px;margin:0 0 4px} .sub{color:#555;font-size:12px;margin-bottom:14px;border-bottom:1.5px solid #222;padding-bottom:8px}'+
    '.qbox{margin-bottom:12px;break-inside:avoid;page-break-inside:avoid} .qt{font-weight:600;margin-bottom:4px}'+
    '.opts{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 14px} .opts li.ok{font-weight:700;color:#0e6b40}'+
    '.exp{margin-top:4px;font-size:12px;color:#333;background:#f4f6fa;padding:4px 8px;border-radius:4px}'+
    '@media print{body{margin:10mm}}</style></head><body>'+
    '<h1>'+esc(ex.name)+'</h1><div class="sub">মোট প্রশ্ন: '+bn(qs.length)+' · নেগেটিভ মার্কিং: '+bn(NEG)+' · '+fmt(ex.at)+(withAns?' · উত্তরপত্রসহ':'')+'</div>'+

  var fr=document.createElement("iframe");

  fr.style.cssText="position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden";
  document.body.appendChild(fr);
  var doc=fr.contentDocument||fr.contentWindow.document;
  doc.open(); doc.write(html); doc.close();
  fr.onload=function(){setTimeout(function(){try{fr.contentWindow.focus();fr.contentWindow.print();}catch(e){var w=window.open("","_blank");if(w){w.document.write(html);w.document.close();w.print();}}},350);};

function isOn(kind,key){return kind?lsOn(kind,key):!!V.cfg.topics[key];}
function groupHead(s,g,T,kind){
  var keys=Object.keys(T[s][g]).map(function(t){return s+"||"+t;});

  var qs=[]; Object.keys(T[s][g]).forEach(function(t){qs=qs.concat(T[s][g][t]);});
  var info=kind?'<small style="margin-left:auto;color:var(--muted);font-weight:400">'+bn(qs.length)+'টি</small>':'<small style="margin-left:auto;color:var(--muted);font-weight:400">মোট '+bn(qs.length)+'টি, নতুন '+bn(qs.filter(function(x){return !S.seen[x.id];}).length)+'টি</small>';
  var attr=kind?' data-lkind="'+kind+'" data-lgrp="'+esc(s+"||"+g)+'"':' data-grp="'+esc(s+"||"+g)+'"';
  return '<label class="sub" style="margin:10px 0 2px"><input type="checkbox"'+attr+(all?" checked":"")+'><span>'+esc(g)+'</span>'+info+'</label>';
}

var RAW={};
var ADMIN=false, ADMIN_EMAIL="thesohelranas@gmail.com";
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function clean(x){
  var c=JSON.parse(JSON.stringify(x)); delete c.id;
  Object.keys(c).forEach(function(k){if(c[k]===""||c[k]===null)delete c[k];});
  return c;
}
function idb(){return new Promise(function(res,rej){var r=indexedDB.open("corui-quiz",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv");};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function cacheGet(){return idb().then(function(db){return new Promise(function(res){var t=db.transaction("kv").objectStore("kv").get("questions");t.onsuccess=function(){res(t.result||null);};t.onerror=function(){res(null);};});}).catch(function(){return null;});}
function cachePut(v){return idb().then(function(db){return new Promise(function(res){var t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,"questions");t.oncomplete=function(){res();};t.onerror=function(){res();};});}).catch(function(){});}
function cacheClear(){return idb().then(function(db){return new Promise(function(res){var t=db.transaction("kv","readwrite");t.objectStore("kv").delete("questions");t.oncomplete=function(){res();};t.onerror=function(){res();};});}).catch(function(){});}
function buildFrom(map){
  var out={};
  SEED.forEach(function(x,i){out[x.id]=Object.assign({},x,{ord:x.ord||(i+1)});});
  Object.keys(map).forEach(function(id){var data=map[id];if(data.deleted){delete out[id];return;}out[id]=Object.assign({},data,{id:id});});
  var arr=Object.keys(out).map(function(k){return out[k];});
  arr.sort(function(a,b){return (a.ord||0)-(b.ord||0);});
  setQuestions(arr);
}
function loadQuestions(){
  return cacheGet().then(function(c){
    var have=(c&&c.ver===1&&c.map)?c:null, map=have?have.map:{}, maxUpd=have?(have.maxUpd||0):0;
    var qy=have?DB.collection("questions").where("upd",">",maxUpd):DB.collection("questions");
    return qy.get().then(function(snap){
      snap.forEach(function(d){var data=d.data();map[d.id]=data;if((data.upd||0)>maxUpd)maxUpd=data.upd||0;});
      RAW=map; buildFrom(map);
      return cachePut({ver:1,map:map,maxUpd:maxUpd,at:Date.now()});
    }).catch(function(err){
      if(have){RAW=map;buildFrom(map);console.warn("ক্যাশ থেকে চালানো হলো",err);return;}
      throw err;
    });
  });
}
function logChanges(changes,label){
  return DB.collection("adminRedo").get().then(function(snap){
    var b=DB.batch(); snap.forEach(function(d){b.delete(d.ref);}); return b.commit();
  }).then(function(){
    return DB.collection("adminLog").add({at:Date.now(),label:label,changes:changes});
  });
}
function snapOf(id){return RAW[id]?JSON.parse(JSON.stringify(RAW[id])):null;}
function writeAll(arr,label,keepBatch){
  var bid=Date.now();
  arr.forEach(function(x,i){if(!x.ord)x.ord=i+1;if(!keepBatch)x.ib=bid;x.upd=bid;});
  var changes=arr.map(function(x){return {id:x.id,before:snapOf(x.id),after:clean(x)};});
  var chunks=[]; for(var i=0;i<changes.length;i+=400)chunks.push(changes.slice(i,i+400));
  var total=chunks.length;
  return chunks.reduce(function(p,chunk,ci){
    return p.then(function(){
      var b=DB.batch();
      chunk.forEach(function(c){b.set(DB.collection("questions").doc(c.id),c.after);});
      return b.commit();
    }).then(function(){
      chunk.forEach(function(c){RAW[c.id]=c.after;});
      return logChanges(chunk,(label||"ইমপোর্ট")+(total>1?" ("+(ci+1)+"/"+total+")":""));
    });
  },Promise.resolve())
  .then(function(){return loadQuestions();})
  .then(function(){alert("সেভ হয়েছে: "+arr.length+"টি প্রশ্ন");render();})
  .catch(function(err){alert("সমস্যা: "+err.message);});
}

    if(!confirm("শেষ পরিবর্তনটি ফিরিয়ে আনবেন?\n\n"+entry.label))return;
    var b=DB.batch();

    return b.commit()

function admImportText(){

  var arr; try{arr=JSON.parse(raw);}catch(err){alert("JSON ঠিক নেই: "+err.message);return;}
  if(!Array.isArray(arr)){alert("JSON একটা তালিকা (array) হতে হবে");return;}
  var byId={}, byKey={};
  Q.forEach(function(x){byId[x.id]=x; byKey[normKey(x.q+x.o.join("|"))]=x.id;});
  var toWrite=[], nNew=0, nUpd=0, nDup=0;
  arr.forEach(function(x){
    if(!x.id)x.id=hs(x.q+(x.o||[]).join("|"));
    var key=normKey(x.q+(x.o||[]).join("|"));
    if(byKey[key] && byKey[key]!==x.id){nDup++;return;}
    if(byId[x.id])nUpd++; else nNew++;
    toWrite.push(x);
  });
  var msg="নতুন প্রশ্ন: "+nNew+"\nআপডেট হবে: "+nUpd+"\nডুপ্লিকেট বাদ যাবে: "+nDup+"\n\nচালিয়ে যাবেন?";
  if(!confirm(msg))return;
  if(!toWrite.length){alert("লেখার মতো কিছু নেই");return;}
  writeAll(toWrite,"JSON ইমপোর্ট");

function usrDetail(){
  if(V.usrExam)return usrExamView();

  if(!ctx)return '<p class="meta">ব্যবহারকারী পাওয়া যায়নি।</p><button class="btn alt" data-act="usrback">ফিরে যান</button>';
  var u=ctx.u, st=ctx.st, cutoff=Date.now()-30*864e5, live=isLive(u);
  var ex=st.exams.filter(function(x){return x.status==="done"&&(x.finishedAt||0)>=cutoff;}).sort(function(a,b){return (b.finishedAt||0)-(a.finishedAt||0);});
  var tot=0,right=0;
  Object.keys(st.st).forEach(function(id){var s=st.st[id];if(s){tot+=s[0]+s[1];right+=s[0];}});
  var acc=tot?Math.round(right/tot*100):0;
  var wrongAll=Object.keys(st.wrong).filter(function(id){return BY[id];}).map(function(id){return BY[id];});

  h+='<div class="panel"><div class="total">'+bn(seen)+' / '+bn(Q.length)+'</div><div class="meta">প্রশ্ন দেওয়া হয়েছে · মোট নির্ভুলতা '+bn(acc)+'% · বর্তমানে ভুল '+bn(wrongAll.length)+'টি · গত ১ মাসে '+bn(ex.length)+'টি পরীক্ষা</div></div>';
  h+='<button class="card" data-act="uwrongopen" style="display:block;width:100%;text-align:left;font:inherit;color:var(--ink);cursor:pointer"><b>বর্তমান ভুল প্রশ্ন</b> ('+bn(wrongAll.length)+'টি)<div class="meta">ক্লিক করে ভুল প্রশ্ন দেখুন →</div></button>';
  h+='<h2>গত ১ মাসের পরীক্ষা ('+bn(ex.length)+'টি)</h2>';
  if(!ex.length)h+='<div class="panel meta">এই সময়ে কোনো পরীক্ষা শেষ হয়নি।</div>';

    var ok=x.ids.filter(function(id){return BY[id];}),c=0,w=0;
    ok.forEach(function(id){var a=x.a[id];if(a===undefined)return;a===BY[id].a?c++:w++;});
    h+='<div class="card"><b>'+esc(x.name)+'</b><div class="meta">'+fmt(x.finishedAt)+' · সঠিক '+bn(c)+', ভুল '+bn(w)+', স্কিপ '+bn(ok.length-c-w)+' · নম্বর '+bn((c-w*NEG).toFixed(2))+'/'+bn(ok.length)+'</div>';
    h+='<button class="btn alt" data-act="uexam" data-exid="'+x.id+'" style="margin:0 0 6px">প্রশ্নগুলো দেখুন (ভুল ফিল্টার)</button><button class="btn alt" data-act="uexdel" data-exid="'+x.id+'" style="margin:0;color:var(--bad)">এই পরীক্ষা মুছুন</button></div>';
  });

function usrWrongView(){
  var ctx=userCtx(), L=optL();
  if(!ctx)return '<p class="meta">ব্যবহারকারী পাওয়া যায়নি।</p>';
  var st=ctx.st, wr=Object.keys(st.wrong).filter(function(id){return BY[id];}).map(function(id){return BY[id];}), cnt={};
  wr.forEach(function(q){var k=q.s+"||"+q.t;cnt[k]=(cnt[k]||0)+1;});

  if(!wr.length)return h+'<div class="panel meta">এখন কোনো ভুল প্রশ্ন নেই।</div>';
  h+='<p class="meta">যে টপিকে বেশি ভুল, সেটি উপরে।</p><div class="chips"><button class="chip" data-act="usrtop" data-key="" aria-pressed="'+(!V.usrTopic)+'">সব ('+bn(wr.length)+')</button>'+keys.map(function(k){var p=k.split("||");return '<button class="chip" data-act="usrtop" data-key="'+esc(k)+'" aria-pressed="'+(V.usrTopic===k)+'">'+esc(tlabel(p[1]))+' ('+bn(cnt[k])+')</button>';}).join("")+'</div>';
  keys.filter(function(k){return !V.usrTopic||V.usrTopic===k;}).forEach(function(k){
    var p=k.split("||");
    h+='<h3>'+esc(tlabel(p[1]))+' ('+bn(cnt[k])+'টি)</h3>';
    wr.filter(function(q){return (q.s+"||"+q.t)===k;}).forEach(function(q){
      var last=latestAnswer(st.exams,q.id);
      h+='<div class="card"><p class="q" style="font-size:16px;margin-bottom:6px">'+esc(q.q)+'</p>';
      q.o.forEach(function(o,i){
        var c=i===q.a?"opt ok":(i===last?"opt bad":"opt");
        h+='<div class="'+c+'"><b>'+L[i]+'</b><span>'+esc(o)+'</span><i>'+(i===q.a?'সঠিক উত্তর':(i===last?'ছাত্রের উত্তর':''))+'</i></div>';
      });
      if(ADMIN)h+='<div class="btn-row"><button class="btn alt sm" data-act="uedit" data-qid="'+q.id+'">✎ প্রশ্ন এডিট</button></div>';
      h+='</div>';
    });
  });
  return h;
}
function usrExamView(){
  var ctx=userCtx(), L=optL();
  var x=ctx?ctx.st.exams.filter(function(e){return e.id===V.usrExam;})[0]:null;
  if(!x)return '<button class="btn alt" data-act="ubackexam">← ফিরে যান</button><p class="meta">পরীক্ষা পাওয়া যায়নি।</p>';
  var f=V.usrFilter||"wrong", rows=[], cnt={all:0,wrong:0,right:0,skip:0};
  x.ids.forEach(function(id){
    var q=BY[id]; if(!q)return;
    var a=x.a[id], kind=a===undefined?"skip":(a===q.a?"right":"wrong");
    cnt.all++; cnt[kind]++;
    rows.push({q:q,a:a,kind:kind,stillWrong:!!ctx.st.wrong[id]});
  });
  var h='<button class="btn alt" data-act="ubackexam" style="margin:0 0 10px">← পরীক্ষার তালিকা</button>';
  h+='<h1>'+esc(x.name)+'</h1><p class="meta">'+fmt(x.finishedAt||x.at)+' · মোট '+bn(cnt.all)+'টি</p>';
  var labels=[["wrong","ভুল"],["right","সঠিক"],["skip","স্কিপ"],["all","সব"]];
  h+='<div class="chips">'+labels.map(function(l){return '<button class="chip" data-ufilter="'+l[0]+'" aria-pressed="'+(f===l[0])+'">'+l[1]+' ('+bn(cnt[l[0]])+')</button>';}).join("")+'</div>';
  var shown=rows.filter(function(r){return f==="all"||r.kind===f;});
  if(!shown.length)h+='<div class="panel meta">এই ফিল্টারে কোনো প্রশ্ন নেই।</div>';
  shown.forEach(function(r){
    var q=r.q;
    h+='<div class="card"><div class="tags"><span>'+esc(q.s)+' – '+esc(tlabel(q.t))+'</span>'+(r.stillWrong?'<span>এখনো ভুল</span>':(r.kind==="wrong"?'<span>সঠিক করেছে</span>':''))+'</div><p class="q" style="font-size:16px;margin-bottom:6px">'+esc(q.q)+'</p>';
    q.o.forEach(function(o,k){
      var c=k===q.a?"opt ok":(k===r.a&&r.kind==="wrong"?"opt bad":"opt");
      var tag=k===q.a?'সঠিক':(k===r.a?'ছাত্রের উত্তর':'');
      h+='<div class="'+c+'"><b>'+L[k]+'</b><span>'+esc(o)+'</span><i>'+tag+'</i></div>';
    });
    if(r.kind==="skip")h+='<div class="meta">এই প্রশ্নের উত্তর দেওয়া হয়নি</div>';
    if(ADMIN)h+='<div class="btn-row"><button class="btn alt sm" data-act="uedit" data-qid="'+q.id+'">✎ প্রশ্ন এডিট</button></div>';
    h+='</div>';
  });
  return h;
}

  ["লগইন","Log in"],
  ["অপশন","Option"],
  ["টপিক","Topic"],
  ["আগে:","Before:"],
  ["হোম","Home"],
  ["ভুল","Wrong"],
  ["মোট","Total"],
  ["নতুন","New"],
  ["সব","All"]
];
TR_PAIRS.sort(function(a,b){return b[0].length-a[0].length;});

function tr(html){
  if((S.lang||"en")!=="en")return html;
  html=html.replace(/(\d)\s*(টি|জন)/g,"$1");
  for(var i=0;i<TR_PAIRS.length;i++){html=html.split(TR_PAIRS[i][0]).join(TR_PAIRS[i][1]);}
  return html;
}
function trDom(root){
  if((S.lang||"en")!=="en")return;
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),nodes=[];
  while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(function(n){
    var p=n.parentNode;
    if(p&&p.closest&&p.closest(".q,.opt span,.exp,[data-notr]"))return;
    var t=n.nodeValue;
    if(!/[\u0980-\u09FF]/.test(t))return;
    n.nodeValue=tr(t);
  });
  root.querySelectorAll("[placeholder]").forEach(function(el){el.placeholder=tr(el.placeholder);});
}
function render(){
  document.documentElement.lang=(S.lang==="bn")?"bn":"en";
  var s=V.screen,y=app.scrollTop;
  if(!booted){document.getElementById("nav").innerHTML="";app.innerHTML='<p class="meta">লোড হচ্ছে…</p>';return;}
  if(!UID){document.getElementById("nav").innerHTML="";app.innerHTML=authScreen();return;}
  var html;
  if(V.edit&&ADMIN)html=editForm();
  else if(s==="reqedit")html=reqEditForm();
  else if(s==="uwrong")html=usrWrongView();
  else if(s==="wrong")html=wrongView();
  else if(s==="exam")html=exam();
  else if(s==="result")html=result();
  else if(s==="browse")html=browse();
  else if(V.tab==="home")html=home();
  else if(V.tab==="users"&&ADMIN)html=usrView();
  else if(V.tab==="exams")html=examsView();
  else if(V.tab==="prog")html=prog();
  else if(V.tab==="admin"&&ADMIN)html=adminView();
  else html=listTab(V.tab==="admin"?"fav":V.tab);

  app.innerHTML=html;
  trDom(app);
  if(V.tab==="home"&&!V.screen&&!V.edit)renderHomeSearch();
  if(V.tab==="admin"&&ADMIN&&!V.edit&&!V.admReqs&&!(V.adm&&V.adm.key))renderAdmSearch();
  if(V.tab==="users"&&ADMIN&&!V.usrSel&&!V.edit&&V.usrList)renderUserList();
  nav();
  trDom(document.getElementById("nav"));
  app.scrollTop=(s==="exam")?y:0;
}

/* ===== ইভেন্ট ===== */
app.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.id==="toSignup"){V_AUTH={mode:"signup",msg:""};return render();}
  if(t.id==="toLogin"){V_AUTH={mode:"login",msg:""};return render();}
  if(t.id==="doLogin"||t.id==="doSignup"){
    var em=document.getElementById("em").value.trim(),pw=document.getElementById("pw").value,isLogin=t.id==="doLogin";
    var p=isLogin?firebase.auth().signInWithEmailAndPassword(em,pw):firebase.auth().createUserWithEmailAndPassword(em,pw);
    p.catch(function(err){V_AUTH={mode:isLogin?"login":"signup",msg:"ত্রুটি: "+err.message};render();});
    return;
  }
  if(t.id==="adm-new"){navPush(function(){V.edit="new";});return;}
  if(t.id==="adm-cancel"){return stepBack();}
  if(t.id==="adm-save"){return admSave();}
  if(t.id==="adm-import"){return admImportText();}
  if(t.id==="adm-export"){return admExport();}
  if(t.id==="req-submit"){return submitEditReq();}
  if(t.id==="req-cancel"){return stepBack();}
  if(t.dataset.act==="reqedit"){navPush(function(){V.reqId=t.dataset.qid;V.screen="reqedit";});return;}
  if(t.dataset.act==="go-reqs"){
    navPush(function(){
      V.tab="admin"; V.screen=null; V.edit=null; V.adm=null; V.admReqs=true;
      loadPendingCount();
    });
    return;
  }
  if(t.dataset.act==="adm-reqs"){navPush(function(){V.admReqs=true;loadPendingCount();});return;}
  if(t.dataset.act==="reqs-back"){return stepBack();}
  if(t.dataset.act==="req-approve"){return approveReq(t.dataset.rid);}
  if(t.dataset.act==="req-reject"){return rejectReq(t.dataset.rid);}
  if(t.dataset.act==="edit"||t.dataset.act==="uedit"){navPush(function(){V.edit=t.dataset.qid;});return;}
  if(t.dataset.act==="del"){return admDelete(t.dataset.qid);}
  if(t.dataset.act==="pdf-q"||t.dataset.act==="pdf-a"){
    var exP=S.exams.filter(function(x){return x.id===t.dataset.exid;})[0]||(V.ex&&V.ex.id===t.dataset.exid?V.ex:null);
    return printExamPdf(exP,t.dataset.act==="pdf-a");
  }
  if(t.dataset.act==="hsearch-exam"){
    var list=homeMatches(); if(!list.length)return;
    return begin(list.map(function(x){return x.id;}),"খোঁজা প্রশ্ন: "+V.homeQ.trim().slice(0,25));
  }
  if(t.dataset.act==="hsearch-browse"){
    var list2=homeMatches(); if(!list2.length)return;
    navPush(function(){V.title="খোঁজা প্রশ্ন: "+V.homeQ.trim(); V.list=list2.map(function(x){return x.id;}); V.screen="browse";});
    return;
  }
  if(t.dataset.act==="htogans"){
    var qid=t.dataset.qid; V.homeShowAns[qid]=!V.homeShowAns[qid];
    return renderHomeSearch();
  }
  if(t.dataset.act==="resume"||t.dataset.act==="exres"){
    var ex=S.exams.filter(function(x){return x.id===t.dataset.exid;})[0];
    if(!ex)return;
    navPush(function(){
      V.ex=ex; V.title=ex.name; V.filter="all";
      V.screen=(t.dataset.act==="resume"&&ex.status!=="done")?"exam":"result";
    });
    return;
  }
  if(t.dataset.act==="exdel"){
    var tgt=S.exams.filter(function(x){return x.id===t.dataset.exid;})[0];
    if(tgt&&tgt.status==="done"&&(Date.now()-(tgt.finishedAt||tgt.at))<7*864e5){alert(S.lang==="bn"?"জমা দেওয়া পরীক্ষা ৭ দিনের মধ্যে মোছা যায় না।":"A submitted exam cannot be deleted within 7 days.");return;}
    if(!confirm("এই পরীক্ষাটি মুছে ফেলবেন?"))return;
    S.exams=S.exams.filter(function(x){return x.id!==t.dataset.exid;});
    if(V.ex&&V.ex.id===t.dataset.exid){V.ex=null;V.screen=null;}
    save(); render(); return;
  }
  if(t.dataset.act==="usr"){navPush(function(){V.usrSel=t.dataset.uid;});return;}
  if(t.dataset.act==="usrback"){return stepBack();}
  if(t.dataset.act==="lang"){S.lang=(S.lang==="bn")?"en":"bn";save();return render();}
  if(t.dataset.act==="theme"){S.theme=(S.theme==="dark")?"light":(S.theme==="light"?"auto":"dark");applyTheme();save();return render();}
  if(t.dataset.act==="usrmore"){V.usrMore=!V.usrMore;return render();}
  if(t.dataset.act==="uwrongopen"){navPush(function(){V.usrTopic="";V.screen="uwrong";});return;}
  if(t.dataset.act==="uwrongback"){return stepBack();}
  if(t.dataset.act==="uexdel"){
    var ctx2=userCtx(); if(!ctx2)return;
    var ex2=ctx2.st.exams.filter(function(x){return x.id===t.dataset.exid;})[0];
    if(!confirm("এই পরীক্ষাটি ব্যবহারকারীর তালিকা থেকে মুছবেন?\n"+(ex2?ex2.name:"")))return;
    var uid2=ctx2.u.uid, left=ctx2.st.exams.filter(function(x){return x.id!==t.dataset.exid;});
    DB.collection("users").doc(uid2).update({"state.exams":left,adminDeleted:firebase.firestore.FieldValue.arrayUnion(t.dataset.exid)})
      .then(function(){
        var ud=ctx2.u.data; ud.state=ud.state||{}; ud.state.exams=left;
        ud.adminDeleted=(ud.adminDeleted||[]).concat([t.dataset.exid]);
        render();
      }).catch(function(err){alert("মোছা যায়নি: "+err.message);});
    return;
  }
  if(t.dataset.act==="wrongopen"){navPush(function(){V.usrTopic="";V.screen="wrong";});return;}
  if(t.dataset.act==="wrongback"){return stepBack();}
  if(t.dataset.act==="usrtop"){V.usrTopic=t.dataset.key;return render();}
  if(t.dataset.act==="uexam"){navPush(function(){V.usrExam=t.dataset.exid;V.usrFilter="wrong";});return;}
  if(t.dataset.act==="ubackexam"){return stepBack();}
  if(t.dataset.ufilter){V.usrFilter=t.dataset.ufilter;return render();}
  if(t.dataset.act==="topic"){navPush(function(){V.adm={key:t.dataset.key,sort:"new",text:""};});return;}
  if(t.dataset.act==="back"){return stepBack();}
  if(t.id==="adm-clearcache"){
    if(!confirm("ফোনের জমানো প্রশ্ন মুছে ডেটাবেস থেকে সব প্রশ্ন আবার আনা হবে। এতে প্রশ্ন সংখ্যার সমান রিড খরচ হবে। চালিয়ে যাবেন?"))return;
    cacheClear().then(function(){return loadQuestions();}).then(function(){alert("নতুন করে আনা হয়েছে: "+Q.length+"টি প্রশ্ন");render();}).catch(function(err){alert("সমস্যা: "+err.message);});
    return;
  }
  if(t.id==="adm-undo"){return admUndo();}
  if(t.id==="adm-redo"){return admRedo();}
  if(t.id==="logout"){pingPresence(false);stopReqsWatch();stopUsersWatch();firebase.auth().signOut();return;}
  if(t.dataset.fav){var id=t.dataset.fav;if(S.fav[id])delete S.fav[id];else S.fav[id]=1;save();t.textContent=S.fav[id]?"★":"☆";return;}
  if(t.dataset.k!==undefined)return answer(t.dataset.id,+t.dataset.k);
  if(t.id==="start"){var p=pool(),n=Math.max(1,Math.min(+V.cfg.n||1,p.length));var ids=(V.cfg.order==="rand"?weightedPick(p,n):p.slice(0,n)).map(function(x){return x.id;});var nm=((document.getElementById("exname")||{}).value||"").trim();return begin(ids,nm||("পরীক্ষা – "+new Date().toLocaleDateString("en-GB")));}
  if(t.id==="quit")return finish();
  if(t.id==="redo")return begin(shuffle(V.ex.bad),"ভুলগুলো আবার");
  if(t.dataset.filter){V.filter=t.dataset.filter;return render();}
  if(t.id==="home"){return stepBack();}
  if(t.dataset.go){
    var kind=t.dataset.kind,ids2=selIds(kind);
    var nm=((document.getElementById("lname")||{}).value||"").trim();
    if(!ids2.length)return;
    if(t.dataset.go==="exam")return begin(shuffle(ids2),nm||("পরীক্ষা – "+new Date().toLocaleDateString("en-GB")));
    navPush(function(){V.title=nm||(kind==="fav"?"পছন্দের প্রশ্ন":"ভুল প্রশ্ন"); V.list=ids2; V.screen="browse";});
    return;
  }
  if(t.dataset.tab){goTab(t.dataset.tab);return;}
});

app.addEventListener("change",function(e){
  var t=e.target,c=V.cfg;
  if(t.id&&/^(a_|r_|rq_|ro|ra_|rbn_|re_|imp|em|pw|exname|lname|home-q|adm-all-q|usr-q)/.test(t.id))return;
  if(t.dataset.usrtopic!==undefined){V.usrTopic=t.value;return render();}
  if(t.dataset.admsort){V.adm.sort=t.value;return render();}
  if(t.dataset.admtext){V.adm.text=t.value;return render();}
  if(t.dataset.grp){
    var gp=t.dataset.grp.split("||");
    Q.forEach(function(x){if(x.s===gp[0]&&gname(x)===gp[1])c.topics[x.s+"||"+x.t]=t.checked;});
    var y2=app.scrollTop;render();app.scrollTop=y2;return;
  }
  if(t.dataset.lkind){
    var k=t.dataset.lkind;V.lsel=V.lsel||{};V.lsel[k]=V.lsel[k]||{};var m=V.lsel[k];
    if(t.dataset.ltop){m[t.dataset.ltop]=t.checked;}
    else if(t.dataset.lsub){Q.forEach(function(x){if(x.s===t.dataset.lsub&&S[k][x.id])m[x.s+"||"+x.t]=t.checked;});}
    else if(t.dataset.lgrp){var gq=t.dataset.lgrp.split("||");Q.forEach(function(x){if(x.s===gq[0]&&gname(x)===gq[1]&&S[k][x.id])m[x.s+"||"+x.t]=t.checked;});}
    var y0=app.scrollTop;render();app.scrollTop=y0;return;
  }
  if(t.dataset.cfg){c[t.dataset.cfg]=t.type==="checkbox"?t.checked:t.value;}
  else if(t.dataset.top){c.topics[t.dataset.top]=t.checked;}
  else if(t.dataset.sub){Q.forEach(function(x){if(x.s===t.dataset.sub)c.topics[x.s+"||"+x.t]=t.checked;});}
  var y=app.scrollTop;render();app.scrollTop=y;
});

app.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="exname"||t.id==="lname")V.draft[t.id]=t.value;
  else if(t.id==="home-q"){V.homeQ=t.value;renderHomeSearch();}
  else if(t.id==="adm-all-q"){V.admAllQ=t.value;renderAdmSearch();}
  else if(t.id==="usr-q"){V.usrQ=t.value;renderUserList();}
});

document.getElementById("nav").addEventListener("click",function(e){var t=e.target.closest("button");if(t)goTab(t.dataset.tab);});
boot();
</script>
