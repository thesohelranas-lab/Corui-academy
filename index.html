<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5BEA">
<title>Corui Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F9;--surface:#fff;--ink:#1B2340;--muted:#5B6485;--line:#DCE1EE;--accent:#2F5BEA;--accent-ink:#fff;--ok:#1E8E5A;--okbg:#E3F4EC;--bad:#C93C3C;--badbg:#FBE7E7;--warn:#B76E00;--warnbg:#FFF4E0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10142A;--surface:#1A2040;--ink:#E8ECFA;--muted:#9AA3C7;--line:#2C3560;--accent:#7C9BFF;--accent-ink:#10142A;--ok:#4FD39A;--okbg:#12342A;--bad:#FF8585;--badbg:#3A1C26;--warn:#F5B841;--warnbg:#332612}}
:root[data-theme="dark"]{--bg:#10142A;--surface:#1A2040;--ink:#E8ECFA;--muted:#9AA3C7;--line:#2C3560;--accent:#7C9BFF;--accent-ink:#10142A;--ok:#4FD39A;--okbg:#12342A;--bad:#FF8585;--badbg:#3A1C26;--warn:#F5B841;--warnbg:#332612}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Inter","Noto Sans Bengali","Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;font-variant-ligatures:common-ligatures;text-rendering:optimizeLegibility;-webkit-text-size-adjust:100%;line-height:1.55;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:16px 16px 24px;max-width:600px;width:100%;margin:0 auto}
h1{font-size:22px;margin:4px 0 12px;font-weight:700}
h2{font-size:17px;margin:18px 0 8px;font-weight:700}
h3{font-size:16px;margin:14px 0 8px;font-weight:600;color:var(--muted)}
.meta{color:var(--muted);font-size:15px;margin-bottom:12px}
.panel,.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;transition:border-color .25s,box-shadow .25s}
.card.flash{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,91,234,.2)}
.row{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.row label{flex:1;font-size:15px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.dup-warn{background:var(--warnbg);border:1.5px solid var(--warn);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}
.dup-item{border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.weak-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.weak-row:first-of-type{border-top:0;padding-top:2px}
.opt-edit-row{display:flex;align-items:center;gap:6px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:4px 8px;margin-bottom:6px}
.opt-edit-row.active{border-color:var(--ok);background:var(--okbg)}
.opt-edit-row input[type=radio]{width:20px;height:20px;accent-color:var(--ok);cursor:pointer;flex:none}
.opt-edit-row input[type=text]{border:0;background:none;padding:6px 4px;margin:0;flex:1}
.opt-edit-row input[type=text]:focus{outline:none}
.mt-badge{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:#fff;background:var(--bad);padding:3px 10px;border-radius:999px}
select,input[type=number],input[type=datetime-local]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;min-width:130px}
input[type=number]{width:90px;min-width:0}
.sub{display:flex;gap:10px;align-items:center;font-weight:600;padding:6px 0}
.top{display:flex;gap:10px;align-items:center;padding:6px 0 6px 6px;border-top:1px solid var(--line)}
.top span{flex:1}.top small{color:var(--muted)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.btn{width:100%;font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 14px;margin-top:6px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{width:auto;padding:7px 12px;font-size:14px;border-radius:10px;margin:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.notif-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.notif-cnt{background:var(--bad);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;border-radius:999px;padding:0 5px;text-align:center}
.tags{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.tags span{background:var(--bg);border-radius:999px;padding:2px 10px}
.star{margin-left:auto;border:0;background:none;font-size:26px;color:var(--accent);line-height:1;padding:0 4px;cursor:pointer}
.q{font-size:19px;font-weight:600;line-height:1.5;margin:0 0 12px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;min-height:48px;cursor:pointer}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:600}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--badbg);border-color:var(--bad)}.opt.bad b{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{opacity:1}.opt i{margin-left:auto;font-style:normal}
.exp{background:var(--bg);border-radius:10px;padding:8px 12px;font-size:15px;margin-top:6px;white-space:pre-wrap;line-height:1.6}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--accent)}
.total{font-size:34px;font-weight:700;margin:2px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
.chip{font:inherit;font-size:14px;font-weight:600;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:.15s}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.live-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ok);background:var(--okbg);padding:2px 9px;border-radius:999px;vertical-align:middle}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.off-badge{display:inline-block;font-size:12px;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:999px;vertical-align:middle}
.diff-box{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:14px;margin-top:6px;border-left:3px solid var(--muted)}
.edit-box{background:var(--bg);border-radius:10px;padding:10px;margin-top:8px;border-left:3px solid var(--ok)}
.sugg-wrap{position:relative}
.sugg-list{display:none;position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--surface);border:1.5px solid var(--accent);border-radius:10px;min-width:160px;max-height:210px;overflow-y:auto;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.sugg-list.open{display:block}
.sugg-item{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.sugg-item:last-child{border-bottom:0}
.sugg-item:hover,.sugg-item:focus{background:var(--bg)}
.sugg-item small{color:var(--muted);font-size:13px;white-space:nowrap}
.timer-pill{font-size:15px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);white-space:nowrap}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);font-size:15px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:14px}
td:first-child,th:first-child{text-align:left;padding-left:10px}
nav{display:flex;gap:4px;padding:5px 6px calc(5px + env(safe-area-inset-bottom,0px));overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line);background:var(--surface)}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;min-width:64px;font:inherit;font-size:14px;font-weight:500;color:var(--muted);background:none;border:0;border-radius:10px;padding:9px 10px;white-space:nowrap;cursor:pointer;transition:.15s}
nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.opt i{font-style:normal;font-size:13px;color:var(--muted);white-space:nowrap}
input[type=email],input[type=password]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;margin-bottom:4px}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
button,input,select,textarea{font-family:inherit;font-variant-ligatures:common-ligatures}
.q,.opt span,.exp{overflow-wrap:anywhere;word-break:normal}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== Firebase কনফিগারেশন ===== */
var FIREBASE_CONFIG={
  apiKey: "AIzaSyBOHxjgB36M-sOZwNHtiij3LMa804A908o",
  authDomain: "corui-academy.firebaseapp.com",
  projectId: "corui-academy",
  storageBucket: "corui-academy.firebasestorage.app",
  messagingSenderId: "683649317136",
  appId: "1:683649317136:web:13d30d9a77ad109ad44d95"
};

/* ===== প্রশ্নব্যাংক ===== */
var NEG=0.25;
var SEC_PER_Q=30;
var Q=[];
var SEED=[];
var BY={};
var insts=[];

function hs(s){var n=5381;for(var j=0;j<s.length;j++)n=((n<<5)+n+s.charCodeAt(j))|0;return "q"+(n>>>0).toString(36);}
function normKey(s){return String(s||"").toLowerCase().replace(/\s+/g," ").trim();}
function simKey(s){
  return String(s||"")
    .toLowerCase()
    .replace(/['"“”‘’`]/g,"")
    .replace(/[_.…\-—]{2,}/g," _ ")
    .replace(/(^|\s)_+(\s|$)/g," _ ")
    .replace(/[?!.,;:()\[\]{}\/\\—\-\u0964]/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function fullSimKey(q,o){return simKey(q)+"|"+(o||[]).map(simKey).join("|");}
function setQuestions(arr){
  Q=arr; BY={}; insts=[];
  Q.forEach(function(x){if(!x.id)x.id=hs((x.q||"")+(x.o||[]).join("|")); BY[x.id]=x; if(x.i&&insts.indexOf(x.i)<0)insts.push(x.i);});
}

/* ===== সংরক্ষণ ও ইউজার স্টেট ===== */
var DEFAULT_CFG={topics:{},pool:"new",inst:"",n:10,order:"rand",showTopic:false,reveal:"instant",timer:true};
var S={seen:{},wrong:{},fav:{},st:{},hist:[],exams:[],lang:"en",theme:"auto",cfg:null};
var UID=null,DB=null,booted=false,saveTimer=null,hbTimer=null,usrUnsub=null,reqUnsub=null,mtUnsub=null,exTimer=null;
var V_AUTH={mode:"login",msg:"",ok:false};
var MT_LIST=[];

function normalize(d){d=d||{};return {seen:d.seen||{},wrong:d.wrong||{},fav:d.fav||{},st:d.st||{},hist:d.hist||[],exams:d.exams||[],lang:d.lang||"en",theme:d.theme||"auto",cfg:d.cfg||null};}
function applyCfgFromState(){
  var src=S.cfg||{};
  V.cfg=Object.assign({},DEFAULT_CFG,src,{topics:Object.assign({},src.topics||{})});
}
function applyTheme(){
  var t=S.theme||"auto";
  if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
}
function pingPresence(isOnline){
  if(!UID||!DB)return;
  var em=((firebase.auth().currentUser)||{}).email||"";
  DB.collection("users").doc(UID).set({lastActive:Date.now(),online:!!isOnline,email:em},{merge:true}).catch(function(){});
}
function startPresence(){
  stopPresence();
  pingPresence(true);
  hbTimer=setInterval(function(){if(document.visibilityState==="visible")pingPresence(true);},45000);
}
function stopPresence(){if(hbTimer){clearInterval(hbTimer);hbTimer=null;}}
document.addEventListener("visibilitychange",function(){
  if(UID&&DB){
    if(document.visibilityState==="hidden")save(true);
    pingPresence(document.visibilityState==="visible");
  }
});
window.addEventListener("pagehide",function(){if(UID&&DB){save(true);pingPresence(false);}});

function saveLocal(){
  if(!UID)return;
  try{
    S.cfg=Object.assign({},V.cfg);
    localStorage.setItem("corui_quiz_state_"+UID,JSON.stringify({state:S,updated:Date.now()}));
  }catch(err){}
}
function readLocal(uid){
  try{var raw=localStorage.getItem("corui_quiz_state_"+uid);return raw?JSON.parse(raw):null;}catch(err){return null;}
}
function save(immediate){
  if(!UID)return;
  saveLocal();
  if(!DB)return;
  var u=UID,d=DB,snapshot=JSON.parse(JSON.stringify(S));
  var flush=function(){
    d.collection("users").doc(u).set({state:snapshot,updated:Date.now(),lastActive:Date.now(),online:true,email:((firebase.auth().currentUser)||{}).email||""},{mergeFields:["state","updated","lastActive","online","email"]}).catch(function(err){console.warn(err);});
  };
  clearTimeout(saveTimer);
  if(immediate){flush();}else{saveTimer=setTimeout(flush,400);}
}
function boot(){
  history.replaceState(snap(),"","#home");
  try{firebase.initializeApp(FIREBASE_CONFIG);}
  catch(err){booted=true;V_AUTH={mode:"login",msg:"Firebase কনফিগারেশন বসানো হয়নি"};render();return;}
  firebase.auth().onAuthStateChanged(function(user){
    stopUsersWatch(); stopPresence(); stopReqsWatch(); stopMTWatch(); stopExamTimer();
    if(!user){UID=null;DB=null;ADMIN=false;S=normalize(null);applyCfgFromState();applyTheme();booted=true;render();return;}
    UID=user.uid;DB=firebase.firestore();ADMIN=(user.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase();booted=false;render();
    DB.collection("users").doc(UID).get()
      .then(function(snapData){
        var d=snapData.data()||{}, loc=readLocal(UID), useLoc=loc&&loc.state&&(loc.updated||0)>(d.updated||0);
        S=normalize(useLoc?loc.state:d.state);
        var del=d.adminDeleted||[];
        if(del.length)S.exams=S.exams.filter(function(x){return del.indexOf(x.id)<0;});
        applyCfgFromState(); applyTheme();
        if(useLoc)save(true);
      })
      .catch(function(err){
        console.warn(err);
        var loc=readLocal(UID);
        if(loc&&loc.state){S=normalize(loc.state);applyCfgFromState();applyTheme();}
      })
      .then(function(){startPresence();watchModelTests();if(ADMIN)watchPendingReqs();return loadQuestions();})
      .catch(function(err){console.warn(err);})
      .then(function(){booted=true;render();history.replaceState(snap(),"","#"+V.tab);});
  });
}
function authScreen(){
  var m=V_AUTH,isLogin=m.mode==="login";
  return '<div class="panel"><h1>'+(isLogin?'লগইন':'নতুন অ্যাকাউন্ট')+'</h1>'+
    '<div class="row" style="flex-direction:column;align-items:stretch"><label>ইমেইল</label><input id="em" type="email" autocomplete="email" value="'+esc(V.authEmail||"")+'"></div>'+
    '<div class="row" style="flex-direction:column;align-items:stretch"><label>পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label><input id="pw" type="password"></div>'+
    (m.msg?'<div class="meta" style="color:'+(m.ok?'var(--ok)':'var(--bad)')+'">'+esc(m.msg)+'</div>':'')+
    '<button class="btn" id="'+(isLogin?'doLogin':'doSignup')+'">'+(isLogin?'লগইন':'অ্যাকাউন্ট খুলুন')+'</button>'+
    (isLogin?'<button class="btn alt" id="forgotPw">পাসওয়ার্ড ভুলে গেছেন?</button>':'')+
    '<button class="btn alt" id="'+(isLogin?'toSignup':'toLogin')+'">'+(isLogin?'নতুন অ্যাকাউন্ট খুলুন':'আগে থেকে অ্যাকাউন্ট আছে, লগইন করুন')+'</button></div>';
}

var bn=function(n){if((S.lang||"en")==="en")return String(n);return String(n).replace(/\d/g,function(d){return "০১২৩৪৫৬৭৮৯"[d];});};
function optL(){return (S.lang||"en")==="en"?["A","B","C","D"]:["ক","খ","গ","ঘ"];}
var app=document.getElementById("app");
var V={tab:"home",screen:null,cfg:Object.assign({},DEFAULT_CFG,{topics:{}}),ex:null,list:null,title:"",filter:"all",lsel:{},saved:{},draft:{},homeQ:"",homeShowAns:{},admAllQ:"",editReqs:[],pendingCnt:0,myReqs:null,myReqsLoading:false,authEmail:"",mtForm:{custom:{},picked:{},exUsed:true,selTopics:{},handpickFilter:"new",handpickQ:""}};

/* ===== মডেল টেস্ট ওয়াচ ও হেল্পার ===== */
function stopMTWatch(){if(mtUnsub){mtUnsub();mtUnsub=null;}}
function watchModelTests(){
  if(mtUnsub||!DB)return;
  mtUnsub=DB.collection("modelTests").orderBy("createdAt","desc").onSnapshot(function(snap){
    MT_LIST=[];
    snap.forEach(function(d){MT_LIST.push(Object.assign({id:d.id},d.data()));});
    if(!V.screen)render();
  },function(err){console.warn(err);});
}
function activeModelTest(){
  var now=Date.now();
  for(var i=0;i<MT_LIST.length;i++){
    var mt=MT_LIST[i];
    if(mt.status!=="cancelled" && mt.startAt<=now && mt.endAt>=now)return mt;
  }
  return null;
}
function hasAttendedMT(mtId){
  return S.exams.some(function(x){return x.mtId===mtId && x.status==="done";});
}

/* ===== এক্সাম টাইমার ===== */
function fmtSec(sec){
  sec=Math.max(0,Math.floor(sec||0));
  var m=Math.floor(sec/60), s=sec%60;
  return bn((m<10?"0":"")+m+":"+(s<10?"0":"")+s);
}
function stopExamTimer(){if(exTimer){clearInterval(exTimer);exTimer=null;}}
function syncExamTimer(){
  stopExamTimer();
  if(V.screen!=="exam"||!V.ex||V.ex.status==="done"||!(V.ex.dur>0))return;
  if(V.ex.left==null)V.ex.left=V.ex.dur;
  if(V.ex.left<=0){finish(true);return;}
  exTimer=setInterval(function(){
    if(V.screen!=="exam"||!V.ex||V.ex.status==="done"||!(V.ex.dur>0)){stopExamTimer();return;}
    if(document.visibilityState==="hidden")return;
    V.ex.left=Math.max(0,(V.ex.left!=null?V.ex.left:V.ex.dur)-1);
    var el=document.getElementById("ex-timer");
    if(el){
      el.textContent="⏱ "+fmtSec(V.ex.left);
      el.style.color=V.ex.left<=30?"var(--bad)":"var(--accent)";
    }
    saveLocal();
    if(V.ex.left%10===0)save(false);
    if(V.ex.left<=0){stopExamTimer();finish(true);}
  },1000);
}

/* ===== ন্যাভিগেশন ও ব্রাউজার হিস্ট্রি ===== */
function snap(){
  return {
    tab:V.tab, screen:V.screen||null, exid:V.ex?V.ex.id:null, list:V.list||null, title:V.title||"", filter:V.filter||"all",
    edit:V.edit||null, admReqs:!!V.admReqs, admMT:!!V.admMT, admMTView:V.admMTView||null, admPickKey:V.admPickKey||null,
    adm:V.adm?{key:V.adm.key,sort:V.adm.sort,text:V.adm.text}:null, admAllQ:V.admAllQ||"",

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function tree(){var T={};Q.forEach(function(x){(T[x.s]=T[x.s]||{});(T[x.s][x.t]=T[x.s][x.t]||[]).push(x);});return T;}
function gname(x){
  if(x.s==="English"){
    if(x.t==="Literature")return "Literature";
    return "Grammar";
  }
  return x.s;
}
function tlabel(t){return t.indexOf("Grammar: ")===0?t.slice(9):t;}
function groupTree(list){
  var T={};
  (list||Q).forEach(function(x){
    var g=gname(x);
    T[x.s]=T[x.s]||{}; T[x.s][g]=T[x.s][g]||{}; (T[x.s][g][x.t]=T[x.s][g][x.t]||[]).push(x);
  });
  return T;
}

function pool(){
  var c=V.cfg;
  return Q.filter(function(x){
    if(!c.topics[x.s+"||"+x.t])return false;
    if(c.inst&&x.i!==c.inst)return false;
    if(c.pool==="new")return !S.seen[x.id];
    if(c.pool==="wrong")return !!S.wrong[x.id];
    return true;
  });
}
function weightedPick(list,n){
  var groups={};
  list.forEach(function(x){var k=x.s+"||"+x.t;(groups[k]=groups[k]||[]).push(x);});
  var keys=Object.keys(groups), w={};
  keys.forEach(function(k){
    var qs=groups[k],size=qs.length,att=0,wr=0,fav=0;
    qs.forEach(function(x){var s=S.st[x.id];if(s){att+=s[0]+s[1];wr+=s[1];} if(S.fav[x.id])fav++;});
    var wrongR=att?wr/att:0, favR=fav/size;
    w[k]=size*(1+wrongR+0.5*favR);
  });
  var alloc={};
  function total(){return keys.reduce(function(a,k){return a+(alloc[k]||0);},0);}
  var guard=0;
  while(total()<n && guard++<1000){
    var open=keys.filter(function(k){return (alloc[k]||0)<groups[k].length;});
    if(!open.length)break;
    var sumW=open.reduce(function(a,k){return a+w[k];},0), need=n-total(), progressed=false;
    open.forEach(function(k){
      var share=Math.max(1,Math.round(need*w[k]/sumW));
      var room=groups[k].length-(alloc[k]||0);
      var g=Math.min(share,room,n-total());
      if(g>0){alloc[k]=(alloc[k]||0)+g;progressed=true;}
    });
    if(!progressed)break;
  }
  var result=[];
  keys.forEach(function(k){result=result.concat(shuffle(groups[k]).slice(0,alloc[k]||0));});
  return shuffle(result);
}

/* ===== ব্যাখ্যা টেক্সট ও পার্সার ===== */
function composeExplText(q){
  if(q.explText)return q.explText;
  var lines=[];
  lines.push("Question- ("+tlabel(q.t)+")");
  if(q.bn)lines.push("Bangla Meaning: "+q.bn);
  if(q.e)lines.push("Explanation: "+q.e);
  var ex=q.ex||[];
  if(ex[0])lines.push("Example 1: "+ex[0].q+(ex[0].a?" → "+ex[0].a:"")+(ex[0].src?" ["+ex[0].src+"]":"")+(ex[0].bn?"\n("+ex[0].bn+")":""));
  if(ex[1])lines.push("Example 2: "+ex[1].q+(ex[1].a?" → "+ex[1].a:"")+(ex[1].src?" ["+ex[1].src+"]":"")+(ex[1].bn?"\n("+ex[1].bn+")":""));
  if(q.rule){
    lines.push("Exceptional Rule: "+q.rule.t);
    if(q.rule.ex)lines.push("Example: "+q.rule.ex.q+(q.rule.ex.bn?"\n("+q.rule.ex.bn+")":""));
  }
  return lines.join("\n");
}
function parseExplText(raw,qObj){
  raw=raw.trim();
  if(!raw)return {explText:"",bn:"",e:"",ex:[],rule:null};
  var mBn=raw.match(/Bangla Meaning:\s*([^\n\r]+)/i);
  var mExp=raw.match(/Explanation:\s*([\s\S]*?)(?=(Example \d+:|Exceptional Rule:|$))/i);
  return {
    explText:raw,
    bn:mBn?mBn[1].trim():(qObj?qObj.bn||"":""),
    e:mExp?mExp[1].trim():(qObj?qObj.e||"":""),
    ex:qObj?qObj.ex||[]:[],
    rule:qObj?qObj.rule||null:null
  };
}
function expl(q){
  var txt=composeExplText(q);
  return '<div class="exp">'+esc(txt)+'</div>';
}
function card(q,sel,mode){

/* ===== স্ট্রাকচার্ড ফিল্ড ও অপশন হেল্পার ===== */
function parseOpts(o4, ansIdx){
  var last=-1;
  for(var k=0;k<4;k++){if(o4[k])last=k;}
  if(last<1)return {err:"কমপক্ষে ২টি অপশন লিখুন।"};
  for(var j=0;j<=last;j++){if(!o4[j])return {err:"মাঝখানের অপশন ফাঁকা রাখা যাবে না।"};}
  var opts=o4.slice(0,last+1);
  if(ansIdx>=opts.length)return {err:"সঠিক উত্তর খালি অপশনে রাখা যাবে না।"};
  return {opts:opts};
}
function gv(id){var el=document.getElementById(id);return el?el.value.trim():"";}
function fld(label,id,val){return '<label style="display:block;margin-top:6px;color:var(--muted);font-size:14px">'+label+'</label><input type="text" id="'+id+'" value="'+esc(val)+'">';}
function area(label,id,val,rows){return '<label style="display:block;margin-top:6px;color:var(--muted);font-size:14px">'+label+'</label><textarea id="'+id+'" rows="'+(rows||2)+'">'+esc(val)+'</textarea>';}
function optEditGrid(pfx, opts, ansIdx){
  var L=optL(), h='<label style="display:block;margin-top:8px;color:var(--muted);font-size:14px">অপশন ও সঠিক উত্তর (যেটিতে টিক দেবেন সেটি সঠিক)</label><div class="grid2">';
  for(var k=0;k<4;k++){
    var val=(opts&&opts[k])||"", isCur=ansIdx===k;
    h+='<div class="opt-edit-row'+(isCur?' active':'')+'" id="'+pfx+'_row'+k+'">'+
      '<input type="radio" name="'+pfx+'_ans_rad" value="'+k+'"'+(isCur?' checked':'')+' data-radpfx="'+pfx+'" data-radidx="'+k+'">'+
      '<b>'+L[k]+')</b><input type="text" id="'+pfx+'_o'+k+'" value="'+esc(val)+'" placeholder="অপশন '+L[k]+'"></div>';

  return h+'</div>';

var RAW={};

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function clean(x){
  var c=JSON.parse(JSON.stringify(x)); delete c.id;
  Object.keys(c).forEach(function(k){
    if(c[k]===""||c[k]===null||(Array.isArray(c[k])&&!c[k].length))delete c[k];
  });
  return c;
}
function idb(){return new Promise(function(res,rej){var r=indexedDB.open("corui-quiz",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv");};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function cacheGet(){return idb().then(function(db){return new Promise(function(res){var t=db.transaction("kv").objectStore("kv").get("questions");t.onsuccess=function(){res(t.result||null);};t.onerror=function(){res(null);};});}).catch(function(){return null;});}
function cachePut(v){return idb().then(function(db){return new Promise(function(res){var t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,"questions");t.oncomplete=function(){res();};t.onerror=function(){res();};});}).catch(function(){});}
function cacheClear(){return idb().then(function(db){return new Promise(function(res){var t=db.transaction("kv","readwrite");t.objectStore("kv").delete("questions");t.oncomplete=function(){res();};t.onerror=function(){res();};});}).catch(function(){});}
function buildFrom(map){
  var out={};
  SEED.forEach(function(x,i){out[x.id]=Object.assign({},x,{ord:x.ord||(i+1)});});
  Object.keys(map).forEach(function(id){var data=map[id];if(data.deleted){delete out[id];return;}out[id]=Object.assign({},data,{id:id});});
  var arr=Object.keys(out).map(function(k){return out[k];});
  arr.sort(function(a,b){return (a.ord||0)-(b.ord||0);});
  setQuestions(arr);
}
function loadQuestions(){
  return cacheGet().then(function(c){
    var have=(c&&c.ver===1&&c.map)?c:null, map=have?have.map:{}, maxUpd=have?(have.maxUpd||0):0;
    var qy=have?DB.collection("questions").where("upd",">",maxUpd):DB.collection("questions");
    return qy.get().then(function(snap){
      snap.forEach(function(d){var data=d.data();map[d.id]=data;if((data.upd||0)>maxUpd)maxUpd=data.upd||0;});

function writeAll(arr,label,keepBatch){
  var bid=Date.now();

  var changes=arr.map(function(x){return {id:x.id,before:snapOf(x.id),after:clean(x)};});
  var chunks=[]; for(var i=0;i<changes.length;i+=400)chunks.push(changes.slice(i,i+400));
  var total=chunks.length;
  return chunks.reduce(function(p,chunk,ci){
    return p.then(function(){
      var b=DB.batch();
      chunk.forEach(function(c){b.set(DB.collection("questions").doc(c.id),c.after);});

    }).then(function(){
      chunk.forEach(function(c){RAW[c.id]=c.after;});
      return logChanges(chunk,(label||"ইমপোর্ট")+(total>1?" ("+(ci+1)+"/"+total+")":""));
    });
  },Promise.resolve())
  .then(function(){return loadQuestions();})

function admImportText(){
  var raw=document.getElementById("imp").value.trim();

  var arr; try{arr=JSON.parse(raw);}catch(err){alert("JSON ঠিক নেই: "+err.message);return;}
  if(!Array.isArray(arr)){alert("JSON একটা তালিকা (array) হতে হবে");return;}
  var byId={}, byKey={}, bySim={}, maxOrd=0;
  Q.forEach(function(x){
    byId[x.id]=x;
    byKey[normKey((x.q||"")+"|"+(x.o||[]).join("|"))]=x;
    bySim[fullSimKey(x.q,x.o)]=x;
    if((x.ord||0)>maxOrd)maxOrd=x.ord||0;
  });
  var toWrite=[], seenBatch={}, seenSim={}, nNew=0, nUpd=0, nDup=0;
  arr.forEach(function(x){
    var key=normKey((x.q||"")+"|"+((x.o||[]).join("|")));
    var sk=fullSimKey(x.q,x.o);
    if(seenBatch[key]||seenSim[sk]){nDup++;return;}
    seenBatch[key]=1; seenSim[sk]=1;
    var existing=(x.id&&byId[x.id])||byKey[key]||bySim[sk];
    if(existing){
      x.id=existing.id;
      if(!x.ord&&existing.ord)x.ord=existing.ord;
      if(!x.i&&existing.i)x.i=existing.i;
      if(!x.y&&existing.y)x.y=existing.y;
      nUpd++;
    }else{
      if(!x.id)x.id=hs((x.q||"")+(x.o||[]).join("|"));
      if(!x.ord)x.ord=++maxOrd;
      nNew++;
    }
    toWrite.push(x);
  });
  var msg="নতুন যোগ হবে: "+nNew+"\nআগে থেকে আছে (আপডেট হবে): "+nUpd+"\nতালিকায় ডুপ্লিকেট বাদ: "+nDup+"\n\nচালিয়ে যাবেন?";
  if(!confirm(msg))return;
  if(!toWrite.length){alert("লেখার মতো কিছু নেই");return;}
  writeAll(toWrite,"JSON ইমপোর্ট");
}

function showSugg(kind,filter){

  var counts={}, subjMap={};
  if(kind==="s"){
    Q.forEach(function(x){if(x.s)counts[x.s]=(counts[x.s]||0)+1;});
  }else if(kind==="i"){
    Q.forEach(function(x){if(x.i)counts[x.i]=(counts[x.i]||0)+1;});
  }else{
    var curS=(document.getElementById("a_s")||{}).value||"";
    curS=curS.trim().toLowerCase();
    var hasCur=curS&&Q.some(function(x){return (x.s||"").toLowerCase()===curS;});
    Q.forEach(function(x){
      if(!x.t)return;
      if(hasCur&&(x.s||"").toLowerCase()!==curS)return;
      counts[x.t]=(counts[x.t]||0)+1;
      if(!subjMap[x.t])subjMap[x.t]=x.s;
    });
  }
  var q=(filter||"").trim().toLowerCase();
  var items=Object.keys(counts).sort().filter(function(k){return !q||k.toLowerCase().indexOf(q)>=0;});
  if(!items.length){box.classList.remove("open");box.innerHTML="";return;}
  box.innerHTML=items.map(function(k){
    return '<button type="button" class="sugg-item" data-sugg="'+kind+'" data-val="'+esc(k)+'" data-subj="'+esc(subjMap[k]||"")+'"><span>'+esc(k)+'</span><small>'+bn(counts[k])+'টি</small></button>';
  }).join("");
  box.classList.add("open");
}

  else if(V.tab==="home")html=home();
  else if(V.tab==="users"&&ADMIN)html=usrView();
  else if(V.tab==="exams")html=examsView();
  else if(V.tab==="prog")html=prog();
  else if(V.tab==="admin"&&ADMIN)html=adminView();
  else html=listTab(V.tab==="admin"?"fav":V.tab);

  app.innerHTML=html;
  trDom(app);
  if(V.tab==="home"&&!V.screen&&!V.edit)renderHomeSearch();
  if(V.tab==="admin"&&ADMIN&&!V.edit&&!V.admReqs&&!V.admMT&&!V.admMTCreate&&!V.admMTView&&!V.admPickKey&&!(V.adm&&V.adm.key))renderAdmSearch();
  if(V.tab==="users"&&ADMIN&&!V.usrSel&&!V.edit&&V.usrList)renderUserList();
  if(V.edit&&ADMIN)checkAdminDup();
  nav();
  trDom(document.getElementById("nav"));
  app.scrollTop=(s==="exam")?y:0;
  syncExamTimer();
}

document.addEventListener("click",function(e){

app.addEventListener("focusin",function(e){

app.addEventListener("click",function(e){
  var t=e.target;
  if(t.id==="a_s"){showSugg("s","");return;}

  if(t.id==="a_src"){showSugg("i","");return;}

    var pfx=t.dataset.radpfx, idx=+t.dataset.radidx;

      var rowEl=document.getElementById(pfx+"_row"+j);

    var k=t.dataset.mttop;
    V.mtForm.selTopics=V.mtForm.selTopics||{};

    var row=t.closest(".row");

      var inp=row.querySelector("input[type=number]");
      var btn=row.querySelector("button[data-act='mt-pick-open']");

    updateMTLiveSummary();
    return;
  }
  t=t.closest("button");if(!t)return;
  if(t.dataset.sugg){
    var kind=t.dataset.sugg, val=t.dataset.val;
    if(kind==="s"){
      var elS=document.getElementById("a_s");
      if(elS)elS.value=val;
    }else if(kind==="i"){
      var elSrc=document.getElementById("a_src");
      if(elSrc)elSrc.value=val;
    }else{
      var elT=document.getElementById("a_t"), elS2=document.getElementById("a_s");
      if(elT)elT.value=val;
      if(elS2&&!elS2.value.trim()&&t.dataset.subj)elS2.value=t.dataset.subj;
    }
    closeSuggs();
    return;
  }
  if(t.id==="toSignup"){V_AUTH={mode:"signup",msg:"",ok:false};return render();}
  if(t.id==="toLogin"){V_AUTH={mode:"login",msg:"",ok:false};return render();}
  if(t.id==="forgotPw"){
    var emR=(document.getElementById("em")||{}).value||"";
    emR=emR.trim(); V.authEmail=emR;
    if(!emR){V_AUTH={mode:"login",msg:"রিসেট লিংক পেতে আগে ইমেইল লিখুন।",ok:false};return render();}
    t.disabled=true;
    firebase.auth().sendPasswordResetEmail(emR)
      .then(function(){V_AUTH={mode:"login",msg:"পাসওয়ার্ড রিসেট লিংক "+emR+"-এ পাঠানো হয়েছে (ইনবক্স/স্প্যাম চেক করুন)।",ok:true};render();})
      .catch(function(err){V_AUTH={mode:"login",msg:"ত্রুটি: "+err.message,ok:false};render();});
    return;
  }
  if(t.id==="doLogin"||t.id==="doSignup"){
    var em=document.getElementById("em").value.trim(),pw=document.getElementById("pw").value,isLogin=t.id==="doLogin";
    V.authEmail=em; t.disabled=true;
    var p=isLogin?firebase.auth().signInWithEmailAndPassword(em,pw):firebase.auth().createUserWithEmailAndPassword(em,pw);
    p.catch(function(err){V_AUTH={mode:isLogin?"login":"signup",msg:"ত্রুটি: "+err.message,ok:false};render();});
    return;
  }
  if(t.id==="adm-new"){navPush(function(){V.edit="new";});return;}
  if(t.id==="adm-cancel"){return stepBack();}
  if(t.id==="adm-save"){return admSave();}
  if(t.id==="adm-import"){return admImportText();}
  if(t.id==="adm-export"){return admExport();}
  if(t.id==="req-submit"){return submitEditReq();}
  if(t.id==="req-cancel"){return stepBack();}
  if(t.id==="mt-create-submit"){return createModelTest();}
  if(t.dataset.act==="reqedit"){navPush(function(){V.reqId=t.dataset.qid;V.screen="reqedit";});return;}
  if(t.dataset.act==="myreqs"){navPush(function(){V.screen="myreqs";loadMyReqs();});return;}
  if(t.dataset.act==="myreqs-back"||t.dataset.act==="mtlb-back"){return stepBack();}
  if(t.dataset.act==="togwrongexp"){
    var qk="wrong_ans_"+t.dataset.qid;
    V[qk]=!V[qk];
    var curY=app.scrollTop;
    render();
    app.scrollTop=curY;
    return;
  }
  if(t.dataset.act==="toguwrongexp"){
    var uqk="uwrong_ans_"+t.dataset.qid;
    V[uqk]=!V[uqk];
    var uY=app.scrollTop;
    render();
    app.scrollTop=uY;
    return;
  }
  if(t.dataset.act==="weak-prac"){
    var kp=t.dataset.key.split("||");
    var cands=Q.filter(function(x){return x.s===kp[0]&&x.t===kp[1];});
    var wrIds=shuffle(cands.filter(function(x){return !!S.wrong[x.id];}));
    var nwIds=shuffle(cands.filter(function(x){return !S.wrong[x.id]&&!S.seen[x.id];}));
    var othIds=shuffle(cands.filter(function(x){return !S.wrong[x.id]&&!!S.seen[x.id];}));
    var pick=wrIds.concat(nwIds,othIds).slice(0,15).map(function(x){return x.id;});
    if(pick.length)return begin(pick,"দুর্বল টপিক: "+tlabel(kp[1]));
    return;
  }
  if(t.dataset.act==="go-reqs"){
    navPush(function(){
      V.tab="admin"; V.screen=null; V.edit=null; V.adm=null; V.admReqs=true;
      loadPendingCount();
    });
    return;
  }
  if(t.dataset.act==="adm-reqs"){navPush(function(){V.admReqs=true;loadPendingCount();});return;}
  if(t.dataset.act==="reqs-back"){return stepBack();}
  if(t.dataset.act==="req-approve"){return approveReq(t.dataset.rid);}
  if(t.dataset.act==="req-reject"){return rejectReq(t.dataset.rid);}
  if(t.dataset.act==="topic-verify"&&V.adm&&V.adm.key){var pv=V.adm.key.split("||");return topicBulkVerify(pv[0],pv[1]);}
  if(t.dataset.act==="topic-rename"&&V.adm&&V.adm.key){var pr=V.adm.key.split("||");return topicBulkRename(pr[0],pr[1]);}
  if(t.dataset.act==="edit"||t.dataset.act==="uedit"){navPush(function(){V.edit=t.dataset.qid;});return;}
  if(t.dataset.act==="del"){return admDelete(t.dataset.qid);}
  if(t.dataset.act==="next-un"){return jumpUnanswered();}
  if(t.dataset.act==="pdf-q"||t.dataset.act==="pdf-a"){
    var exP=S.exams.filter(function(x){return x.id===t.dataset.exid;})[0]||(V.ex&&V.ex.id===t.dataset.exid?V.ex:null);
    return printExamPdf(exP,t.dataset.act==="pdf-a");
  }
  if(t.dataset.act==="hsearch-exam"||t.dataset.act==="hsearch-exam40"){
    var list=homeMatches(); if(!list.length)return;
    if(t.dataset.act==="hsearch-exam40")list=list.slice(0,40);
    return begin(list.map(function(x){return x.id;}),"খোঁজা প্রশ্ন: "+V.homeQ.trim().slice(0,25));
  }
  if(t.dataset.act==="hsearch-browse"){
    var list2=homeMatches(); if(!list2.length)return;
    navPush(function(){V.title="খোঁজা প্রশ্ন: "+V.homeQ.trim(); V.list=list2.map(function(x){return x.id;}); V.screen="browse";});
    return;
  }
  if(t.dataset.act==="htogans"){
    var qid=t.dataset.qid; V.homeShowAns[qid]=!V.homeShowAns[qid];
    return renderHomeSearch();
  }
  if(t.dataset.act==="resume"||t.dataset.act==="exres"){
    var ex=S.exams.filter(function(x){return x.id===t.dataset.exid;})[0];
    if(!ex)return;
    navPush(function(){
      V.ex=ex; V.title=ex.name; V.filter="all";
      V.screen=(t.dataset.act==="resume"&&ex.status!=="done")?"exam":"result";
    });
    return;
  }
  if(t.dataset.act==="exdel"){
    var tgt=S.exams.filter(function(x){return x.id===t.dataset.exid;})[0];
    if(tgt&&tgt.status==="done"&&(Date.now()-(tgt.finishedAt||tgt.at))<7*864e5){alert(S.lang==="bn"?"জমা দেওয়া পরীক্ষা ৭ দিনের মধ্যে মোছা যায় না।":"A submitted exam cannot be deleted within 7 days.");return;}
    if(!confirm("এই পরীক্ষাটি মুছে ফেলবেন?"))return;
    S.exams=S.exams.filter(function(x){return x.id!==t.dataset.exid;});
    if(V.ex&&V.ex.id===t.dataset.exid){V.ex=null;V.screen=null;}
    save(true); render(); return;
  }
  if(t.dataset.act==="usr"){navPush(function(){V.usrSel=t.dataset.uid;});return;}
  if(t.dataset.act==="usrback"){return stepBack();}
  if(t.dataset.act==="lang"){S.lang=(S.lang==="bn")?"en":"bn";save(false);return render();}
  if(t.dataset.act==="theme"){S.theme=(S.theme==="dark")?"light":(S.theme==="light"?"auto":"dark");applyTheme();save(false);return render();}
  if(t.dataset.act==="usrmore"){V.usrMore=!V.usrMore;return render();}
  if(t.dataset.act==="uwrongopen"){navPush(function(){V.usrTopic="";V.screen="uwrong";});return;}
  if(t.dataset.act==="uwrongback"){return stepBack();}
  if(t.dataset.act==="uexdel"){
    var ctx2=userCtx(); if(!ctx2)return;
    var ex2=ctx2.st.exams.filter(function(x){return x.id===t.dataset.exid;})[0];
    if(!confirm("এই পরীক্ষাটি ব্যবহারকারীর তালিকা থেকে মুছবেন?\n"+(ex2?ex2.name:"")))return;
    var uid2=ctx2.u.uid, left=ctx2.st.exams.filter(function(x){return x.id!==t.dataset.exid;});
    DB.collection("users").doc(uid2).update({"state.exams":left,adminDeleted:firebase.firestore.FieldValue.arrayUnion(t.dataset.exid)})
      .then(function(){
        var ud=ctx2.u.data; ud.state=ud.state||{}; ud.state.exams=left;
        ud.adminDeleted=(ud.adminDeleted||[]).concat([t.dataset.exid]);
        render();
      }).catch(function(err){alert("মোছা যায়নি: "+err.message);});
    return;
  }
  if(t.dataset.act==="wrongopen"){navPush(function(){V.usrTopic="";V.screen="wrong";});return;}
  if(t.dataset.act==="wrongback"){return stepBack();}
  if(t.dataset.act==="usrtop"){V.usrTopic=t.dataset.key;return render();}
  if(t.dataset.act==="uexam"){navPush(function(){V.usrExam=t.dataset.exid;V.usrFilter="wrong";});return;}
  if(t.dataset.act==="ubackexam"){return stepBack();}
  if(t.dataset.ufilter){V.usrFilter=t.dataset.ufilter;return render();}
  if(t.dataset.act==="topic"){navPush(function(){V.adm={key:t.dataset.key,sort:"new",text:""};});return;}
  if(t.dataset.act==="back"){return stepBack();}
  if(t.dataset.act==="mt-pick-filt"){V.mtForm.handpickFilter=t.dataset.val;return render();}
  if(t.id==="adm-clearcache"){
    if(!confirm("ফোনের জমানো প্রশ্ন মুছে ডেটাবেস থেকে সব প্রশ্ন আবার আনা হবে। এতে প্রশ্ন সংখ্যার সমান রিড খরচ হবে। চালিয়ে যাবেন?"))return;
    cacheClear().then(function(){return loadQuestions();}).then(function(){alert("নতুন করে আনা হয়েছে: "+Q.length+"টি প্রশ্ন");render();}).catch(function(err){alert("সমস্যা: "+err.message);});
    return;
  }
  if(t.id==="adm-undo"){return admUndo();}
  if(t.id==="adm-redo"){return admRedo();}
  if(t.id==="logout"){save(true);stopExamTimer();pingPresence(false);stopReqsWatch();stopUsersWatch();firebase.auth().signOut();return;}
  if(t.dataset.fav){var id=t.dataset.fav;if(S.fav[id])delete S.fav[id];else S.fav[id]=1;save(false);t.textContent=S.fav[id]?"★":"☆";return;}
  if(t.dataset.k!==undefined)return answer(t.dataset.id,+t.dataset.k);
  if(t.id==="start"){var p=pool(),n=Math.max(1,Math.min(+V.cfg.n||1,p.length));var ids=(V.cfg.order==="rand"?weightedPick(p,n):p.slice(0,n)).map(function(x){return x.id;});var nm=((document.getElementById("exname")||{}).value||"").trim();return begin(ids,nm||("পরীক্ষা – "+new Date().toLocaleDateString("en-GB")));}
  if(t.id==="quit")return finish(false);
  if(t.id==="redo")return begin(shuffle(V.ex.bad),"ভুলগুলো আবার");
  if(t.dataset.filter){V.filter=t.dataset.filter;return render();}
  if(t.id==="home"){return stepBack();}
  if(t.dataset.go){
    var kind=t.dataset.kind,ids2=selIds(kind);
    var nm=((document.getElementById("lname")||{}).value||"").trim();
    if(!ids2.length)return;
    if(t.dataset.go==="exam")return begin(shuffle(ids2),nm||("পরীক্ষা – "+new Date().toLocaleDateString("en-GB")));
    navPush(function(){V.title=nm||(kind==="fav"?"পছন্দের প্রশ্ন":"ভুল প্রশ্ন"); V.list=ids2; V.screen="browse";});
    return;
  }

  /* মডেল টেস্ট সংক্রান্ত ইভেন্ট */
  if(t.dataset.act==="adm-mt"){navPush(function(){V.admMT=true;V.admMTCreate=false;V.admMTView=null;V.admPickKey=null;});return;}
  if(t.dataset.act==="mt-back"){return stepBack();}
  if(t.dataset.act==="mt-new"){navPush(function(){V.admMTCreate=true;V.mtForm={custom:{},picked:{},exUsed:true,selTopics:{},handpickFilter:"new",handpickQ:""};});return;}
  if(t.dataset.act==="mt-list"){V.admMTCreate=false;V.admMTView=null;return render();}
  if(t.dataset.act==="mt-details"){navPush(function(){V.admMTView=t.dataset.mtid;});return;}
  if(t.dataset.act==="mt-release-all"){return releaseAllMT(t.dataset.mtid);}
  if(t.dataset.act==="mt-rel-one"){return toggleOneQRelease(t.dataset.mtid,t.dataset.qid,false);}
  if(t.dataset.act==="mt-lock-one"){return toggleOneQRelease(t.dataset.mtid,t.dataset.qid,true);}
  if(t.dataset.act==="mt-del"){return deleteModelTest(t.dataset.mtid);}
  if(t.dataset.act==="mt-lb"){return showMTLeaderboard(t.dataset.mtid);}
  if(t.dataset.act==="mt-pick-open"){navPush(function(){V.admPickKey=t.dataset.key;V.mtForm.handpickQ="";});return;}
  if(t.dataset.act==="mt-pick-done"){
    var kp=V.admPickKey.split("||"), ps=kp[0], pt=kp[1];
    var cN=Object.keys(V.mtForm.picked||{}).filter(function(id){
      var qx=BY[id]; return qx && qx.s===ps && qx.t===pt && V.mtForm.picked[id];
    }).length;
    
    V.mtForm.custom=V.mtForm.custom||{};
    V.mtForm.custom[V.admPickKey] = cN > 0 ? cN : "";
    
    V.mtForm.selTopics=V.mtForm.selTopics||{};
    V.mtForm.selTopics[V.admPickKey]=true;

    V.admPickKey=null;
    return render();
  }
  if(t.dataset.act==="mt-join"){
    var mt=MT_LIST.filter(function(x){return x.id===t.dataset.mtid;})[0];
    if(!mt)return;
    if(hasAttendedMT(mt.id)){alert("আপনি ইতিমধ্যে এই মডেল টেস্টে অংশ নিয়েছেন।");return;}
    return begin(shuffle(mt.qids),mt.title,{dur:mt.dur,reveal:"end",showTopic:false,mtId:mt.id,neg:mt.neg!=null?mt.neg:NEG});
  }
  if(t.dataset.act==="mt-res"){
    var myEx=S.exams.filter(function(x){return x.mtId===t.dataset.mtid&&x.status==="done";})[0];
    if(myEx){
      navPush(function(){V.ex=myEx;V.title=myEx.name;V.filter="all";V.screen="result";});
    }else{
      showMTLeaderboard(t.dataset.mtid);
    }
    return;
  }

  if(t.dataset.tab){goTab(t.dataset.tab);return;}
});

app.addEventListener("change",function(e){
  var t=e.target,c=V.cfg;
  if(t.dataset.act==="mt-pick-tog"){
    V.mtForm.picked=V.mtForm.picked||{};
    V.mtForm.picked[t.dataset.qid]=t.checked;
    
    var kp=V.admPickKey.split("||"), ps=kp[0], pt=kp[1];
    var cN=Object.keys(V.mtForm.picked).filter(function(id){
      var qx=BY[id]; return qx && qx.s===ps && qx.t===pt && V.mtForm.picked[id];
    }).length;
    var cEl=document.getElementById("pick-live-cnt");
    if(cEl)cEl.textContent="সিলেক্টেড: "+bn(cN)+"টি";
    return;
  }
  if(t.id&&/^(a_|r_|rr_|mt_|imp|em|pw|exname|lname|home-q|adm-all-q|usr-q)/.test(t.id))return;
  if(t.dataset.usrtopic!==undefined){V.usrTopic=t.value;return render();}
  if(t.dataset.admsort){V.adm.sort=t.value;return render();}
  if(t.dataset.admtext){V.adm.text=t.value;return render();}
  if(t.dataset.grp){
    var gp=t.dataset.grp.split("||");
    Q.forEach(function(x){if(x.s===gp[0]&&gname(x)===gp[1])c.topics[x.s+"||"+x.t]=t.checked;});
    save(false); var y2=app.scrollTop;render();app.scrollTop=y2;return;
  }
  if(t.dataset.lkind){
    var k=t.dataset.lkind;V.lsel=V.lsel||{};V.lsel[k]=V.lsel[k]||{};var m=V.lsel[k];
    if(t.dataset.ltop){m[t.dataset.ltop]=t.checked;}
    else if(t.dataset.lsub){Q.forEach(function(x){if(x.s===t.dataset.lsub&&S[k][x.id])m[x.s+"||"+x.t]=t.checked;});}
    else if(t.dataset.lgrp){var gq=t.dataset.lgrp.split("||");Q.forEach(function(x){if(x.s===gq[0]&&gname(x)===gq[1]&&S[k][x.id])m[x.s+"||"+x.t]=t.checked;});}
    var y0=app.scrollTop;render();app.scrollTop=y0;return;
  }
  if(t.dataset.cfg){c[t.dataset.cfg]=t.type==="checkbox"?t.checked:t.value;save(false);}
  else if(t.dataset.top){c.topics[t.dataset.top]=t.checked;save(false);}
  else if(t.dataset.sub){Q.forEach(function(x){if(x.s===t.dataset.sub)c.topics[x.s+"||"+x.t]=t.checked;});save(false);}
  var y=app.scrollTop;render();app.scrollTop=y;
});

app.addEventListener("input",function(e){
  var t=e.target;
  if(t.dataset.mtcust){
    V.mtForm.custom=V.mtForm.custom||{};
    V.mtForm.custom[t.dataset.mtcust]=t.value;
    updateMTLiveSummary();
  }
  else if(t.id==="exname"||t.id==="lname")V.draft[t.id]=t.value;
  else if(t.id==="em")V.authEmail=t.value;
  else if(t.id==="home-q"){V.homeQ=t.value;renderHomeSearch();}
  else if(t.id==="adm-all-q"){V.admAllQ=t.value;renderAdmSearch();}
  else if(t.id==="usr-q"){V.usrQ=t.value;renderUserList();}
  else if(t.id==="mt-pick-srch"){V.mtForm.handpickQ=t.value;render();}
  else if(t.id==="a_s"){showSugg("s",t.value);}
  else if(t.id==="a_t"){showSugg("t",t.value);}
  else if(t.id==="a_src"){showSugg("i",t.value);}
  else if(t.id==="a_q"){checkAdminDup();}
});

document.getElementById("nav").addEventListener("click",function(e){var t=e.target.closest("button");if(t)goTab(t.dataset.tab);});
boot();
