function mkFP(seg){
  if(seg.length===1)return new firebase.firestore.FieldPath(seg[0]);
  if(seg.length===2)return new firebase.firestore.FieldPath(seg[0],seg[1]);
  if(seg.length===3)return new firebase.firestore.FieldPath(seg[0],seg[1],seg[2]);
  return new firebase.firestore.FieldPath(seg[0],seg[1],seg[2],seg[3]);
}
function daysLeft(expireAt){return Math.max(0,Math.ceil(((expireAt||0)-Date.now())/864e5));}

/* ===== Favorite Revision হেল্পার (Revision 1, 2, 3...) ===== */
function curFavRevId(){var r=String((V.cfg&&V.cfg.favRevId)||"1").replace(/[^0-9]/g,"");return r||"1";}
function getFavRevMap(revId){
  revId=String(revId||curFavRevId());
  if(revId==="1"){S.favRound=S.favRound||{};return S.favRound;}
  S.favRevs=S.favRevs||{};S.favRevs[revId]=S.favRevs[revId]||{};
  return S.favRevs[revId];
}
function setFavRevSeen(revId,qid,on){
  revId=String(revId||curFavRevId());
  var m=getFavRevMap(revId);
  if(on){m[qid]=1;queueFavChange(revId==="1"?"favRound":"favRevs",qid,1,revId);}
  else{delete m[qid];queueFavChange(revId==="1"?"favRound":"favRevs",qid,0,revId);}
}
function availableFavRevs(){
  var set={"1":1,"2":1};
  Object.keys(S.favRevs||{}).forEach(function(k){if(/^\d+$/.test(k))set[k]=1;});
  Object.keys(S.favRevSt||{}).forEach(function(k){if(/^\d+$/.test(k))set[k]=1;});
  var cur=curFavRevId();if(/^\d+$/.test(cur))set[cur]=1;
  return Object.keys(set).sort(function(a,b){return (+a)-(+b);});
}

/* ===== ২. LocalStorage ক্যাশ, পেন্ডিং কিউ ও চলমান পরীক্ষা ===== */
function runKey(uid){return "corui_run_"+uid;}
function cacheKey(uid){return "corui_cache_"+uid;}
function favQKey(uid){return "corui_favq_"+uid;}

function readRunLocal(uid){
  if(!uid)return {exams:{}};
  try{var raw=localStorage.getItem(runKey(uid));if(!raw)return {exams:{}};var p=JSON.parse(raw);return (p&&p.exams&&typeof p.exams==="object")?p:{exams:{}};}catch(e){return {exams:{}};}
}
function writeRunLocal(uid,obj){
  if(!uid)return;
  try{if(!Object.keys(obj.exams||{}).length)localStorage.removeItem(runKey(uid));else localStorage.setItem(runKey(uid),JSON.stringify(obj));}catch(e){}
}
function saveRunLocal(ex){
  if(!UID||!ex||!ex.id)return;
  var store=readRunLocal(UID),copy=JSON.parse(JSON.stringify(ex));
  delete copy._finishing;store.exams[ex.id]=copy;writeRunLocal(UID,store);
}
function removeRunLocal(exId){if(!UID||!exId)return;var store=readRunLocal(UID);if(store.exams[exId]){delete store.exams[exId];writeRunLocal(UID,store);}}

function readFavQueue(uid){
  if(!uid)return {fav:{},favRound:{},favRevs:{}};
  try{var raw=localStorage.getItem(favQKey(uid));if(!raw)return {fav:{},favRound:{},favRevs:{}};var p=JSON.parse(raw);return {fav:p.fav||{},favRound:p.favRound||{},favRevs:p.favRevs||{}};}catch(e){return {fav:{},favRound:{},favRevs:{}};}
}
function writeFavQueue(uid,qObj){
  if(!uid)return;
  try{
    var hasRevs=Object.keys(qObj.favRevs||{}).some(function(r){return Object.keys(qObj.favRevs[r]||{}).length>0;});
    if(!Object.keys(qObj.fav||{}).length&&!Object.keys(qObj.favRound||{}).length&&!hasRevs)localStorage.removeItem(favQKey(uid));
    else localStorage.setItem(favQKey(uid),JSON.stringify(qObj));
  }catch(e){}
}
function queueFavChange(kind,qid,val,revId){
  if(!UID||!qid)return;
  var q=readFavQueue(UID);
  if(kind==="favRevs"){
    revId=String(revId||"2");
    q.favRevs=q.favRevs||{};q.favRevs[revId]=q.favRevs[revId]||{};q.favRevs[revId][qid]=val?1:0;
  }else{
    q[kind]=q[kind]||{};q[kind][qid]=val?1:0;
  }
  writeFavQueue(UID,q);
  saveStateCache();
}
function applyFavQueueToState(st,uid){
  var fq=readFavQueue(uid);
  Object.keys(fq.fav).forEach(function(k){if(fq.fav[k])st.fav[k]=1;else delete st.fav[k];});
  Object.keys(fq.favRound).forEach(function(k){if(fq.favRound[k])st.favRound[k]=1;else delete st.favRound[k];});
  st.favRevs=st.favRevs||{};
  Object.keys(fq.favRevs||{}).forEach(function(rid){
    st.favRevs[rid]=st.favRevs[rid]||{};
    var rm=fq.favRevs[rid]||{};
    Object.keys(rm).forEach(function(k){if(rm[k])st.favRevs[rid][k]=1;else delete st.favRevs[rid][k];});
  });
}

function saveStateCache(){
  if(!UID)return;
  try{
    var attCache=(V.att&&V.att.items?V.att.items.slice(0,12):[]).concat(V.mtAtt&&V.mtAtt.items?V.mtAtt.items.slice(0,8):[]);
    var payload={
      at:Date.now(),
      state:{seen:S.seen,wrong:S.wrong,fav:S.fav,favRound:S.favRound,favRevs:S.favRevs,favRevSt:S.favRevSt,st:S.st,hist:S.hist,lang:S.lang,theme:S.theme,cfg:S.cfg,lastScoreSync:S.lastScoreSync||0},
      attCache:attCache
    };
    localStorage.setItem(cacheKey(UID),JSON.stringify(payload));
  }catch(e){}
}
function loadStateCache(uid){
  if(!uid)return false;
  try{
    var raw=localStorage.getItem(cacheKey(uid));if(!raw)return false;
    var p=JSON.parse(raw);if(!p||!p.state)return false;
    S=normalize(p.state);
    applyFavQueueToState(S,uid);
    applyCfgFromState();applyTheme();
    if(Array.isArray(p.attCache)&&p.attCache.length&&!V.att.loaded){
      V.att.items=p.attCache.filter(function(x){return x&&!x.mtId&&!x.deletedAt;});
      V.mtAtt.items=p.attCache.filter(function(x){return x&&!!x.mtId&&!x.deletedAt;});
      V.mtAtt.items.forEach(function(x){V.mtAttended[x.mtId]=x;});
    }
    return true;
  }catch(e){return false;}
}

function runningExamsOnly(list){
  return (list||[]).filter(function(x){return x&&x.status!=="done";}).map(function(x){
    var c=JSON.parse(JSON.stringify(x));delete c._finishing;delete c.dirtyCount;delete c.pendingFinish;return c;
  });
}
function extractServerRunning(d){
  var st=normalize(d&&d.state),byId={};
  runningExamsOnly(st.exams).forEach(function(x){byId[x.id]=x;});
  if(st.runMap&&typeof st.runMap==="object"){
    Object.keys(st.runMap).forEach(function(k){
      var rx=st.runMap[k];
      if(rx&&rx.status!=="done"){if(!rx.id)rx.id=k;byId[rx.id]=rx;}
    });
  }
  return Object.keys(byId).map(function(k){return byId[k];});
}
function mergeExamObjects(loc,srv){
  if(!srv)return loc;if(!loc)return srv;
  var out=JSON.parse(JSON.stringify((srv.updatedAt||0)>(loc.updatedAt||0)?srv:loc));
  var la=loc.a||{},sa=srv.a||{},lat=loc.ansAt||{},sat=srv.ansAt||{};
  var mergedA={},mergedAt={};
  Object.keys(sa).forEach(function(k){mergedA[k]=sa[k];if(sat[k])mergedAt[k]=sat[k];});
  Object.keys(la).forEach(function(k){
    if(mergedA[k]===undefined){mergedA[k]=la[k];if(lat[k])mergedAt[k]=lat[k];}
    else if((lat[k]||loc.updatedAt||0)>=(sat[k]||srv.updatedAt||0)){mergedA[k]=la[k];if(lat[k])mergedAt[k]=lat[k];}
  });
  out.a=mergedA;if(Object.keys(mergedAt).length)out.ansAt=mergedAt;
  if(loc.left!=null&&srv.left!=null)out.left=Math.min(loc.left,srv.left);
  else if(loc.left!=null)out.left=loc.left;
  else if(srv.left!=null)out.left=srv.left;
  out.updatedAt=Math.max(loc.updatedAt||0,srv.updatedAt||0);
  return out;
}

function patchUserFields(u,ops){
  if(!u||!DB||!ops||!ops.length)return Promise.resolve();
  var ref=DB.collection("users").doc(u),args=[];
  ops.forEach(function(op){args.push(mkFP(op.path),op.val);});
  return ref.update.apply(ref,args).catch(function(err){
    if(err&&err.code==="not-found"){
      return ref.set({updated:Date.now(),email:((firebase.auth().currentUser)||{}).email||""},{merge:true})
        .then(function(){return ref.update.apply(ref,args);});
    }
    throw err;
  });
}

function flushPendingFavs(immediate){
  if(!UID||!DB)return Promise.resolve();
  var u=UID;
  var run=function(){
    favTimer=null;
    var snapQ=readFavQueue(u),ops=[],delV=firebase.firestore.FieldValue.delete();
    Object.keys(snapQ.fav).forEach(function(qid){ops.push({kind:"fav",qid:qid,val:snapQ.fav[qid]?1:0,path:["state","fav",qid],fval:snapQ.fav[qid]?1:delV});});
    Object.keys(snapQ.favRound).forEach(function(qid){ops.push({kind:"favRound",qid:qid,val:snapQ.favRound[qid]?1:0,path:["state","favRound",qid],fval:snapQ.favRound[qid]?1:delV});});
    Object.keys(snapQ.favRevs||{}).forEach(function(rid){
      var rm=snapQ.favRevs[rid]||{};
      Object.keys(rm).forEach(function(qid){ops.push({kind:"favRevs",rid:rid,qid:qid,val:rm[qid]?1:0,path:["state","favRevs",rid,qid],fval:rm[qid]?1:delV});});
    });
    if(!ops.length)return Promise.resolve();
    var chunks=[];for(var i=0;i<ops.length;i+=200)chunks.push(ops.slice(i,i+200));
    return chunks.reduce(function(p,chunk,ci){
      return p.then(function(){
        var pOps=chunk.map(function(o){return {path:o.path,val:o.fval};});
        if(ci===chunks.length-1){pOps.push({path:["updated"],val:Date.now()});pOps.push({path:["lastActive"],val:Date.now()});}
        return patchUserFields(u,pOps).then(function(){
          if(UID!==u)return;
          var curQ=readFavQueue(u);
          chunk.forEach(function(o){
            if(o.kind==="favRevs"){
              if(curQ.favRevs&&curQ.favRevs[o.rid]&&curQ.favRevs[o.rid][o.qid]===o.val)delete curQ.favRevs[o.rid][o.qid];
            }else if(curQ[o.kind]&&curQ[o.kind][o.qid]===o.val)delete curQ[o.kind][o.qid];
          });
          writeFavQueue(u,curQ);
        });
      });
    },Promise.resolve()).then(function(){
      if(UID===u&&!prefsDirty&&!runDirty&&!hasFavPending())saveFail(false);
    }).catch(function(err){console.warn(err);saveFail(true);});
  };
  clearTimeout(favTimer);favTimer=null;
  if(immediate)return run();
  favTimer=setTimeout(run,350);return Promise.resolve();
}

function savePrefs(immediate){
  if(!UID||!DB||!STATE_OK)return Promise.resolve();
  var u=UID,d=DB;
  var flush=function(){
    prefsTimer=null;S.cfg=Object.assign({},V.cfg);saveStateCache();
    var s2=JSON.parse(JSON.stringify(S));
    return d.collection("users").doc(u).set({
      state:{lang:s2.lang,theme:s2.theme,cfg:s2.cfg},
      updated:Date.now(),lastActive:Date.now(),online:true,email:((firebase.auth().currentUser)||{}).email||""
    },{mergeFields:["state.lang","state.theme","state.cfg","updated","lastActive","online","email"]})
      .then(function(){prefsDirty=false;if(!runDirty&&!hasFavPending())saveFail(false);}).catch(function(err){console.warn(err);prefsDirty=true;saveFail(true);});
  };
  clearTimeout(prefsTimer);prefsTimer=null;
  if(immediate)return flush();
  prefsTimer=setTimeout(flush,400);return Promise.resolve();
}

function saveRunExam(ex,immediate){
  if(!UID||!DB||!STATE_OK||!ex||!ex.id||ex.status==="done")return Promise.resolve();
  var u=UID;
  var copy=JSON.parse(JSON.stringify(ex));
  delete copy._finishing;delete copy.dirtyCount;delete copy.pendingFinish;
  var send=function(){
    runSaveTimer=null;
    var ops=[
      {path:["state","runMap",copy.id],val:copy},
      {path:["updated"],val:Date.now()},
      {path:["lastActive"],val:Date.now()},
      {path:["online"],val:true}
    ];
    if(S._userDeleted&&S._userDeleted.length)ops.push({path:["userDeleted"],val:S._userDeleted.slice(-100)});
    return patchUserFields(u,ops).then(function(){
      runDirty=false;if(!prefsDirty&&!hasFavPending())saveFail(false);
    }).catch(function(err){console.warn(err);runDirty=true;saveFail(true);});
  };
  clearTimeout(runSaveTimer);runSaveTimer=null;
  if(immediate)return send();
  runSaveTimer=setTimeout(send,1200);return Promise.resolve();
}

function removeRunExamFromServer(exId){
  if(!UID||!DB||!STATE_OK||!exId)return Promise.resolve();
  var delV=firebase.firestore.FieldValue.delete();
  var ops=[
    {path:["state","runMap",exId],val:delV},
    {path:["state","exams"],val:runningExamsOnly(S.exams).filter(function(x){return x.id!==exId;})},
    {path:["updated"],val:Date.now()}
  ];
  if(S._userDeleted&&S._userDeleted.length)ops.push({path:["userDeleted"],val:S._userDeleted.slice(-100)});
  return patchUserFields(UID,ops).catch(function(err){console.warn(err);runDirty=true;saveFail(true);});
}

function flushPendingRunningExams(){
  if(!UID||!DB||!STATE_OK)return Promise.resolve();
  var ps=[];
  if(favTimer||hasFavPending())ps.push(flushPendingFavs(true));
  if(V.ex&&V.ex.status!=="done"){
    saveRunLocal(V.ex);
    if(V.ex.lock)ps.push(saveDraft(V.ex,true));
    ps.push(saveRunExam(V.ex,true));
  }else if(runSaveTimer||runDirty){
    var run0=S.exams.filter(function(x){return x.status!=="done";})[0];
    if(run0)ps.push(saveRunExam(run0,true));
  }
  if(prefsTimer||prefsDirty)ps.push(savePrefs(true));
  return Promise.all(ps);
}

function retryAll(){
  if(!UID||!DB)return;
  if(V.att&&V.att.err){V.att.loaded=false;V.att.err="";}
  if(V.mtAtt&&V.mtAtt.err){V.mtAtt.loaded=false;V.mtAtt.err="";}
  if(V.trash&&V.trash.err){V.trash.loaded=false;V.trash.err="";}
  if(!Q.length&&!loadingQNow){
    loadingQNow=true;
    loadQuestions().then(function(){
      loadingQNow=false;QERR="";mergeLocalRunningExams();
      retryAll();
      if(STATE_OK&&QMETA.scoreVer>(S.lastScoreSync||0))recomputeMyProgressAndScores(QMETA.scoreVer);
      safeRender();
    }).catch(function(){loadingQNow=false;});
    return;
  }
  if(!STATE_OK){
    loadUserDoc().then(function(){
      if(!STATE_OK)return;
      mergeLocalRunningExams();
      loadDrafts().then(function(){checkExpiredModelTests();render();});
      flushPendingFavs(true);
      if(prefsDirty||prefsTimer)savePrefs(true);
      if(runDirty||runSaveTimer){var r0=S.exams.filter(function(x){return x.status!=="done";})[0];if(r0)saveRunExam(r0,true);}
      if(pendingTx.length)retryAll();
    });
    return;
  }
  if(hasFavPending()||favTimer)flushPendingFavs(true);
  if(prefsDirty||prefsTimer)savePrefs(true);
  if(runDirty||runSaveTimer){var r1=S.exams.filter(function(x){return x.status!=="done";})[0];if(r1)saveRunExam(r1,true);}
  var list=pendingTx.slice();pendingTx=[];
  list.forEach(function(p){
    if(p.kind==="finish"){
      if(!Q.length){pendingTx.push(p);saveFail(true);}
      else commitFinish(p.ex);
    }else txProgress(p.mut,p.key);
  });
}
window.addEventListener("online",function(){if(!STATE_OK||saveFailing||pendingTx.length||hasFavPending()||!Q.length||(V.att&&V.att.err)||(V.mtAtt&&V.mtAtt.err)||(V.trash&&V.trash.err))retryAll();});

function loadDrafts(){
  draftsReady=false;
  var run=S.exams.filter(function(x){return x.lock&&x.status!=="done";});
  return Promise.all(run.map(function(x){
    return DB.collection("users").doc(UID).collection("drafts").doc(x.id).get().then(function(sn){
      if(!sn.exists)return;
      var dt=sn.data()||{},d=dt.a||{};
      Object.keys(d).forEach(function(k){if(x.a[k]===undefined)x.a[k]=d[k];});
      if(dt.left!=null&&(x.left==null||dt.left<x.left))x.left=dt.left;
      if(dt.updated&&(!x.updatedAt||dt.updated>x.updatedAt))x.updatedAt=dt.updated;
      saveRunLocal(x);
    }).catch(function(){});
  })).then(function(r){draftsReady=true;return r;},function(e){draftsReady=true;throw e;});
}

function checkQMismatchAndSync(){
  if(!DB||loadingQNow)return Promise.resolve(false);
  var key=(QMETA.qUpd||0)+":"+(QMETA.totalCount!=null?QMETA.totalCount:"")+":"+(QMETA.fullSyncAt||0);
  if(fullSyncTriedKey===key)return Promise.resolve(false);
  return cacheGet().then(function(c){
    var locFull=(c&&c.fullSyncAt)||0;
    var needFull=(QMETA.fullSyncAt>locFull)||(QMETA.totalCount!=null&&Q.length!==QMETA.totalCount);
    if(!needFull)return false;
    fullSyncTriedKey=key;loadingQNow=true;
    return loadQuestions(true).then(function(){
      loadingQNow=false;QERR="";
      if(STATE_OK&&Q.length)return recomputeMyProgressAndScores(QMETA.scoreVer||S.lastScoreSync||0);
    }).catch(function(){loadingQNow=false;}).then(function(){safeRender();return true;});
  });
}
function watchQMeta(){
  if(qMetaUnsub||!DB)return;
  qMetaUnsub=DB.collection("appConfig").doc("qMeta").onSnapshot(function(sn){
    if(!sn.exists)return;
    var d=sn.data()||{};
    QMETA={qUpd:d.qUpd||0,scoreVer:d.scoreVer||0,totalCount:(d.totalCount!=null?d.totalCount:null),fullSyncAt:d.fullSyncAt||0};
    var localMax=maxUpdOf(RAW);
    if(QMETA.qUpd>localMax&&!loadingQNow){
      loadingQNow=true;
      loadQuestions().then(function(){
        loadingQNow=false;QERR="";
        return checkQMismatchAndSync();
      }).then(function(){
        if(QMETA.scoreVer>(S.lastScoreSync||0)&&!recomputingMine&&Q.length&&STATE_OK)return recomputeMyProgressAndScores(QMETA.scoreVer);
      }).catch(function(){loadingQNow=false;}).then(function(){safeRender();});
    }else{
      checkQMismatchAndSync().then(function(did){
        if(!did&&QMETA.scoreVer>(S.lastScoreSync||0)&&!recomputingMine&&Q.length&&STATE_OK)recomputeMyProgressAndScores(QMETA.scoreVer);
      });

/* ===== ৪. প্রোগ্রেস, রিভিশন Accuracy, ট্র্যাশ ও অ্যাটেম্পটস ===== */
function computeResultStats(ex){
  var ids=(ex.ids||[]).filter(function(id){return !!BY[id];}),c=0,w=0,exNeg=ex.neg!=null?ex.neg:NEG;
  ids.forEach(function(id){var a=(ex.a||{})[id];if(a===undefined)return;a===BY[id].a?c++:w++;});
  return {n:ids.length,c:c,w:w,sk:ids.length-c-w,sc:c-w*exNeg};
}
function applyFinish(st,ex){
  var c=0,w=0;
  (ex.ids||[]).forEach(function(id){
    var a=(ex.a||{})[id];if(a===undefined||!BY[id])return;
    st.seen[id]=1;var s3=st.st[id]=st.st[id]||[0,0];
    if(a===BY[id].a){s3[0]++;c++;delete st.wrong[id];}else{s3[1]++;w++;st.wrong[id]=1;}
  });
  if(ex.favRev){
    st.favRevSt=st.favRevSt||{};
    var rs=st.favRevSt[ex.favRev]=st.favRevSt[ex.favRev]||[0,0];
    rs[0]+=c;rs[1]+=w;
  }
  var r=ex.r||computeResultStats(ex);
  st.hist.unshift({d:ex.finishedAt||ex.at,t:ex.name,n:r.n,c:r.c,w:r.w,sc:r.sc});st.hist=st.hist.slice(0,30);
}
function computeProgressFromAttempts(attempts){
  var active=(attempts||[]).filter(function(ex){return ex&&!ex.deletedAt;});
  active.sort(function(a,b){return ((a.finishedAt||a.at||0)-(b.finishedAt||b.at||0));});
  var seen={},wrong={},st={},hist=[],favRevSt={};
  active.forEach(function(ex){
    var c=0,w=0;
    (ex.ids||[]).forEach(function(id){
      var a=(ex.a||{})[id];if(a===undefined||!BY[id])return;
      seen[id]=1;var s3=st[id]=st[id]||[0,0];
      if(a===BY[id].a){s3[0]++;c++;delete wrong[id];}else{s3[1]++;w++;wrong[id]=1;}
    });
    if(ex.favRev){
      var rs=favRevSt[ex.favRev]=favRevSt[ex.favRev]||[0,0];
      rs[0]+=c;rs[1]+=w;
    }
    var r=ex.r||computeResultStats(ex);
    hist.unshift({d:ex.finishedAt||ex.at||0,t:ex.name,n:r.n,c:r.c,w:r.w,sc:r.sc});
  });
  return {seen:seen,wrong:wrong,st:st,hist:hist.slice(0,30),favRevSt:favRevSt};
}
function sameRes(a,b){
  if(!a||!b)return false;
  return a.n===b.n&&a.c===b.c&&a.w===b.w&&a.sk===b.sk&&Math.abs((a.sc||0)-(b.sc||0))<0.001;
}
function recomputeUserProgressByUid(uid,targetScoreVer){
  if(!uid||!DB||!Q.length)return Promise.resolve(null);
  var uRef=DB.collection("users").doc(uid),em="";
  return Promise.all([uRef.get(),uRef.collection("attempts").get()]).then(function(res){
    var uData=res[0].exists?(res[0].data()||{}):{};em=uData.email||"";
    var snap=res[1],all=[],active=[],expired=[],now=Date.now();
    snap.forEach(function(doc){
      var d=doc.data();if(!d)return;
      if(d.deletedAt&&d.expireAt&&d.expireAt<=now){expired.push(d);return;}
      all.push(d);if(!d.deletedAt)active.push(d);
    });
    var jobs=[];
    expired.forEach(function(ex){
      jobs.push(uRef.collection("attempts").doc(ex.id).delete().catch(function(){}));
      jobs.push(uRef.collection("drafts").doc(ex.id).delete().catch(function(){}));
      if(ex.mtId){
        jobs.push(DB.collection("modelTests").doc(ex.mtId).collection("scores").doc(uid).delete().catch(function(){}));
        jobs.push(DB.collection("mtRestoreRequests").doc(uid+"_"+ex.mtId).delete().catch(function(){}));
      }
    });
    active.forEach(function(ex){
      var nr=computeResultStats(ex);
      if(!sameRes(ex.r,nr)){
        ex.r=nr;
        jobs.push(uRef.collection("attempts").doc(ex.id).update({r:nr}).catch(function(){}));
        if(ex.mtId){
          jobs.push(DB.collection("modelTests").doc(ex.mtId).collection("scores").doc(uid).set({uid:uid,email:em,c:nr.c,w:nr.w,sk:nr.sk,sc:nr.sc,finishedAt:ex.finishedAt||ex.at}).catch(function(){}));
        }
      }
    });
    var prog=computeProgressFromAttempts(active);
    var ver=(targetScoreVer!=null)?targetScoreVer:(QMETA.scoreVer||Date.now());
    var updObj={"state.seen":prog.seen,"state.wrong":prog.wrong,"state.st":prog.st,"state.hist":prog.hist,"state.favRevSt":prog.favRevSt,lastScoreSync:ver,updated:Date.now()};
    jobs.push(uRef.update(updObj).catch(function(){return uRef.set({state:prog,lastScoreSync:ver,updated:Date.now()},{merge:true});}));
    return Promise.all(jobs).then(function(){return {prog:prog,active:active,all:all,scoreVer:ver};});
  });
}

function commitFinish(exRaw){
  if(!UID||!DB)return Promise.resolve();
  var exCopy=JSON.parse(JSON.stringify(exRaw));
  delete exCopy._finishing;delete exCopy.dirtyCount;delete exCopy.pendingFinish;
  var u=UID,d=DB,userRef=d.collection("users").doc(u),attRef=userRef.collection("attempts").doc(exCopy.id);
  var scRef=exCopy.mtId?d.collection("modelTests").doc(exCopy.mtId).collection("scores").doc(u):null,em=((firebase.auth().currentUser)||{}).email||"";
  function scoreDoc(x){var r=x.r||computeResultStats(x);return {uid:u,email:em,c:r.c,w:r.w,sk:r.sk,sc:r.sc,finishedAt:x.finishedAt};}
  finishingCount++;
  return d.runTransaction(function(tx){
    return Promise.all([tx.get(userRef),tx.get(attRef),scRef?tx.get(scRef):Promise.resolve(null)]).then(function(res){
      if(UID!==u)return null;
      var sn=res[0],attSn=res[1],data=sn.data()||{},srv=normalize(data.state),ap=(data.applied||[]).slice(),key="f:"+exCopy.id;
      var runMap=Object.assign({},srv.runMap||{});delete runMap[exCopy.id];
      var remExams=runningExamsOnly(srv.exams).filter(function(x){return x.id!==exCopy.id;});
      if(attSn.exists||ap.indexOf(key)>=0){
        if(scRef&&attSn.exists&&!attSn.data().deletedAt&&!(res[2]&&res[2].exists))tx.set(scRef,scoreDoc(attSn.data()));
        tx.set(userRef,{state:{exams:remExams,runMap:runMap},updated:Date.now()},{mergeFields:["state.exams","state.runMap","updated"]});
        return {alreadyDone:true,srv:srv,existing:attSn.exists?attSn.data():null};
      }
      applyFinish(srv,exCopy);ap.push(key);
      tx.set(attRef,exCopy);
      if(scRef)tx.set(scRef,scoreDoc(exCopy));
      tx.set(userRef,{
        state:{seen:srv.seen,wrong:srv.wrong,st:srv.st,hist:srv.hist,favRevSt:srv.favRevSt,exams:remExams,runMap:runMap},
        applied:ap.slice(-300),updated:Date.now(),lastActive:Date.now(),online:true
      },{mergeFields:["state.seen","state.wrong","state.st","state.hist","state.favRevSt","state.exams","state.runMap","applied","updated","lastActive","online"]});
      return {alreadyDone:false,srv:srv,ap:ap.slice(-300)};
    });
  }).then(function(res){
    finishingCount=Math.max(0,finishingCount-1);
    if(!res||UID!==u)return;
    var srv=res.srv;
    S.seen=srv.seen;S.wrong=srv.wrong;S.st=srv.st;S.hist=srv.hist;S.favRevSt=srv.favRevSt;
    if(res.ap)APPLIED=res.ap;
    S.exams=runningExamsOnly(S.exams).filter(function(x){return x.id!==exCopy.id;});
    removeRunLocal(exCopy.id);
    d.collection("users").doc(u).collection("drafts").doc(exCopy.id).delete().catch(function(){});
    if(res.alreadyDone){
      if(res.existing&&!res.existing.deletedAt){
        if(V.ex&&V.ex.id===exCopy.id)V.ex=res.existing;
        if(res.existing.mtId){
          V.mtAttended[res.existing.mtId]=res.existing;
          if(V.mtAtt.loaded)V.mtAtt.items=[res.existing].concat(V.mtAtt.items.filter(function(x){return x.id!==res.existing.id;}));
        }else{
          V.justDone=V.justDone||{};V.justDone[res.existing.id]=res.existing;
          if(V.att.loaded)V.att.items=[res.existing].concat(V.att.items.filter(function(x){return x.id!==res.existing.id;}));
        }
      }
      saveStateCache();saveFail(false);
      if(res.existing&&exCopy.finishedAt&&res.existing.finishedAt!==exCopy.finishedAt)alert(S.lang==="bn"?"এই পরীক্ষাটি ইতিমধ্যে অন্য ডিভাইস থেকে জমা দেওয়া হয়েছে!":"This exam was already submitted from another device!");
      render();
      return;
    }
    saveStateCache();saveFail(false);
    if(Q.length&&!recomputingMine&&finishingCount===0&&!pendingTx.length)recomputeMyProgressAndScores(QMETA.scoreVer||S.lastScoreSync||0);
  }).catch(function(err){

    if(!pendingTx.some(function(p){return p.kind==="finish"&&p.ex.id===exCopy.id;}))pendingTx.push({kind:"finish",ex:exCopy});
    saveFail(true);
  });
}

function finalizeExamObject(ex,auto,customFinTime){
  if(!ex||ex.status==="done"||ex._finishing)return;
  ex._finishing=true;clearTimeout(draftTimer);draftTimer=null;clearTimeout(runSaveTimer);runSaveTimer=null;
  var r=computeResultStats(ex);
  ex.r=r;ex.status="done";ex.finishedAt=customFinTime||Date.now();ex.v2=1;
  var exCopy=JSON.parse(JSON.stringify(ex));
  delete exCopy._finishing;delete exCopy.dirtyCount;delete exCopy.pendingFinish;
  var pLocal=JSON.parse(JSON.stringify(exCopy));pLocal.pendingFinish=true;saveRunLocal(pLocal);
  applyFinish(S,exCopy);
  S.exams=runningExamsOnly(S.exams).filter(function(x){return x.id!==exCopy.id;});
  if(exCopy.mtId){
    V.mtAttended[exCopy.mtId]=exCopy;
    if(V.mtAtt.loaded)V.mtAtt.items=[exCopy].concat(V.mtAtt.items.filter(function(x){return x.id!==exCopy.id;}));
  }else{
    V.justDone=V.justDone||{};V.justDone[exCopy.id]=exCopy;
    if(V.att.loaded)V.att.items=[exCopy].concat(V.att.items.filter(function(x){return x.id!==exCopy.id;}));
  }
  saveStateCache();
  logUsage("exam_finish",{id:exCopy.id,name:exCopy.name,mtId:exCopy.mtId||null,c:r.c,w:r.w,sc:r.sc,auto:!!auto});
  commitFinish(exCopy);
  return exCopy;
}

function mergeLocalRunningExams(){
  if(!UID)return;
  var localMap=readRunLocal(UID).exams,del=(S._adminDeleted||[]).concat(S._userDeleted||[]),byId={};
  runningExamsOnly(S.exams).forEach(function(x){byId[x.id]=x;});
  Object.keys(localMap).forEach(function(id){
    var loc=localMap[id];if(!loc)return;
    if(del.indexOf(id)>=0){removeRunLocal(id);return;}
    if(loc.pendingFinish){
      delete byId[id];
      if(Q.length&&STATE_OK)commitFinish(loc);
      else if(!pendingTx.some(function(p){return p.kind==="finish"&&p.ex.id===loc.id;}))pendingTx.push({kind:"finish",ex:loc});
      return;
    }
    if(loc.status==="done"){removeRunLocal(id);return;}
    var srv=byId[id];
    byId[id]=srv?mergeExamObjects(loc,srv):loc;
  });
  S.exams=Object.keys(byId).map(function(k){return byId[k];});

function loadMoreAttempts(reset){
  if(!UID||!DB||V.att.loading||(!reset&&!V.att.hasMore))return;
  V.att.loading=true;V.att.err="";
  var target=reset?REG_INIT:REG_MORE,items=reset?[]:V.att.items.slice(),seen={},cursor=reset?null:V.att.lastDoc,added=0;
  items.forEach(function(x){seen[x.id]=1;});
  function step(){
    var qy=DB.collection("users").doc(UID).collection("attempts").orderBy("finishedAt","desc");
    if(cursor)qy=qy.startAfter(cursor);
    return qy.limit(12).get().then(function(snap){
      var docs=snap.docs,more=docs.length===12,broke=false;
      for(var i=0;i<docs.length;i++){
        var d=docs[i].data();
        if(!d){cursor=docs[i];continue;}
        if(d.deletedAt){cursor=docs[i];continue;}
        if(d.mtId){V.mtAttended[d.mtId]=d;cursor=docs[i];continue;}
        if(added>=target){more=true;broke=true;break;}
        cursor=docs[i];
        if(!seen[d.id]){seen[d.id]=1;items.push(d);added++;}
      }
      if(!broke&&more&&added<target)return step();
      if(reset&&V.justDone){

      }
      V.att={items:items,lastDoc:cursor,hasMore:more,loading:false,loaded:true,err:""};

function loadUserAttempts(uid,reset){

  if(!reset&&!V.uatt.hasMore)return;
  V.uatt.loading=true;V.uatt.err="";
  var items=reset?[]:V.uatt.items.slice(),seen={},cursor=reset?null:V.uatt.lastDoc,added=0;
  items.forEach(function(x){seen[x.id]=1;});
  function step(){
    var qy=DB.collection("users").doc(uid).collection("attempts").orderBy("finishedAt","desc");
    if(cursor)qy=qy.startAfter(cursor);
    return qy.limit(12).get().then(function(snap){
      if(V.uatt.uid!==uid)return;
      var docs=snap.docs,more=docs.length===12,broke=false;
      for(var i=0;i<docs.length;i++){
        var d=docs[i].data();
        if(!d||d.deletedAt){cursor=docs[i];continue;}
        if(added>=10){more=true;broke=true;break;}
        cursor=docs[i];
        if(!seen[d.id]){seen[d.id]=1;items.push(d);added++;}
      }
      if(!broke&&more&&added<10)return step();
      V.uatt=Object.assign({},V.uatt,{uid:uid,items:items,lastDoc:cursor,hasMore:more,loading:false,loaded:true,err:""});
      render();
    });
  }
  step().catch(function(err){V.uatt.loading=false;V.uatt.loaded=true;V.uatt.err=err.message;render();});

function idb(){return new Promise(function(res,rej){var r=indexedDB.open("corui-quiz",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv");};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function cacheGet(){return idb().then(function(db){return new Promise(function(res){var t=db.transaction("kv").objectStore("kv").get("questions");t.onsuccess=function(){res(t.result||null);};t.onerror=function(){res(null);};});}).catch(function(){return null;});}
function cachePut(v){return idb().then(function(db){return new Promise(function(res){var t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,"questions");t.oncomplete=function(){res();};t.onerror=function(){res();};});}).catch(function(){});}
function maxUpdOf(map){var m=0;Object.keys(map).forEach(function(k){if((map[k].upd||0)>m)m=map[k].upd||0;});return m;}
function nextUpd(){return Math.max(Date.now(),maxUpdOf(RAW)+1,QMETA.qUpd+1);}
function syncQuestionCache(){
  return cacheGet().then(function(c){
    var fSync=Math.max((c&&c.fullSyncAt)||0,QMETA.fullSyncAt||0);
    return cachePut({ver:CACHE_VER,map:RAW,maxUpd:maxUpdOf(RAW),fullSyncAt:fSync,at:Date.now()});
  });
}
function bumpQMeta(updTs,scoreChanged){
  if(!ADMIN||!DB)return Promise.resolve();
  var u=updTs||nextUpd(),cnt=Object.keys(RAW).filter(function(id){return RAW[id]&&!RAW[id].deleted;}).length;
  var patch={qUpd:u,totalCount:cnt,updated:Date.now()};
  if(scoreChanged)patch.scoreVer=u;
  QMETA.qUpd=Math.max(QMETA.qUpd||0,u);QMETA.totalCount=cnt;
  if(scoreChanged)QMETA.scoreVer=Math.max(QMETA.scoreVer||0,u);
  return DB.collection("appConfig").doc("qMeta").set(patch,{merge:true}).catch(function(){});
}
function buildFrom(map){
  var out={};Object.keys(map).forEach(function(id){var data=map[id];if(data&&!data.deleted)out[id]=Object.assign({},data,{id:id});});
  var arr=Object.keys(out).map(function(k){return out[k];});arr.sort(function(a,b){return (a.ord||0)-(b.ord||0);});
  setQuestions(arr);
}
function loadQuestions(forceFull){
  return cacheGet().then(function(c){
    var have=(!forceFull&&c&&c.ver===CACHE_VER&&c.map)?c:null;
    var map=have?Object.assign({},have.map):{},maxUpd=have?(have.maxUpd||0):0;
    var qy=have?DB.collection("questions").where("upd",">",maxUpd):DB.collection("questions");
    return qy.get().then(function(snap){
      snap.forEach(function(d){var data=d.data();map[d.id]=data;if((data.upd||0)>maxUpd)maxUpd=data.upd||0;});
      RAW=map;buildFrom(map);
      var fSync=have?(c.fullSyncAt||0):Math.max(Date.now(),QMETA.fullSyncAt||0);
      return cachePut({ver:CACHE_VER,map:map,maxUpd:maxUpd,fullSyncAt:fSync,at:Date.now()});
    }).catch(function(err){
      var fb=(have&&map)||(c&&c.map);
      if(fb){RAW=fb;buildFrom(fb);return;}
      throw err;
    });
  });
}
function loadTopicConfig(){
  if(!DB)return Promise.resolve();
  return DB.collection("appConfig").doc("topics").get().then(function(sn){
    TOPIC_LIST=(sn.exists&&Array.isArray(sn.data().list))?sn.data().list:[];

function masterTopics(){

  var out=[],seen={};

function weightedPick(list,n){
  var groups={};list.forEach(function(x){var k=x.s+"||"+x.t;(groups[k]=groups[k]||[]).push(x);});
  var keys=Object.keys(groups),w={};
  keys.forEach(function(k){var qs=groups[k],size=qs.length,att=0,wr=0,fav=0;qs.forEach(function(x){var s=S.st[x.id];if(s){att+=s[0]+s[1];wr+=s[1];}if(S.fav[x.id])fav++;});w[k]=size*(1+(att?wr/att:0)+0.5*(fav/size));});
  var alloc={},total=function(){return keys.reduce(function(a,k){return a+(alloc[k]||0);},0);},guard=0;
  while(total()<n&&guard++<1000){
    var open=keys.filter(function(k){return (alloc[k]||0)<groups[k].length;});if(!open.length)break;
    var sumW=open.reduce(function(a,k){return a+w[k];},0),need=n-total(),progressed=false;
    open.forEach(function(k){var share=Math.max(1,Math.round(need*w[k]/sumW)),g=Math.min(share,groups[k].length-(alloc[k]||0),n-total());if(g>0){alloc[k]=(alloc[k]||0)+g;progressed=true;}});
    if(!progressed)break;
  }
  var result=[];keys.forEach(function(k){result=result.concat(shuffle(groups[k]).slice(0,alloc[k]||0));});
  return shuffle(result);
}

function planSubPick(p,subNMap,reqN){
  var bySub={},subs=[];
  p.forEach(function(x){if(!bySub[x.s]){bySub[x.s]=[];subs.push(x.s);}bySub[x.s].push(x);});
  var custSubs=[],autoSubs=[],custTot=0,autoPool=[];
  subs.forEach(function(s){
    var v=Math.floor(+(subNMap&&subNMap[s]||0));
    if(v>0){var tk=Math.min(v,bySub[s].length);custSubs.push({s:s,qs:bySub[s],take:tk});custTot+=tk;}
    else{autoSubs.push(s);autoPool=autoPool.concat(bySub[s]);}
  });
  var reqTot=Math.max(1,Math.floor(+reqN||1)),autoTake=autoSubs.length?Math.min(Math.max(0,reqTot-custTot),autoPool.length):0;
  return {custSubs:custSubs,autoPool:autoPool,autoTake:autoTake,total:custTot+autoTake};

function pickFromPool(qs,take,rand,useRev,revId){
  if(take<=0||!qs.length)return [];
  if(!useRev)return rand?weightedPick(qs,take):qs.slice(0,take);
  var revMap=getFavRevMap(revId);
  var unseen=qs.filter(function(x){return !revMap[x.id];});
  if(unseen.length>=take){
    var p1=rand?weightedPick(unseen,take):unseen.slice(0,take);
    p1.forEach(function(x){setFavRevSeen(revId,x.id,true);});
    return p1;
  }
  var unseenIds={};unseen.forEach(function(x){unseenIds[x.id]=1;});
  var rest=qs.filter(function(x){return !unseenIds[x.id];});
  qs.forEach(function(x){setFavRevSeen(revId,x.id,false);});
  unseen.forEach(function(x){setFavRevSeen(revId,x.id,true);});
  var need=Math.min(take-unseen.length,rest.length);
  var p2=need>0?(rand?weightedPick(rest,need):rest.slice(0,need)):[];
  p2.forEach(function(x){setFavRevSeen(revId,x.id,true);});
  return unseen.concat(p2);
}

mergeLocalRunningExams=function(){
  if(!UID)return;
  var localMap=readRunLocal(UID).exams,del=(S._adminDeleted||[]).concat(S._userDeleted||[]),byId={};
  runningExamsOnly(S.exams).forEach(function(x){byId[x.id]=x;});
  Object.keys(localMap).forEach(function(id){
    var loc=localMap[id];if(!loc)return;
    if(del.indexOf(id)>=0||APPLIED.indexOf("f:"+id)>=0){removeRunLocal(id);return;}
    if(loc.pendingFinish){
      delete byId[id];
      if(Q.length&&STATE_OK)commitFinish(loc);
      else if(!pendingTx.some(function(p){return p.kind==="finish"&&p.ex.id===loc.id;}))pendingTx.push({kind:"finish",ex:loc});
      return;
    }
    if(loc.status==="done"){removeRunLocal(id);return;}
    var srv=byId[id];
    byId[id]=srv?mergeExamObjects(loc,srv):loc;
    if(!srv&&STATE_OK&&DB){
      DB.collection("users").doc(UID).collection("attempts").doc(id).get().then(function(attSn){
        if(attSn.exists){
          removeRunLocal(id);
          S.exams=S.exams.filter(function(x){return x.id!==id;});
          if(V.ex&&V.ex.id===id&&V.ex.status!=="done"){
            var ex0=attSn.data();
            if(ex0&&!ex0.deletedAt){V.ex=ex0;if(V.screen==="exam")navReplace(function(){V.screen="result";});}
            else{V.ex=null;if(V.screen==="exam")V.screen=null;}
          }
          safeRender();
        }
      }).catch(function(){});
    }
  });
  S.exams=Object.keys(byId).map(function(k){return byId[k];});
};

function syncExamTimer(){
  stopExamTimer();
  if(V.screen!=="exam"||!V.ex||V.ex.status==="done"){stopActiveAttemptWatch();return;}
  watchActiveAttempt(V.ex.id);
  if(!(V.ex.dur>0))return;
  if(V.ex.mtId){
    var mt0=MT_LIST.filter(function(x){return x.id===V.ex.mtId;})[0];
    if(mt0){var rem0=Math.max(0,Math.floor((mt0.endAt-Date.now())/1000));if(V.ex.left==null||rem0<V.ex.left)V.ex.left=rem0;}
  }

  exPingTick=0;

    if(V.screen!=="exam"||!V.ex||V.ex.status==="done"||!(V.ex.dur>0)){stopExamTimer();return;}
    if(V.ex.mtId){
      var mt1=MT_LIST.filter(function(x){return x.id===V.ex.mtId;})[0];

function nz(s){return String(s==null?"":s).replace(/\r\n?/g,"\n").trim();}

function splitSrc(src){
  src=String(src||"").trim();if(!src)return {i:"",y:""};
  var best="";insts.forEach(function(n){if(n&&(src===n||src.indexOf(n+" ")===0)&&n.length>best.length)best=n;});
  if(best)return {i:best,y:src.slice(best.length).trim()};
  var tk=src.split(/\s+/),p=-1;
  for(var j=1;j<tk.length;j++){if(/[0-9\u09E6-\u09EF]/.test(tk[j])){p=j;break;}}
  if(p<0)p=tk.length;
  return {i:tk.slice(0,p).join(" "),y:tk.slice(p).join(" ")};
}

function reqAfter(r){return (r.status==="approved"&&r.final)?r.final:(r.proposed||{});}
function wordDiff(a,b){
  a=nz(a);b=nz(b);
  var A=a.split(/(\s+)/).filter(function(x){return x!=="";}),B=b.split(/(\s+)/).filter(function(x){return x!=="";});
  var n=A.length,m=B.length,i,j;
  function del(s){return '<span class="df-del">'+esc(s)+'</span>';}
  function add(s){return '<span class="df-add">'+esc(s)+'</span>';}
  if(n*m>160000)return {a:del(a),b:add(b)};
  var dp=[];for(i=0;i<=n;i++){dp.push([]);for(j=0;j<=m;j++)dp[i].push(0);}
  for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  var oh="",nh="";i=0;j=0;
  while(i<n&&j<m){
    if(A[i]===B[j]){oh+=esc(A[i]);nh+=esc(B[j]);i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){oh+=del(A[i]);i++;}
    else{nh+=add(B[j]);j++;}
  }
  while(i<n){oh+=del(A[i]);i++;}
  while(j<m){nh+=add(B[j]);j++;}
  return {a:oh,b:nh};
}
function reqFields(r){

  if(cur.s!=null&&p.s!=null)add("s","বিষয়",cur.s,p.s);
  if(cur.t!=null&&p.t!=null)add("t","টপিক",cur.t,p.t);
  add("q","প্রশ্ন",cur.q,p.q!=null?p.q:cur.q,{text:true});
  for(var k=0;k<4;k++){
    var oa=(cur.o||[])[k]||"",ob=(p.o||cur.o||[])[k]||"";
    if(!oa&&!ob)continue;
    add("o"+k,"অপশন "+L[k],oa,ob,{text:true});
  }
  if(p.a!=null){
    var ca=cur.a==null?0:cur.a,po=p.o||cur.o||[];
    var xa=add("a","সঠিক উত্তর",L[ca]+") "+((cur.o||[])[ca]||""),L[p.a]+") "+(po[p.a]||""),{crit:true});
    xa.changed=(ca!==p.a);
  }
  add("src","সোর্স ও সাল",srcStr(cur),srcStr(p));
  add("diff","কঠিনতা",diffLbl(cur.diff||"easy"),diffLbl(p.diff||cur.diff||"easy"));
  add("expl","ব্যাখ্যা",explOf(cur),explOf(p),{text:true});
  return f;
}
function reqStale(r){
  var o=r.original,c=BY[r.qid];if(!o||!c)return false;
  if(o.s!=null&&nz(o.s)!==nz(c.s))return true;
  if(o.t!=null&&nz(o.t)!==nz(c.t))return true;
  if(nz(o.q)!==nz(c.q))return true;
  for(var k=0;k<4;k++){if(nz((o.o||[])[k])!==nz((c.o||[])[k]))return true;}
  if(o.a!=null&&o.a!==c.a)return true;
  if(nz(srcStr(o))!==nz(srcStr(c)))return true;
  if((o.diff||"easy")!==(c.diff||"easy"))return true;
  if(explOf(o)!==explOf(c))return true;
  return false;
}

}

  Object.keys(LOG_LABELS).forEach(function(k){h+='<option value="'+k+'"'+(V.ulog.type===k?" selected":"")+'>'+LOG_LABELS[k]+'</option>';});
  h+='</select></div><input type="text" id="ulog-q" placeholder="ইমেইল বা UID লিখে খুঁজুন…" value="'+esc(V.ulog.q||"")+'"><button class="btn alt sm" data-act="ulog-refresh" style="margin-top:6px">↻ রিফ্রেশ</button></div>';
  if(V.ulog.err)h+='<div class="panel" style="color:var(--bad)">লোড হয়নি: '+esc(V.ulog.err)+'</div>';
  if(V.ulog.loading&&!V.ulog.items.length)return h+'<p class="meta">লোড হচ্ছে…</p>';
  return h+'<div id="ulog-list"></div>';

/* ===== ইমপোর্ট হিস্ট্রি (৭টি করে), ৭ দিনের ট্র্যাশ ও Safe/Force Mode ===== */
function loadHistActive(reset){
  var H=V.histState;if(H.loading||(!reset&&!H.hasMore))return;
  H.loading=true;H.err="";
  if(reset){H.items=[];H.batchCursor=null;H.legacyCursor=null;H.batchDone=false;H.legacyDone=false;}
  var items=H.items.slice(),seen={},added=0;items.forEach(function(x){seen[x.fid]=1;});
  function step(){
    if(!H.batchDone){
      var q1=DB.collection("importBatches").orderBy("at","desc");
      if(H.batchCursor)q1=q1.startAfter(H.batchCursor);
      return q1.limit(12).get().then(function(snap){
        var docs=snap.docs;if(docs.length<12)H.batchDone=true;
        for(var i=0;i<docs.length;i++){
          var d=docs[i].data();
          if(added>=HIST_PAGE){H.batchDone=false;return true;}
          H.batchCursor=docs[i];
          if(d&&!d.trashedAt&&!seen[docs[i].id]){
            seen[docs[i].id]=1;
            items.push({fid:docs[i].id,bid:d.bid||docs[i].id,at:d.at||0,label:d.label||"JSON ইমপোর্ট",count:d.count||0,chunks:d.chunks||1,legacy:false});
            added++;
          }
        }
        if(added<HIST_PAGE)return step();
        return true;
      });
    }
    if(!H.legacyDone){
      var q2=DB.collection("adminLog").orderBy("at","desc");
      if(H.legacyCursor)q2=q2.startAfter(H.legacyCursor);
      return q2.limit(20).get().then(function(snap){
        var docs=snap.docs;if(docs.length<20)H.legacyDone=true;
        for(var i=0;i<docs.length;i++){
          var d=docs[i].data();
          if(added>=HIST_PAGE){H.legacyDone=false;return true;}
          H.legacyCursor=docs[i];
          if(d&&/ইমপোর্ট/.test(d.label||"")&&!seen["leg_"+docs[i].id]){
            seen["leg_"+docs[i].id]=1;
            items.push({fid:"leg_"+docs[i].id,legId:docs[i].id,at:d.at||0,label:d.label||"",count:(d.changes||[]).length,changes:d.changes||[],legacy:true});
            added++;
          }
        }
        if(added<HIST_PAGE&&!H.legacyDone)return step();
        return true;
      });
    }
    return Promise.resolve(false);
  }
  step().then(function(){
    H.items=items;H.hasMore=!(H.batchDone&&H.legacyDone);H.loading=false;H.loaded=true;render();
  }).catch(function(err){H.loading=false;H.loaded=true;H.err=err.message;render();});
}
function loadHistTrash(){
  var H=V.histState;if(H.trashLoading)return;
  H.trashLoading=true;H.err="";
  DB.collection("importBatches").where("trashedAt",">",0).get().then(function(snap){
    var tr=[],exp=[],now=Date.now();
    snap.forEach(function(doc){
      var d=doc.data();if(!d||!d.trashedAt)return;
      if(d.expireAt&&d.expireAt<=now)exp.push(doc.id);
      else tr.push(Object.assign({fid:doc.id,bid:d.bid||doc.id},d));
    });
    tr.sort(function(a,b){return (b.trashedAt||0)-(a.trashedAt||0);});
    H.trash=tr;H.trashLoaded=true;H.trashLoading=false;
    if(exp.length)Promise.all(exp.map(function(id){return purgeImportBatch(id,true);})).catch(function(){});
    render();
  }).catch(function(err){H.trashLoading=false;H.trashLoaded=true;H.err=err.message;render();});
}
function loadBatchChanges(item){
  if(item.legacy)return Promise.resolve(item.changes||[]);
  return DB.collection("importBatches").doc(item.bid).collection("chunks").get().then(function(snap){
    var chs=[];snap.forEach(function(d){chs.push(d.data());});
    chs.sort(function(a,b){return (a.idx||0)-(b.idx||0);});
    var all=[];chs.forEach(function(c){all=all.concat(c.changes||[]);});
    item.changes=all;return all;
  });
}
function promoteLegacyImport(item){
  var now=item.at||Date.now(),bid="ib_leg_"+item.legId,bRef=DB.collection("importBatches").doc(bid),chs=[],all=item.changes||[];
  for(var i=0;i<all.length;i+=400)chs.push(all.slice(i,i+400));
  return bRef.set({bid:bid,at:now,by:"",label:item.label||"JSON ইমপোর্ট",count:all.length,chunks:chs.length,trashedAt:null,trashedBy:null,expireAt:null,skippedIds:[]})
    .then(function(){return Promise.all(chs.map(function(c,ci){return bRef.collection("chunks").doc(String(ci)).set({idx:ci,changes:c});}));})
    .then(function(){return DB.collection("adminLog").doc(item.legId).delete().catch(function(){});})
    .then(function(){return {fid:bid,bid:bid,at:now,label:item.label,count:all.length,chunks:chs.length,changes:all,legacy:false};});
}
function findHistItem(fid){
  var H=V.histState;
  return H.items.filter(function(x){return x.fid===fid;})[0]||H.trash.filter(function(x){return x.fid===fid;})[0]||null;
}
function trashImportBatch(fid,mode){
  var H=V.histState,item=findHistItem(fid);if(!item||H.busy)return;
  H.busy=true;render();
  (item.legacy?promoteLegacyImport(item):Promise.resolve(item)).then(function(realItem){
    return loadBatchChanges(realItem).then(function(changes){return {item:realItem,changes:changes};});
  }).then(function(res){
    var realItem=res.item,changes=res.changes,conflicts=[];
    changes.forEach(function(c){
      var cur=RAW[c.id]||null;
      if(!impSame(normQForCmp(cur),normQForCmp(c.after))){
        conflicts.push({id:c.id,q:(cur&&cur.q)||(c.after&&c.after.q)||c.id});
      }
    });
    if(conflicts.length&&!mode){
      H.busy=false;
      H.conflict={action:"trash",fid:realItem.fid,bid:realItem.bid,label:realItem.label,conflicts:conflicts,total:changes.length};
      H.items=H.items.map(function(x){return x.fid===fid?realItem:x;});
      render();return;
    }
    if(!mode&&!confirm("এই ইমপোর্টটি ('"+realItem.label+"', "+changes.length+"টি প্রশ্ন) ট্র্যাশে পাঠাবেন?\r\nনতুন যোগ হওয়া প্রশ্ন সরে যাবে এবং আপডেট হওয়া প্রশ্ন আগের অবস্থায় ফিরে যাবে।")){
      H.busy=false;render();return;
    }
    var confMap={};conflicts.forEach(function(x){confMap[x.id]=1;});
    var now=nextUpd(),skipped=[],toWrite=[],scoreChanged=false;
    changes.forEach(function(c){
      if(confMap[c.id]&&mode==="safe"){skipped.push(c.id);return;}
      var cur=RAW[c.id]||null,tgt;
      if(c.before===null){
        tgt={deleted:true,id:c.id,upd:now};
        if(cur&&!cur.deleted)scoreChanged=true;
      }else{
        tgt=Object.assign({},c.before,{upd:now});
        if(!cur||cur.deleted||cur.a!==tgt.a||cur.s!==tgt.s||cur.t!==tgt.t)scoreChanged=true;
      }
      toWrite.push({id:c.id,doc:tgt});
    });
    var ops=[];for(var i=0;i<toWrite.length;i+=400)ops.push(toWrite.slice(i,i+400));
    var em=((firebase.auth().currentUser)||{}).email||"",trAt=Date.now();
    return ops.reduce(function(p,chunk){
      return p.then(function(){var b=DB.batch();chunk.forEach(function(o){b.set(DB.collection("questions").doc(o.id),o.doc);});return b.commit();});
    },Promise.resolve()).then(function(){
      toWrite.forEach(function(o){RAW[o.id]=o.doc;});
      return DB.collection("importBatches").doc(realItem.bid).update({trashedAt:trAt,trashedBy:em,expireAt:trAt+TRASH_MS,skippedIds:skipped});
    }).then(function(){
      return Promise.all([syncQuestionCache(),bumpQMeta(now,scoreChanged)]);
    }).then(function(){
      buildFrom(RAW);H.busy=false;H.conflict=null;H.folder=null;H.loaded=false;H.trashLoaded=false;
      alert("ইমপোর্টটি ৭ দিনের জন্য ট্র্যাশে পাঠানো হয়েছে। ("+toWrite.length+"টি প্রশ্ন আগের অবস্থায় ফিরেছে"+(skipped.length?", "+skipped.length+"টি কনফ্লিক্ট প্রশ্ন সেফ মোডে অপরিবর্তিত আছে":"")+")");
      render();
    });
  }).catch(function(err){H.busy=false;alert("সমস্যা: "+err.message);render();});
}
function restoreImportBatch(fid,mode){
  var H=V.histState,item=findHistItem(fid);if(!item||H.busy)return;
  H.busy=true;render();
  loadBatchChanges(item).then(function(changes){
    var skipSet={};(item.skippedIds||[]).forEach(function(id){skipSet[id]=1;});
    var activeChanges=changes.filter(function(c){return !skipSet[c.id];}),conflicts=[];
    activeChanges.forEach(function(c){
      var cur=RAW[c.id]||null,exp=c.before?normQForCmp(c.before):{deleted:true};
      if(!impSame(normQForCmp(cur),exp)){
        conflicts.push({id:c.id,q:(cur&&cur.q)||(c.after&&c.after.q)||c.id});
      }
    });
    if(conflicts.length&&!mode){
      H.busy=false;H.conflict={action:"restore",fid:item.fid,bid:item.bid,label:item.label,conflicts:conflicts,total:activeChanges.length};render();return;
    }
    if(!mode&&!confirm("এই ইমপোর্টটি ('"+item.label+"') ট্র্যাশ থেকে ফিরিয়ে আনবেন?")){
      H.busy=false;render();return;
    }
    var confMap={};conflicts.forEach(function(x){confMap[x.id]=1;});
    var now=nextUpd(),toWrite=[],scoreChanged=false;
    activeChanges.forEach(function(c){
      if(confMap[c.id]&&mode==="safe")return;
      var cur=RAW[c.id]||null,tgt=Object.assign({},c.after,{upd:now});delete tgt.deleted;
      if(!cur||cur.deleted||cur.a!==tgt.a||cur.s!==tgt.s||cur.t!==tgt.t)scoreChanged=true;
      toWrite.push({id:c.id,doc:tgt});
    });
    var ops=[];for(var i=0;i<toWrite.length;i+=400)ops.push(toWrite.slice(i,i+400));
    var delV=firebase.firestore.FieldValue.delete();
    return ops.reduce(function(p,chunk){
      return p.then(function(){var b=DB.batch();chunk.forEach(function(o){b.set(DB.collection("questions").doc(o.id),o.doc);});return b.commit();});
    },Promise.resolve()).then(function(){
      toWrite.forEach(function(o){RAW[o.id]=o.doc;});
      return DB.collection("importBatches").doc(item.bid).update({trashedAt:delV,trashedBy:delV,expireAt:delV,skippedIds:delV});
    }).then(function(){
      return Promise.all([syncQuestionCache(),bumpQMeta(now,scoreChanged)]);
    }).then(function(){
      buildFrom(RAW);H.busy=false;H.conflict=null;H.folder=null;H.loaded=false;H.trashLoaded=false;
      alert("ইমপোর্টটি সফলভাবে ফিরিয়ে আনা হয়েছে ("+toWrite.length+"টি প্রশ্ন)।");render();
    });
  }).catch(function(err){H.busy=false;alert("সমস্যা: "+err.message);render();});
}
function purgeImportBatch(bid,silent){
  var bRef=DB.collection("importBatches").doc(bid);
  return bRef.collection("chunks").get().then(function(snap){
    var b=DB.batch();snap.forEach(function(d){b.delete(d.ref);});b.delete(bRef);return b.commit();
  }).then(function(){
    if(!silent){V.histState.trash=V.histState.trash.filter(function(x){return x.bid!==bid;});render();}
  });
}

TR_PAIRS.sort(function(a,b){return b[0].length-a[0].length;});
function tr(html){if((S.lang||"en")!=="en")return html;html=html.replace(/(\d)\s*(টি|জন)/g,"$1");for(var i=0;i<TR_PAIRS.length;i++)html=html.split(TR_PAIRS[i][0]).join(TR_PAIRS[i][1]);return html;}
function trDom(root){
  if((S.lang||"en")!=="en"||!root)return;
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),nodes=[];
  while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(function(n){var p=n.parentNode;if(p&&p.closest&&p.closest(".q,.opt span,.exp,[data-notr],.sugg-list,.dup-warn"))return;var t=n.nodeValue;if(!/[\u0980-\u09FF]/.test(t))return;n.nodeValue=tr(t);});
  root.querySelectorAll("[placeholder]").forEach(function(el){el.placeholder=tr(el.placeholder);});
}

var _lastV="";
function render(){
  document.documentElement.lang=(S.lang==="bn")?"bn":"en";
  var s=V.screen,y=app.scrollTop;
  if(!booted){stopExamTimer();document.getElementById("nav").innerHTML="";app.innerHTML='<p class="meta">লোড হচ্ছে…</p>';return;}
  if(!UID){stopExamTimer();document.getElementById("nav").innerHTML="";app.innerHTML=authScreen();return;}
  var html;
  if(V.edit&&ADMIN)html=editForm();
  else if(s==="reqedit")html=reqEditForm();
  else if(s==="myreqs")html=myReqsView();
  else if(s==="mtlb")html=mtLeaderboardView();
  else if(s==="uwrong")html=usrWrongView();
  else if(s==="wrong")html=wrongView();
  else if(s==="exam")html=exam();
  else if(s==="result")html=result();
  else if(s==="browse")html=browse();
  else if(V.tab==="home")html=home();
  else if(V.tab==="users"&&ADMIN)html=usrView();
  else if(V.tab==="exams")html=examsView();
  else if(V.tab==="prog")html=prog();
  else if(V.tab==="admin"&&ADMIN)html=adminView();
  else html=listTab(V.tab==="admin"?"fav":V.tab);

  app.innerHTML=qErrBanner()+html;trDom(app);
  if(V.tab==="home"&&!V.screen&&!V.edit)renderHomeSearch();
  if(V.tab==="admin"&&ADMIN&&!V.edit&&V.admLog&&!V.imp)renderUsageLogList();
  if(V.tab==="admin"&&ADMIN&&!V.edit&&!V.admReqs&&!V.admMT&&!V.admMTCreate&&!V.admMTView&&!V.admPickKey&&!V.admHist&&!V.admLog&&!V.admTopics&&!(V.adm&&V.adm.key)&&!V.imp)renderAdmSearch();
  if(V.tab==="users"&&ADMIN&&!V.usrSel&&!V.edit&&V.usrList)renderUserList();
  if(V.edit&&ADMIN)checkAdminDup();
  if(V.tab==="admin"&&ADMIN&&V.admReqs&&!V.reqRev&&V.reqTab==="history"&&!V.reqHist.loaded&&!V.reqHist.loading)loadReqHist(true);
  nav();trDom(document.getElementById("nav"));
  var curV=V.admPickKey?("pick:"+V.admPickKey):(V.admMTCreate&&V.tab==="admin"?"mtform":(V.admLog&&V.tab==="admin"?"ulog":(V.admTopics&&V.tab==="admin"?"topics":(V.admHist&&V.tab==="admin"?"hist":""))));
  app.scrollTop=(s==="exam"||(curV&&curV===_lastV))?y:0;
  _lastV=curV;syncExamTimer();
}

  }
});

document.getElementById("nav").addEventListener("click",function(e){var t=e.target.closest("button");if(t)goTab(t.dataset.tab);});
app.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("#retryQ");if(!b||!DB)return;
  b.disabled=true;b.textContent="লোড হচ্ছে…";
  loadQuestions().then(function(){
    QERR="";mergeLocalRunningExams();
    if(STATE_OK&&QMETA.scoreVer>(S.lastScoreSync||0))recomputeMyProgressAndScores(QMETA.scoreVer);
    return loadTopicConfig();
  }).catch(function(err){QERR=(err&&err.message)||"error";}).then(function(){render();});
});
boot();
</script>
